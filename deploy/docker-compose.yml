#
# Run from the repository root after `cp .env.example .env`:
#   docker compose -f deploy/docker-compose.yml up -d
# It pulls the published image (OHS_VERSION picks the tag, default 0.1.0). To
# build from source instead, add the overlay deploy/docker-compose.build.yml.
# Needs Docker Compose v2.24 or later (env_file path/required syntax).
# POSTGRES_PASSWORD is optional (default "ohs"); the database is not published
# outside the compose network. To set one, add `--env-file .env` to every
# compose command (compose reads variables for interpolation from deploy/.env,
# not from the repository root).
# OHS_HTTP_PORT picks the host port (default 8080); set OHS_PUBLIC_URL to match.
# The port listens on 127.0.0.1 only: put a reverse proxy with TLS in front, or
# set OHS_HTTP_BIND=0.0.0.0 to publish plain http on every interface.
# A second install on the same host needs its own project name (-p, or
# COMPOSE_PROJECT_NAME) and its own OHS_HTTP_PORT: see docs/self-hosting.md.
name: ohs

services:
  postgres:
    # Multi-arch index digest of timescale/timescaledb:latest-pg17 (amd64 + arm64).
    image: timescale/timescaledb:latest-pg17@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ohs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohs}
      POSTGRES_DB: ohs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ohs -d ohs"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ohs:
    image: ghcr.io/soma-intelligence/open-health-sync:${OHS_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: true
    environment:
      # pool_max_conns: the size docs/self-hosting.md recommends for all roles
      # in one process (pgx would otherwise size it to the CPU count).
      OHS_DATABASE_URL: postgres://ohs:${POSTGRES_PASSWORD:-ohs}@postgres:5432/ohs?sslmode=disable&pool_max_conns=20
    command: ["up"] # ohs migrate up && ohs serve
    # On SIGTERM ohs gives work in flight 25 s plus a 3 s margin; compose
    # must not kill it before (its default is 10 s).
    stop_grace_period: 35s
    ports:
      - "${OHS_HTTP_BIND:-127.0.0.1}:${OHS_HTTP_PORT:-8080}:8080"
    volumes:
      - raw:/var/lib/ohs/raw
    healthcheck:
      test: ["CMD", "/ohs", "doctor", "--quick"]
      interval: 10s
      timeout: 12s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  raw:
