#
# Overlay: keep raw files in a local S3 compatible store (VersityGW, POSIX
# backend) instead of a plain directory.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.s3.yml up -d
# Use a real S3 bucket instead by setting OHS_RAW_STORE (and AWS_* credentials)
# in .env and skipping this overlay.
services:
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    restart: unless-stopped
    # Never add --nometa: conditional writes (If-None-Match) need the metadata.
    command: ["--port", ":7070", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-ohsaccess}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-ohssecret-change-me}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    image: amazon/aws-cli:2.38.0
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    # Idempotent: create the bucket only when it is missing.
    entrypoint:
      - sh
      - -c
      - aws --endpoint-url http://s3:7070 s3api head-bucket --bucket ohs-raw || aws --endpoint-url http://s3:7070 s3 mb s3://ohs-raw
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ohsaccess}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ohssecret-change-me}
      AWS_DEFAULT_REGION: us-east-1

  ohs:
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      OHS_RAW_STORE: s3://ohs-raw?endpoint=http://s3:7070&region=us-east-1&path_style=true
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ohsaccess}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ohssecret-change-me}

volumes:
  s3data:
