#
# Overlay for a Raspberry Pi 5 with 4 GB of memory.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.pi.yml up -d
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
      - -c
      - timescaledb.max_background_workers=4
  ohs:
    environment:
      GOMEMLIMIT: 256MiB
      # One upload can hold 64 MiB of body plus decompression buffers.
      OHS_INGEST_CONCURRENCY: "2"
      # A Pi serves one household: its tenant may use both slots.
      OHS_INGEST_TENANT_CONCURRENCY: "2"
    mem_limit: 512m
