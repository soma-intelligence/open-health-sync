{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ohs.fullname" . }}
  labels:
    {{- include "ohs.labels" . | nindent 4 }}
spec:
  # Every pod of the release, the migration Job included.
  podSelector:
    matchLabels:
      {{- include "ohs.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS, wherever the cluster resolver runs.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: {{ $np.databasePort }}
          protocol: TCP
      {{- with $np.databaseTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if $np.allowHTTPS }}
    # Provider APIs, S3 and webhook endpoints.
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
