{{- if not .Values.existingSecret }}
{{- $name := include "ohs.secretName" . }}
{{- $key := .Values.encryptionKey }}
{{- if not $key }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $old $old.data (hasKey $old.data "OHS_ENCRYPTION_KEY") }}
{{- $key = index $old.data "OHS_ENCRYPTION_KEY" | b64dec }}
{{- else }}
{{- $key = randBytes 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ohs.labels" . | nindent 4 }}
  annotations:
    # A hook, so it exists before the migration Job runs. Hook resources are
    # not deleted with the release: the encryption key survives an uninstall.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  OHS_DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  OHS_ENCRYPTION_KEY: {{ $key | b64enc | quote }}
  {{- with .Values.rawStore.s3.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.rawStore.s3.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
