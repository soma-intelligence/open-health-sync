{{/* `helm test <release>`: the Service answers /healthz and /readyz. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ohs.fullname" . }}-test
  # Not the release's selector labels: the NetworkPolicy, when enabled, must
  # not apply to this client pod.
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ["sh", "-c"]
      args:
        - >-
          wget -q -O - http://{{ include "ohs.fullname" . }}:{{ .Values.service.port }}/healthz &&
          wget -q -O - http://{{ include "ohs.fullname" . }}:{{ .Values.service.port }}/readyz
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
