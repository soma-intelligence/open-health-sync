  '''[a-z]{3}testsecret-[0-9]+''',
  # the invented share link key of the viewer test fixture: the bytes 0 to 31
  '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8''',
  # the Eight Sleep app's client secret, public in pyEight (connectors/eightsleep)
  '''f0954a3ed5763ba3d06834c73731a32f15f168f47d4f164751275def86db0c76''',
]
