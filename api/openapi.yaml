          description: Canonical activity type (running, cycling...); all when absent.
          schema: { type: string, examples: [running] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
