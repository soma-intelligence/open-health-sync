        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Observation:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [fhir]
      operationId: searchFHIRObservations
      summary: The user's records as FHIR R4 Observations
      description: |
        The user's records as one FHIR R4 (4.0.1) `searchset` Bundle of Observations,
        `Content-Type: application/fhir+json`: quantity samples (`qs-` ids), blood pressure
        panels pairing a systolic and a diastolic sample (`bp-`), sleep sessions (`sleep-`),
        workouts (`workout-`) and daily summaries (`daily-`), merged in time order (a
        sample's start, a bedtime, a workout's start, a day at midnight UTC), then by kind
        and id. Paged like every list: the Bundle's `next` link carries the cursor, and
        there is no `next` link on the last page; `total` is left out. A blood pressure pair
        is never split across pages, and its two samples are not listed on their own.
        Vital signs meet the R4 vital signs profiles they claim in `meta.profile`. The
        mapping (codes, units, categories, provenance and limits) is in docs/fhir.md. The
        filters below combine: a record is listed when it matches all of them. Errors are
        `application/problem+json` like the rest of the API.
      parameters:
        - name: type
          in: query
          description: |
            Canonical quantity type, for example heart_rate: only quantity samples of that
            type, and the blood pressure panels holding a sample of it. Optional; a name
            outside the quantity type catalog is a 400 (unless this user has samples of it).
          schema: { type: string }
        - name: code
          in: query
          description: |
            A FHIR token `system|code` matched against `Observation.code`: a LOINC code
            (`http://loinc.org|8867-4`; 85354-9, 8480-6 and 8462-4 find the blood pressure
            panels, 93832-4 the sleep sessions, 55411-3 the workouts), a quantity type
            (`https://github.com/soma-intelligence/open-health-sync/fhir/CodeSystem/quantity-type|heart_rate`,
            like `type`), or a record type
            (`https://github.com/soma-intelligence/open-health-sync/fhir/CodeSystem/record-type|`
            `blood_pressure`, `sleep_session`, `workout` or `daily_summary`). One value; other
            systems are a 400. A code no Observation carries is an empty Bundle.
          schema: { type: string, examples: ["http://loinc.org|8867-4"] }
        - name: category
          in: query
          description: |
            An HL7 observation category code, bare or as
            `http://terminology.hl7.org/CodeSystem/observation-category|code`: `vital-signs`,
            `laboratory` or `activity` (activity samples, workouts and daily summaries). One
            value. Another code of that system is an empty Bundle; anything else is a 400.
          schema: { type: string, examples: [vital-signs] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by effective start time.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Observation/{observation_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: observation_id
        in: path
        required: true
        description: |
          The Observation id, as the Bundle gives it: `qs-`, `bp-` (the systolic sample's
          id), `sleep-`, `workout-` or `daily-`, then the stored row id.
        schema: { type: string, examples: [qs-1234, bp-1235, sleep-77] }
    get:
      tags: [fhir]
      operationId: readFHIRObservation
      summary: One FHIR R4 Observation
      description: |
        The Observation an entry's `fullUrl` points to. Not the user's, not an id of these
        forms, or not of that shape (`qs-` of a sample that is half of a blood pressure
        panel, `bp-` of a sample that is not) is a 404.
      responses:
        "200":
          description: The Observation.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRObservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/omh/data-points:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [omh]
      operationId: listOMHDataPoints
      summary: The user's records as Open mHealth data points
      description: |
        The user's records as Open mHealth data points (a `header` and a `body` that follows one
        schema of the Open mHealth catalog, checked against the official schemas): heart rate,
        steps, blood pressure, body weight, height, BMI, body fat, body temperature, oxygen
        saturation, respiratory rate, blood glucose and active energy samples, sleep sessions
        (`sleep-episode`) and workouts (`physical-activity`). In the order and with the cursor of
        the FHIR search; a record without an Open mHealth schema (another quantity type, a
        daily summary, a value in another unit) is left out, so a page can hold fewer than
        `limit` data points and still have a `next_cursor`. The mapping is in
        docs/open-mhealth.md.
      parameters:
        - name: schema
          in: query
          description: |
            Only the data points of one schema, bare (`heart-rate`) or with its namespace and,
            optionally, its version (`omh:heart-rate`, `omh:heart-rate:2.0`). One value; a
            schema the mapping does not emit is a 400.
          schema: { type: string, examples: [omh:heart-rate] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OMHDataPointPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/exports/{dataset}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: dataset
        in: path
        required: true
        description: The list to export. Another name is a 404.
        schema:
          type: string
          enum: [samples, category-samples, sleep, workouts, nutrition, daily]
    get:
      tags: [exports]
      operationId: exportDataset
      summary: One list of the user as a CSV or Parquet file
      description: |
        Every record of one list in `[start, end)`, as one file streamed in a single response
        (`Content-Disposition: attachment`). The columns are the members of the list's JSON
        records, in the same order and with the same names and values: times in UTC, a missing
        value empty (CSV) or null (Parquet), `metadata` as JSON text. `samples` holds every
        quantity type unless `type` names one. The file is not paged: `cursor` and `limit` are
        a 400. A failure once the file has started cuts the connection, so a truncated file
        never looks complete. See docs/exports.md.
      parameters:
        - name: format
          in: query
          description: "`csv` (the default) or `parquet`."
          schema: { type: string, enum: [csv, parquet], default: csv }
        - name: type
          in: query
          description: The canonical type to keep, for the lists that have one (samples, category-samples, workouts).
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<dataset>-<user id>.<format>"`'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
            application/vnd.apache.parquet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ingest/apple-health:
    post:
      tags: [ingest]
      operationId: ingestAppleHealth
      summary: Upload one part of an Apple Health export
      description: |
        One gzip NDJSON part (at most 64 MiB, never truncated), one data type per part.
        Re-sending the same part is safe: the answer is 200 with `duplicate: true`. Other
        bytes under a (day, batch, part) already stored are a 409, and so is a part sent while
        this provider's data is being deleted for the user (nothing is kept; send it again
        once the deletion job is done). Each instance processes a
        bounded number of uploads at once; above it the answer is 503 with `Retry-After`.
      security:
        - userToken: [upload]
      parameters:
        - name: X-OHS-Type
          in: header
          required: true
          description: HealthKit type identifier of every line of the part.
          schema: { type: string }
        - name: X-OHS-Day
          in: header
          required: true
          schema: { type: string, format: date }
        - name: X-OHS-Batch
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-OHS-Part
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, contentEncoding: binary }
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        "200":
          description: Stored (or already stored) and queued for processing.
          content:
            application/json:
              schema:
                type: object
                required: [key, duplicate]
                properties:
                  key: { type: string, description: Raw object key. }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The user started being deleted while this upload was stored (its token was accepted just before); nothing is kept.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503":
          description: Too many uploads in progress on this instance.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/ingest/health-connect:
    post:
      tags: [ingest]
      operationId: ingestHealthConnect
      summary: Upload one part of Android Health Connect records
      description: |
        One gzip NDJSON part (at most 64 MiB, never truncated), one Health Connect record per
        line, each a JSON object with a `recordType` (the line format is in
        docs/connectors/health-connect.md). Same headers, limits and answers as the Apple Health
        upload.
        Re-sending the same part is safe: the answer is 200 with `duplicate: true`. Other
        bytes under a (day, batch, part) already stored are a 409, and so is a part sent while
        this provider's data is being deleted for the user (nothing is kept; send it again
        once the deletion job is done). Each instance processes a
        bounded number of uploads at once; above it the answer is 503 with `Retry-After`.
      security:
        - userToken: [upload]
      parameters:
        - name: X-OHS-Type
          in: header
          required: true
          description: Health Connect record type of the lines of the part (for example BloodGlucose).
          schema: { type: string }
        - name: X-OHS-Day
          in: header
          required: true
          schema: { type: string, format: date }
        - name: X-OHS-Batch
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-OHS-Part
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, contentEncoding: binary }
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        "200":
          description: Stored (or already stored) and queued for processing.
          content:
            application/json:
              schema:
                type: object
                required: [key, duplicate]
                properties:
                  key: { type: string, description: Raw object key. }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The user started being deleted while this upload was stored (its token was accepted just before); nothing is kept.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503":
          description: Too many uploads in progress on this instance.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /connect:
    get:
      tags: [connections]
      operationId: connectPage
      summary: Hosted connection page
      security: []
      description: |
        The page a connect session link opens, for the end user's browser. It shows the app name and
        logo of the session and one button per allowed provider with the user's connection status
        (connected, needs reconnecting, not connected). A button posts to `POST /connect/{provider}`.
        An unknown token is 404 and an expired one 410, as a page that says nothing more.
      parameters:
        - $ref: "#/components/parameters/ConnectSessionToken"
      responses:
        "200": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }

  /connect/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [connections]
      operationId: connectProviderPage
      summary: Hosted connection page for one provider
      security: []
      description: The connection page with only this provider's button. 404 when the session does not allow it.
      parameters:
        - $ref: "#/components/parameters/ConnectSessionToken"
      responses:
        "200": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }
    post:
      tags: [connections]
      operationId: connectStart
      summary: Start consent from the hosted page
      security: []
      description: |
        The form the page posts. Mints a single-use OAuth state exactly like
        `POST /v1/users/{id}/connections/{provider}`, with the session's `redirect_uri`, and sends the
        browser to the provider's consent page. The session stays usable until it expires.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [session]
              properties:
                session: { type: string, description: The token of the connect session link. }
      responses:
        "303":
          description: To the provider's consent page.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }

  /oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: oauthCallback
      summary: OAuth redirect target registered with each provider
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the tenant's redirect_uri with status (connected or error) and provider.
          headers:
            Location:
              schema: { type: string, format: uri }
        "200":
          description: Built-in result page, when the connect call gave no redirect_uri.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Unknown, used or expired state.
          content:
            text/html:
              schema: { type: string }
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /inbound/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: inboundProbe
      summary: Notification URL check and subscription challenge
      security: []
      description: |
        Providers check that a notification URL answers before they subscribe it. The answer
        is 200 with no body, or, for a provider that sends a subscription challenge (Strava's
        `hub.challenge`, Oura's `challenge`), 200 with the provider's expected echo. A
        challenge whose verify token does not match is 401. HEAD is answered like GET.
      responses:
        "200":
          description: Reachable; the challenge echo when the provider sent one.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [provider-facing]
      operationId: inbound
      summary: Provider notification endpoint
      security: []
      description: |
        Verified with the provider's own signature scheme. An accepted event queues a pull for
        every active connection of the provider user, or, for a notice a pull cannot fetch back
        (a deleted record), is stored as a raw object for each of them and queued for the ETL,
        which removes the record. A notice that cannot be stored is 500, so the provider
        retries.
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
      responses:
        "200": { description: Accepted. }
        "204": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500":
          description: The notification could not be stored; the provider should retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Read-only MCP server (Streamable HTTP, stateless)
      security:
        - tenantKey: []
        - userToken: []
      description: |
        Model Context Protocol JSON-RPC messages (initialize, tools/list, tools/call). A
        tenant key reads every user of the tenant and passes `user_id` to each tool; a user
        token needs the `read` scope and reads only its own user. Tools: `list_users`,
        `list_quantity_types`, `get_samples`, `get_category_samples`, `get_sleep`,
        `get_workouts`, `get_workout_route`, `get_nutrition`, `get_daily`, `get_rr_intervals`,
        `get_hrv`, `get_menstrual_cycles`, `get_coverage`, `list_connections`. Each tool result is JSON text with `records`, `next_cursor` and
        `truncated`. A refusal (missing `user_id`, another tenant's user, `limit` above 1000)
        is a tool error inside a 200, as MCP prescribes. See docs/mcp.md.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        "202": { description: Notification accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /openapi.yaml:
    get:
      tags: [ops]
      operationId: openapi
      summary: This OpenAPI description, as served by this version
      description: Readable from any origin (`Access-Control-Allow-Origin` is `*`), so a hosted
        Swagger UI, Redoc or Postman can import it by URL.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness (database ping and raw store check)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        "503":
          description: The database or the raw store does not answer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics (absent when OHS_METRICS=false)
      description: |
        Instance wide counters, never per-tenant data. On the API listener a
        scrape presents the `OHS_METRICS_TOKEN` bearer token; with no token
        configured every scrape is refused with 403. With
        `OHS_METRICS_LISTEN` set the route moves to that address (404 here),
        where the token is asked for only when set.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: The bearer token is missing or is not `OHS_METRICS_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: No `OHS_METRICS_TOKEN` is configured, so the API listener serves no metrics.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    tenantKey:
      type: http
      scheme: bearer
      description: Tenant API key, `ohs_sk_` + 43 base62 characters.
    userToken:
      type: http
      scheme: bearer
      description: User token, `ohs_ut_` + 43 base62 characters, with the scope the route needs.
    metricsToken:
      type: http
      scheme: bearer
      description: The instance's `OHS_METRICS_TOKEN`, for Prometheus scrapes of `/metrics`.

  headers:
    IdempotentReplayed:
      description: "true when the response was replayed for a repeated Idempotency-Key."
      schema: { type: string, const: "true" }

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      description: Connector slug, see GET /v1/providers.
      schema: { type: string }
    ConnectSessionToken:
      name: session
      in: query
      required: true
      description: The token of the connect session link.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Start:
      name: start
      in: query
      description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    End:
      name: end
      in: query
      description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD. Must not be before start.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    BadRequest:
      description: Invalid parameters or body.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, unknown, revoked or expired credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: This credential cannot call this route (wrong kind or missing scope).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not the caller's.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The body is too large.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyMismatch:
      description: The Idempotency-Key was used with a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ConnectHTML:
      description: |
        A page of the hosted connection flow. Sent with `Cache-Control: no-store`,
        `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY` and a Content-Security-Policy that
        allows no script.
      content:
        text/html:
          schema: { type: string }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, examples: [about:blank] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id:
          type: string
          description: The X-Request-Id of the response, to quote when reporting the error.

    PageBase:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    Provider:
      type: object
      required: [slug, kinds]
      properties:
        slug: { type: string, examples: [apple_health] }
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }

    CreateUserRequest:
      type: object
      additionalProperties: false
      properties:
        external_ref:
          type: string
          maxLength: 255
          description: The tenant's own reference, unique per tenant.

    User:
      type: object
      required: [id, external_ref, status, created_at]
      properties:
        id: { type: string, format: uuid }
        external_ref: { type: [string, "null"] }
        status: { type: string, enum: [active, deleting] }
        created_at: { type: string, format: date-time }

    DeletionJob:
      type: object
      required: [job_id, user_id, provider, status, created_at, finished_at]
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        provider:
          type: [string, "null"]
          description: The provider whose data the job erases; null when it deletes the whole user.
        status:
          type: string
          enum: [pending, running, done, failed]
          description: done once every raw file and row of the user (or of the user and provider) is deleted.
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    MintTokenRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [upload, connect, read] }
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: |
            Lifetime in seconds. 0 or absent means 3600. At most 86400, or 2592000 (30 days)
            when read is the only scope.

    UserToken:
      type: object
      required: [token, expires_at, scopes]
      properties:
        token: { type: string, description: "ohs_ut_ token. Shown only once." }
        expires_at: { type: string, format: date-time }
        scopes:
          type: array
          items: { type: string, enum: [upload, connect, read] }

    WebhookEventType:
      type: string
      enum: [data.written, data.deleted, data.erased, user.deleted, connection.needs_reauth]
      description: |
        `data.written`: a sync wrote new or changed records. `data.deleted`: records the
        provider deleted were removed. `data.erased`: everything a user held from one provider
        was erased on your request. `user.deleted`: a user and all their data were erased.
        `connection.needs_reauth`: a provider refused the user's grant; the user must connect again.

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048, examples: ["https://app.example.com/hooks/health"] }
        description: { type: string, maxLength: 255 }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
          description: Empty or absent means every type, including types added later.

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 255 }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        enabled: { type: boolean }

    Webhook:
      type: object
      required: [id, url, description, event_types, status, disabled_reason, failing_since, last_success_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        status:
          type: string
          enum: [active, disabled]
          description: |
            An endpoint that has accepted nothing for 5 days is disabled when one more delivery
            runs out of attempts.
        disabled_reason: { type: [string, "null"] }
        failing_since:
          type: [string, "null"]
          format: date-time
          description: Start of the current run of failed attempts; null after a success.
        last_success_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: whsec_ signing secret. Shown only once.
              examples: ["whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"]

    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, status, attempts, last_status_code, last_error, next_attempt_at, created_at, delivered_at]
      properties:
        id: { type: integer }
        event_id: { type: string, format: uuid, description: "The webhook-id header and the payload's id." }
        event_type: { type: string }
        status:
          type: string
          enum: [pending, running, done, parked]
          description: parked after 8 failed attempts (about 28 hours), or when the endpoint was disabled.
        attempts: { type: integer }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        next_attempt_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }

    WebhookEvent:
      type: object
      description: |
        The body of every delivery. It names what changed, never a health value: read the data
        with the API. Signed per Standard Webhooks (headers webhook-id, webhook-timestamp,
        webhook-signature).
      required: [id, type, timestamp, data]
      properties:
        id: { type: string, format: uuid }
        type:
          oneOf:
            - $ref: "#/components/schemas/WebhookEventType"
            - { type: string, const: webhook.test }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            external_ref: { type: [string, "null"] }
            provider: { type: string }
            records:
              type: object
              additionalProperties: { type: integer }
              description: data.written. Rows written or updated per table.
            types:
              type: array
              items: { type: string }
              description: data.written. The metrics the sync held.
            first_day: { type: string, format: date, description: "data.written. First data day." }
            last_day: { type: string, format: date, description: "data.written. Last data day." }
            records_deleted: { type: integer, description: data.deleted. }
            job_id: { type: string, format: uuid, description: "data.erased. The deletion job that finished." }
            endpoint_id: { type: string, format: uuid, description: webhook.test. }

    Connection:
      type: object
      required: [provider, status, created_at]
      properties:
        provider: { type: string }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        scopes:
          type: array
          items: { type: string }
        last_sync_at: { type: [string, "null"], format: date-time }
        initial_backfill_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectSessionRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_uri:
          type: string
          format: uri
          maxLength: 2048
          description: Where the user lands after each consent. Absolute https URL (http only for localhost).
        providers:
          type: array
          maxItems: 64
          items: { type: string }
          description: Provider slugs the page offers, in this order. Each must be an OAuth provider enabled on this instance. Default, every one.
        app_name: { type: string, maxLength: 80, description: Shown as the page title. }
        logo_url: { type: string, format: uri, maxLength: 2048, description: An https image shown above the title. }
        ttl_seconds: { type: integer, minimum: 60, maximum: 3600, default: 1800 }

    ConnectSession:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri, description: "`<OHS_PUBLIC_URL>/connect?session=<token>`" }
        expires_at: { type: string, format: date-time }

    SourceFreshness:
      type: object
      required: [provider, kind, status, state, synced_through, lag_seconds, push_healthy, pull_every_seconds, consecutive_failures]
      properties:
        provider: { type: string }
        kind: { type: string, enum: [oauth, device] }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        state: { type: string, enum: [fresh, stale, failing, syncing, needs_reauth, disconnected] }
        synced_through: { type: [string, "null"], format: date-time }
        lag_seconds: { type: [integer, "null"] }
        last_sync_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time, description: Last provider notification. }
        push_healthy: { type: boolean }
        pull_every_seconds: { type: integer, description: Regular pull interval; 0 for a device source. }
        next_pull_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        consecutive_failures: { type: integer }

    Provenance:
      type: object
      required: [provider, source, device, ingested_at]
      properties:
        provider:
          type: string
          description: The integration the record came through (apple_health, withings...).
        source:
          type: [string, "null"]
          description: The vendor that produced the record, when it differs or is known.
        device: { type: [string, "null"] }
        ingested_at: { type: string, format: date-time }

    Metadata:
      type: object
      description: Provider fields kept as is, plus timezone (IANA name) when known.
      additionalProperties: true

    Sample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, value, unit, start_date, end_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string, examples: [heart_rate] }
            value: { type: number }
            unit: { type: [string, "null"], examples: [bpm] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            source_bundle_id: { type: [string, "null"] }
            device_model: { type: [string, "null"] }
            product_type: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            is_primary_source: { type: [boolean, "null"] }
            was_user_entered: { type: [boolean, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    CategorySample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string }
            value_int: { type: [integer, "null"] }
            value_label: { type: [string, "null"] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RRInterval:
      type: object
      required: [timestamp, rr_ms, series_id, provider, ingested_at]
      properties:
        timestamp: { type: string, format: date-time, description: The beat that ends the interval. }
        rr_ms: { type: number, description: "The interval from the previous beat, in milliseconds." }
        series_id: { type: string }
        provider: { type: string }
        ingested_at: { type: string, format: date-time }

    HRVSeries:
      type: object
      required: [series_id, provider, start_date, end_date, intervals, accepted_intervals, successive_pairs,
        mean_rr_ms, mean_heart_rate_bpm, sdnn_ms, rmssd_ms, pnn50_percent]
      properties:
        series_id: { type: string }
        provider: { type: string }
        start_date: { type: string, format: date-time, description: The series' first beat. }
        end_date: { type: string, format: date-time, description: The series' last beat. }
        intervals: { type: integer, description: Stored intervals of the series. }
        accepted_intervals: { type: integer, description: Intervals kept after the plausibility and ectopic checks. }
        successive_pairs: { type: integer, description: Pairs of accepted intervals of consecutive beats. }
        mean_rr_ms: { type: [number, "null"], description: Null when no interval is accepted. }
        mean_heart_rate_bpm: { type: [number, "null"] }
        sdnn_ms: { type: [number, "null"], description: Null below 10 successive pairs. }
        rmssd_ms: { type: [number, "null"], description: Null below 10 successive pairs. }
        pnn50_percent: { type: [number, "null"], description: Null below 10 successive pairs. }

    SleepSession:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, bedtime_start, metadata]
          properties:
            id: { type: integer, format: int64 }
            bedtime_start: { type: string, format: date-time }
            bedtime_end: { type: [string, "null"], format: date-time }
            total_sleep_seconds: { type: [integer, "null"] }
            deep_sleep_seconds: { type: [integer, "null"] }
            rem_sleep_seconds: { type: [integer, "null"] }
            light_sleep_seconds: { type: [integer, "null"] }
            awake_seconds: { type: [integer, "null"] }
            sleep_score: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            resting_hr: { type: [number, "null"] }
            respiratory_rate: { type: [number, "null"] }
            spo2_avg: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    SleepPhase:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, session_id, phase, start_date, duration_s]
          properties:
            id: { type: integer, format: int64 }
            session_id: { type: integer, format: int64 }
            phase: { type: string, examples: [deep, rem, light, awake] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: integer }

    Workout:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, activity_type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            activity_type: { type: string, examples: [running] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: [integer, "null"] }
            active_energy_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            avg_heart_rate: { type: [number, "null"] }
            max_heart_rate: { type: [number, "null"] }
            avg_speed_mps: { type: [number, "null"] }
            elevation_gain_m: { type: [number, "null"] }
            vo2_max: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RoutePoint:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, workout_id, timestamp, latitude, longitude]
          properties:
            id: { type: integer, format: int64 }
            workout_id: { type: integer, format: int64 }
            timestamp: { type: string, format: date-time }
            latitude: { type: number }
            longitude: { type: number }
            altitude_m: { type: [number, "null"] }
            speed_mps: { type: [number, "null"] }
            course_deg: { type: [number, "null"] }

    NutritionLog:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            meal_type: { type: [string, "null"] }
            energy_kcal: { type: [number, "null"] }
            protein_g: { type: [number, "null"] }
            carbs_g: { type: [number, "null"] }
            fat_g: { type: [number, "null"] }
            fiber_g: { type: [number, "null"] }
            sugar_g: { type: [number, "null"] }
            sodium_mg: { type: [number, "null"] }
            nutrients:
              type: [object, "null"]
              description: Extended nutrients by name.
              additionalProperties: true
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    DailySummary:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, date, metadata]
          properties:
            id: { type: integer, format: int64 }
            date: { type: string, format: date, description: The user's local calendar day. }
            readiness_score: { type: [number, "null"] }
            activity_score: { type: [number, "null"] }
            sleep_score: { type: [number, "null"] }
            recovery_score: { type: [number, "null"] }
            strain_score: { type: [number, "null"] }
            step_count: { type: [integer, "null"] }
            active_kcal: { type: [number, "null"] }
            total_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            floors_climbed: { type: [integer, "null"] }
            resting_hr: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    MenstrualFlowDay:
      type: object
      required: [date, flow, providers]
      properties:
        date: { type: string, format: date, description: The user's local calendar day. }
        flow:
          type: string
          enum: [unspecified, light, medium, heavy]
          description: The heaviest flow recorded that day.
        providers:
          type: array
          items: { type: string }
          description: The providers that recorded flow that day, sorted.

    MenstrualCycle:
      type: object
      required: [start_date, period_end_date, period_length_days, end_date, cycle_length_days, providers, flow_days]
      properties:
        start_date: { type: string, format: date, description: The first day of the period. }
        period_end_date: { type: string, format: date, description: The period's last flow day. }
        period_length_days:
          type: integer
          minimum: 1
          description: Days from start_date to period_end_date, both included (gap days count).
        end_date:
          type: [string, "null"]
          format: date
          description: The day before the next period starts; null while the cycle is open.
        cycle_length_days:
          type: [integer, "null"]
          minimum: 1
          description: Days from start_date to the next period's first day; null while open.
        providers:
          type: array
          items: { type: string }
          description: The providers that recorded the period's flow days, sorted.
        flow_days:
          type: array
          items: { $ref: "#/components/schemas/MenstrualFlowDay" }
          description: The period's flow days in order; a gap day without flow is absent.

    Coverage:
      type: object
      required: [pending_jobs, parked_jobs, rejected_records, days, truncated]
      properties:
        pending_jobs:
          type: integer
          description: ETL jobs of the user not finished yet (pending or running).
        parked_jobs:
          type: integer
          description: ETL jobs that exhausted their retries (an operator must look).
        rejected_records:
          type: integer
          description: |
            Lines of the user the ETL could not store (bad value, missing field, unknown unit)
            and has not recovered since, each line once; an object that failed as a whole
            counts as one. Counts every provider and day, whatever the filters.
        truncated:
          type: boolean
          description: True when more than 10000 days matched; days holds the earliest.
        days:
          type: array
          items:
            type: object
            required: [provider, date, records, metrics, last_synced_at]
            properties:
              provider: { type: string }
              date: { type: string, format: date }
              records: { type: integer, description: Sum over metrics. }
              metrics:
                type: object
                additionalProperties: { type: integer }
              last_synced_at: { type: string, format: date-time }

    SamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Sample" } }
    CategorySamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/CategorySample" } }
    RRIntervalPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RRInterval" } }
    HRVSeriesPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/HRVSeries" } }
    SleepSessionPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepSession" } }
    SleepPhasePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepPhase" } }
    WorkoutPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Workout" } }
    RoutePointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RoutePoint" } }
    NutritionLogPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/NutritionLog" } }
    DailySummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/DailySummary" } }

    MenstrualCyclePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/MenstrualCycle" } }

    FHIRCoding:
      type: object
      properties:
        system: { type: string, format: uri }
        code: { type: string }
        display: { type: string }
    FHIRCodeableConcept:
      type: object
      properties:
        coding:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FHIRCoding" }
        text: { type: string }
    FHIRReference:
      type: object
      properties:
        reference: { type: string, examples: ["Patient/3f0c2f8e-8b8a-4c55-9f5e-2b0f3a1d9c11"] }
        display: { type: string }
    OMHDataPoint:
      type: object
      description: |
        One Open mHealth data point (omh:data-point:1.0): a header (omh:header:1.2) and a body
        that follows the schema `header.schema_id` names (docs/open-mhealth.md).
      required: [header, body]
      properties:
        header:
          type: object
          required: [id, creation_date_time, schema_id, acquisition_provenance, user_id]
          properties:
            id:
              type: string
              description: The record's id, the same as its FHIR Observation id (`qs-`, `bp-`, `sleep-`, `workout-`).
              examples: [qs-1234]
            creation_date_time: { type: string, format: date-time, description: When the record was stored. }
            schema_id:
              type: object
              required: [namespace, name, version]
              properties:
                namespace: { type: string, const: omh }
                name: { type: string, examples: [heart-rate] }
                version: { type: string, examples: ["2.0"] }
            acquisition_provenance:
              type: object
              required: [source_name]
              properties:
                source_name: { type: string, description: The provider the record came from. }
                source_data_point_id: { type: string, description: "The provider's own id of the record." }
                modality: { type: string, enum: [sensed, self-reported] }
            user_id: { type: string, format: uuid }
        body:
          type: object
          description: The measure, in the shape of its schema.
    OMHDataPointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/OMHDataPoint" } }
    FHIRObservation:
      type: object
      description: |
        A FHIR R4 Observation made from one quantity sample, a blood pressure pair, a sleep
        session, a workout or a daily summary (docs/fhir.md).
      required: [resourceType, id, status, code, subject]
      properties:
        resourceType: { type: string, const: Observation }
        id: { type: string, pattern: "^[A-Za-z0-9\\-\\.]{1,64}$", examples: [qs-1234] }
        meta:
          type: object
          properties:
            source:
              type: string
              format: uri
              description: The provider the record came through.
            profile:
              type: array
              items: { type: string, format: uri }
            tag:
              type: array
              description: The vendor that produced the record, when known.
              items: { $ref: "#/components/schemas/FHIRCoding" }
        identifier:
          type: array
          description: The provider's own id of the record (of each sample of a panel), when it has one.
          items:
            type: object
            properties:
              system: { type: string, format: uri }
              value: { type: string }
        status: { type: string, const: final }
        category:
          type: array
          items: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        code: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        subject: { $ref: "#/components/schemas/FHIRReference" }
        effectiveDateTime: { type: string, format: date-time }
        effectivePeriod:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        issued:
          type: string
          format: date-time
          description: When the record was ingested (the later of a panel's two samples).
        valueQuantity: { $ref: "#/components/schemas/FHIRQuantity" }
        dataAbsentReason: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        device: { $ref: "#/components/schemas/FHIRReference" }
        component:
          type: array
          minItems: 1
          description: |
            The two values of a blood pressure panel, or a sleep session's, workout's or daily
            summary's other fields; a field without a value is left out.
          items:
            type: object
            required: [code]
            properties:
              code: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              valueQuantity: { $ref: "#/components/schemas/FHIRQuantity" }
              valueCodeableConcept: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              dataAbsentReason: { $ref: "#/components/schemas/FHIRCodeableConcept" }
    FHIRQuantity:
      type: object
      properties:
        value: { type: number }
        unit: { type: string }
        system: { type: string, const: "http://unitsofmeasure.org" }
        code: { type: string, examples: ["/min"] }
    FHIRBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Observations.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link:
          type: array
          items:
            type: object
            required: [relation, url]
            properties:
              relation: { type: string, enum: [self, next] }
              url: { type: string, format: uri }
        entry:
          type: array
          description: Absent on an empty page (FHIR JSON has no empty arrays).
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRObservation" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
