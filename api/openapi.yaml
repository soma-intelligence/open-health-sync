  /v1/users/{id}/daily:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listDaily
      summary: Daily summaries
      description: |
        In the merged view (the default), one summary per local calendar day: each figure
        comes from the best ranked source that has it, and `sources` names that source per
        figure; `id`, the provenance and `metadata` are those of the day's best ranked row.
        With `view=all`, one row per provider and day. `start` and `end` compare as dates.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/rr-intervals:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listRRIntervals
      summary: Beat-to-beat (RR) intervals
      description: |
        The stored RR intervals of the user's heartbeat series, one per beat, by beat time (beats
        that share a time by an internal key the cursor carries). `start` and `end` bound the beat
        time. See docs/hrv.md.
      parameters:
        - name: series_id
          in: query
          description: Keep one heartbeat series.
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by beat time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RRIntervalPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/hrv:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listHRV
      summary: Heart rate variability derived from the RR intervals
      description: |
        One record per heartbeat series: the time domain HRV measures (RMSSD, SDNN, pNN50) and the
        mean RR interval and heart rate, computed from the stored intervals after implausible and
        ectopic intervals are set aside. Ordered by the series' first beat, then provider and
        series id. A series is in `[start, end)` when its first beat is, and is always summarized
        whole. See docs/hrv.md for the rules.
      parameters:
        - name: series_id
          in: query
          description: Keep one heartbeat series.
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by the series' first beat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HRVSeriesPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/menstrual-cycles:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listMenstrualCycles
      summary: Menstrual cycles derived from the recorded flow
      description: |
        Derived at read time from the `menstrual_flow` category samples, so it always agrees with
        them, deletions included. A flow day is a local calendar day (the sample's `timezone`
        metadata, else UTC) with a flow sample whose label is not `none`; a period is a run of
        flow days with gaps of at most 2 days; a cycle runs from a period's first day to the day
        before the next period's first day, and the latest cycle is open (`end_date` and
        `cycle_length_days` null). Intermenstrual bleeding never starts a period. Nothing is
        predicted. `start` and `end` compare as dates and select cycles by `start_date`. A call
        reads at most 50000 flow samples: a page can then hold fewer than `limit` cycles and
        still carry a `next_cursor`. See docs/menstrual-cycles.md.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenstrualCyclePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/source-priorities:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: getSourcePriorities
      summary: The order of sources the merged view ranks by
      description: |
        The user's own orders, keyed by metric (a quantity type, `sleep` or `workouts`), by
        group (`activity`, `heart`, `recovery`, `body`, `sleep`, `workouts`) or `*` for every
        metric, and the built-in orders that apply where the user set none. The most specific
        order wins: metric, then group, then the user's `*`, then the built-in group order. A
        source missing from an order ranks after every listed one. See docs/data-model.md.
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePriorities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [read]
      operationId: putSourcePriorities
      summary: Replace the user's orders of sources
      description: |
        Replaces every order of the user; `{"priorities": {}}` goes back to the built-in
        orders. Source names are lowercased. Stored records are never changed: the orders
        only decide what the merged view shows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priorities]
              additionalProperties: false
              properties:
                priorities: { $ref: "#/components/schemas/SourceOrders" }
            examples:
              ring-for-sleep:
                value: { priorities: { sleep: [oura, whoop], step_count: [apple_health] } }
      responses:
        "200":
          description: The orders now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePriorities" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/coverage:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: getCoverage
      summary: What has landed, per provider and day, and what is still processing
      description: |
        Record counts per provider per local day, and `pending_jobs`, the user's ETL jobs not
        finished yet. After an upload, poll until `pending_jobs` is 0 to know every part has
        been processed; then `rejected_records` above 0 means some lines were not stored.
        Not paged: at most 10000 days are returned, the earliest, and
        `truncated` is true when more matched (narrow `start` and `end`). `start` and `end`
        compare as dates.
      parameters:
        - name: provider
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
      responses:
        "200":
          description: Coverage report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [tags]
      operationId: createTimeTag
      summary: Record a time tag
      description: |
        A time tag is an interval that gives context to the user's data: an illness, a trip,
        jet lag, a vaccination. It is context only: nothing is computed from it. `end_at`
        absent or null is a tag still ongoing; close it later with PATCH. `start_at` and
        `end_at` take an RFC 3339 time or a `YYYY-MM-DD` date (midnight UTC). `label` and
        `note` are free text and are treated as health data: never logged. See
        docs/time-tags.md.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTimeTagRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
              description: /v1/users/{id}/tags/{tag_id}
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeTag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An idempotent request with this key is in progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyMismatch" }
    get:
      tags: [tags]
      operationId: listTimeTags
      summary: The user's time tags
      description: |
        By `start_at`, then id. With `start` and `end`, the tags that overlap the window
        `[start, end)`: a tag `[start_at, end_at)` is listed when `start_at < end` and
        `end_at > start`, and an ongoing tag (`end_at` null) when `start_at < end`. A tag that
        ends exactly at `start`, or starts exactly at `end`, does not overlap. `start` equal to
        `end` is an empty window.
      parameters:
        - name: kind
          in: query
          description: Only the tags of this kind. Another value is a 400.
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeTagPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/TagID"
    get:
      tags: [tags]
      operationId: getTimeTag
      summary: One time tag
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeTag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tags]
      operationId: updateTimeTag
      summary: Change a time tag
      description: |
        Absent members stay as they are; null clears `label`, `timezone`, `note` or `end_at`
        (null `end_at` reopens the tag). `kind` and `start_at` cannot be null, and `source`
        cannot change. The tag after the change is checked as a whole: `end_at` must stay after
        `start_at`. A body that changes nothing returns the tag as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTimeTagRequest" }
      responses:
        "200":
          description: The tag after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeTag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [tags]
      operationId: deleteTimeTag
      summary: Delete a time tag
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Observation:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [fhir]
      operationId: searchFHIRObservations
      summary: The user's records as FHIR R4 Observations
      description: |
        The user's records as one FHIR R4 (4.0.1) `searchset` Bundle of Observations,
        `Content-Type: application/fhir+json`: quantity samples (`qs-` ids), blood pressure
        panels pairing a systolic and a diastolic sample (`bp-`), sleep sessions (`sleep-`),
        workouts (`workout-`) and daily summaries (`daily-`), merged in time order (a
        sample's start, a bedtime, a workout's start, a day at midnight UTC), then by kind
        and id. Paged like every list: the Bundle's `next` link carries the cursor, and
        there is no `next` link on the last page; `total` is left out. A blood pressure pair
        is never split across pages, and its two samples are not listed on their own.
        Vital signs meet the R4 vital signs profiles they claim in `meta.profile`. The
        mapping (codes, units, categories, provenance and limits) is in docs/fhir.md. In the
        merged view (the default) a record another source covers better is left out, and a
        daily summary keeps only the figures it owns (see `view`). The
        filters below combine: a record is listed when it matches all of them. Errors are
        `application/problem+json` like the rest of the API.
      parameters:
        - name: type
          in: query
          description: |
            Canonical quantity type, for example heart_rate: only quantity samples of that
            type, and the blood pressure panels holding a sample of it. Optional; a name
            outside the quantity type catalog is a 400 (unless this user has samples of it).
          schema: { type: string }
        - name: code
          in: query
          description: |
            A FHIR token `system|code` matched against `Observation.code`: a LOINC code
            (`http://loinc.org|8867-4`; 85354-9, 8480-6 and 8462-4 find the blood pressure
            panels, 93832-4 the sleep sessions, 55411-3 the workouts), a quantity type
            (`https://github.com/soma-intelligence/open-health-sync/fhir/CodeSystem/quantity-type|heart_rate`,
            like `type`), or a record type
            (`https://github.com/soma-intelligence/open-health-sync/fhir/CodeSystem/record-type|`
            `blood_pressure`, `sleep_session`, `workout` or `daily_summary`). One value; other
            systems are a 400. A code no Observation carries is an empty Bundle.
          schema: { type: string, examples: ["http://loinc.org|8867-4"] }
        - name: category
          in: query
          description: |
            An HL7 observation category code, bare or as
            `http://terminology.hl7.org/CodeSystem/observation-category|code`: `vital-signs`,
            `laboratory` or `activity` (activity samples, workouts and daily summaries). One
            value. Another code of that system is an empty Bundle; anything else is a 400.
          schema: { type: string, examples: [vital-signs] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by effective start time.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Observation/{observation_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: observation_id
        in: path
        required: true
        description: |
          The Observation id, as the Bundle gives it: `qs-`, `bp-` (the systolic sample's
          id), `sleep-`, `workout-` or `daily-`, then the stored row id.
        schema: { type: string, examples: [qs-1234, bp-1235, sleep-77] }
    get:
      tags: [fhir]
      operationId: readFHIRObservation
      summary: One FHIR R4 Observation
      description: |
        The Observation an entry's `fullUrl` points to. Not the user's, not an id of these
        forms, or not of that shape (`qs-` of a sample that is half of a blood pressure
        panel, `bp-` of a sample that is not) is a 404. In the merged view (the default) a
        daily summary carries only the figures no better ranked source of the day holds.
      parameters:
        - $ref: "#/components/parameters/View"
      responses:
        "200":
          description: The Observation.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRObservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Patient/{patient_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/FHIRPatientID"
    get:
      tags: [fhir]
      operationId: readFHIRPatient
      summary: The user as a FHIR R4 Patient
      description: |
        The user as a Patient: `id` is the user id, `active` is true, and `identifier` is the
        tenant's `external_ref` when it set one. No name or birth date (not stored). A
        `patient_id` other than the user's id, or a user of another tenant, is a 404.
      responses:
        "200":
          description: The Patient.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRPatient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Patient/{patient_id}/$everything:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/FHIRPatientID"
    get:
      tags: [fhir]
      operationId: everythingFHIRPatient
      summary: The Patient and all their records, as FHIR R4 resources
      description: |
        One page of a `searchset` Bundle: on the first page the Patient, then the page's
        Observations (`search.mode` `match`, the list and the cursor of the Observation
        search), then the Devices they reference (each once per page) and the Provenance of
        each Observation (`include`). Follow the `next` link until there is none: no
        Observation is skipped or repeated. `limit` counts the Observations. See docs/fhir.md.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/View"
      responses:
        "200":
          description: One page.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIREverythingBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Device:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [fhir]
      operationId: searchFHIRDevices
      summary: The devices the user's records came from, as FHIR R4 Devices
      description: |
        A `searchset` Bundle of the devices named by the provenance of the user's quantity
        samples, sleep sessions and workouts whose time is in the window, each once, in one
        page (no `next` link). Unbounded, it reads the provenance of every record of the user:
        pass `start` and `end` on a large history. `cursor` and `limit` are a 400.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
      responses:
        "200":
          description: Every device of the window.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRDeviceBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Device/{device_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: device_id
        in: path
        required: true
        description: The Device id, as an Observation's `device.reference` gives it.
        schema: { type: string, examples: [dev-4cd59d3e7b09cd28] }
    get:
      tags: [fhir]
      operationId: readFHIRDevice
      summary: One FHIR R4 Device
      description: |
        The Device an Observation references. A device none of the user's records names is a
        404.
      responses:
        "200":
          description: The Device.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Provenance:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [fhir]
      operationId: searchFHIRProvenance
      summary: The Provenance of one Observation
      description: |
        A `searchset` Bundle holding the Provenance of the Observation `target` names, or no
        entry when the user has no such Observation.
      parameters:
        - name: target
          in: query
          required: true
          description: "`Observation/` and an Observation id. One value."
          schema: { type: string, examples: [Observation/qs-1234] }
      responses:
        "200":
          description: The Provenance, or an empty Bundle.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRProvenanceBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/Provenance/{provenance_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: provenance_id
        in: path
        required: true
        description: "`prov-` and the id of the Observation it is about."
        schema: { type: string, examples: [prov-qs-1234] }
    get:
      tags: [fhir]
      operationId: readFHIRProvenance
      summary: One FHIR R4 Provenance
      description: The Provenance of one Observation; an Observation that does not exist is a 404.
      responses:
        "200":
          description: The Provenance.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRProvenance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/fhir/metadata:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [fhir]
      operationId: readFHIRCapabilityStatement
      summary: The FHIR R4 CapabilityStatement of the user's FHIR base
      description: What the FHIR routes serve (read only), as a CapabilityStatement.
      responses:
        "200":
          description: The CapabilityStatement.
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/FHIRCapabilityStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/omh/data-points:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [omh]
      operationId: listOMHDataPoints
      summary: The user's records as Open mHealth data points
      description: |
        The user's records as Open mHealth data points (a `header` and a `body` that follows one
        schema of the Open mHealth catalog, checked against the official schemas): heart rate,
        steps, blood pressure, body weight, height, BMI, body fat, body temperature, oxygen
        saturation, respiratory rate, blood glucose and active energy samples, sleep sessions
        (`sleep-episode`) and workouts (`physical-activity`). In the order and with the cursor of
        the FHIR search; a record without an Open mHealth schema (another quantity type, a
        daily summary, a value in another unit) is left out, so a page can hold fewer than
        `limit` data points and still have a `next_cursor`. The mapping is in
        docs/open-mhealth.md.
      parameters:
        - name: schema
          in: query
          description: |
            Only the data points of one schema, bare (`heart-rate`) or with its namespace and,
            optionally, its version (`omh:heart-rate`, `omh:heart-rate:2.0`). One value; a
            schema the mapping does not emit is a 400.
          schema: { type: string, examples: [omh:heart-rate] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/View"
      responses:
        "200":
          description: One page, by time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OMHDataPointPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/exports/{dataset}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: dataset
        in: path
        required: true
        description: The list to export. Another name is a 404.
        schema:
          type: string
          enum: [samples, category-samples, sleep, workouts, nutrition, daily]
    get:
      tags: [exports]
      operationId: exportDataset
      summary: One list of the user as a CSV or Parquet file
      description: |
        Every record of one list in `[start, end)`, as one file streamed in a single response
        (`Content-Disposition: attachment`). The columns are the members of the list's JSON
        records, in the same order and with the same names and values: times in UTC, a missing
        value empty (CSV) or null (Parquet), `metadata` (and the daily `sources`) as JSON text. `samples` holds every
        quantity type unless `type` names one. The file is not paged: `cursor` and `limit` are
        a 400. A failure once the file has started cuts the connection, so a truncated file
        never looks complete. See docs/exports.md.
      parameters:
        - name: format
          in: query
          description: "`csv` (the default) or `parquet`."
          schema: { type: string, enum: [csv, parquet], default: csv }
        - name: type
          in: query
          description: The canonical type to keep, for the lists that have one (samples, category-samples, workouts).
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<dataset>-<user id>.<format>"`'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
            application/vnd.apache.parquet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [exports]
      operationId: getUserArchive
      summary: Everything held about one user, as one zip file
      description: |
        The answer to a data portability request: one zip file streamed in a single response
        (`Content-Disposition: attachment`) holding `manifest.json` (user, generation time,
        instance version, record count of each file, a description of each folder),
        `user.json` (the user and its provider connections, never a token),
        `canonical/<list>.ndjson` (every record of samples, category-samples, sleep,
        sleep-phases, workouts, workout-routes, nutrition and daily, the same JSON as the list
        items, one per line), `fhir/bundle.json` (a FHIR R4 `collection` Bundle of every
        Observation), `omh/data-points.ndjson` (the Open mHealth data points) and `raw/...`
        (every raw payload of the user, byte for byte, under its path below the user). A
        tenant key reads any user of the tenant; a user token with scope `read` reads only its
        own user, and another user is a 404. A failure once the file has started cuts the
        connection, so a truncated archive never looks complete. See docs/exports.md.
      security:
        - tenantKey: []
        - userToken: [read]
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              description: '`attachment; filename="ohs-user-<user id>-<UTC time, YYYYMMDDTHHMMSSZ>.zip"`'
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ingest/apple-health:
    post:
      tags: [ingest]
      operationId: ingestAppleHealth
      summary: Upload one part of an Apple Health export
      description: |
        One gzip NDJSON part (at most 64 MiB, never truncated), one data type per part.
        Re-sending the same part is safe: the answer is 200 with `duplicate: true`. Other
        bytes under a (day, batch, part) already stored are a 409, and so is a part sent while
        this provider's data is being deleted for the user (nothing is kept; send it again
        once the deletion job is done). Each instance processes a
        bounded number of uploads at once; above it the answer is 503 with `Retry-After`.
      security:
        - userToken: [upload]
      parameters:
        - name: X-OHS-Type
          in: header
          required: true
          description: HealthKit type identifier of every line of the part.
          schema: { type: string, examples: [HKQuantityTypeIdentifierHeartRate] }
        - name: X-OHS-Day
          in: header
          required: true
          schema: { type: string, format: date }
        - name: X-OHS-Batch
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-OHS-Part
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, contentEncoding: binary }
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        "200":
          description: Stored (or already stored) and queued for processing.
          content:
            application/json:
              schema:
                type: object
                required: [key, duplicate]
                properties:
                  key: { type: string, description: Raw object key. }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The user started being deleted while this upload was stored (its token was accepted just before); nothing is kept.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503":
          description: Too many uploads in progress on this instance.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/ingest/health-connect:
    post:
      tags: [ingest]
      operationId: ingestHealthConnect
      summary: Upload one part of Android Health Connect records
      description: |
        One gzip NDJSON part (at most 64 MiB, never truncated), one Health Connect record per
        line, each a JSON object with a `recordType` (the line format is in
        docs/connectors/health-connect.md). Same headers, limits and answers as the Apple Health
        upload.
        Re-sending the same part is safe: the answer is 200 with `duplicate: true`. Other
        bytes under a (day, batch, part) already stored are a 409, and so is a part sent while
        this provider's data is being deleted for the user (nothing is kept; send it again
        once the deletion job is done). Each instance processes a
        bounded number of uploads at once; above it the answer is 503 with `Retry-After`.
      security:
        - userToken: [upload]
      parameters:
        - name: X-OHS-Type
          in: header
          required: true
          description: Health Connect record type of the lines of the part (for example BloodGlucose).
          schema: { type: string, examples: [BloodGlucose] }
        - name: X-OHS-Day
          in: header
          required: true
          schema: { type: string, format: date }
        - name: X-OHS-Batch
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-OHS-Part
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, contentEncoding: binary }
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        "200":
          description: Stored (or already stored) and queued for processing.
          content:
            application/json:
              schema:
                type: object
                required: [key, duplicate]
                properties:
                  key: { type: string, description: Raw object key. }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The user started being deleted while this upload was stored (its token was accepted just before); nothing is kept.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503":
          description: Too many uploads in progress on this instance.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /connect:
    get:
      tags: [connections]
      operationId: connectPage
      summary: Hosted connection page
      security: []
      description: |
        The page a connect session link opens, for the end user's browser. It shows the app name and
        logo of the session and one button per allowed provider with the user's connection status
        (connected, needs reconnecting, not connected). A button posts to `POST /connect/{provider}`.
        An unknown token is 404 and an expired one 410, as a page that says nothing more.
      parameters:
        - $ref: "#/components/parameters/ConnectSessionToken"
      responses:
        "200": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }

  /connect/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [connections]
      operationId: connectProviderPage
      summary: Hosted connection page for one provider
      security: []
      description: The connection page with only this provider's button. 404 when the session does not allow it.
      parameters:
        - $ref: "#/components/parameters/ConnectSessionToken"
      responses:
        "200": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }
    post:
      tags: [connections]
      operationId: connectStart
      summary: Start consent from the hosted page
      security: []
      description: |
        The form the page posts. Mints a single-use OAuth state exactly like
        `POST /v1/users/{id}/connections/{provider}`, with the session's `redirect_uri`, and sends the
        browser to the provider's consent page. The session stays usable until it expires.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [session]
              properties:
                session: { type: string, description: The token of the connect session link. }
      responses:
        "303":
          description: To the provider's consent page.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }

  /oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: oauthCallback
      summary: OAuth redirect target registered with each provider
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the tenant's redirect_uri with status (connected or error) and provider.
          headers:
            Location:
              schema: { type: string, format: uri }
        "200":
          description: Built-in result page, when the connect call gave no redirect_uri.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Unknown, used or expired state.
          content:
            text/html:
              schema: { type: string }
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /inbound/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: inboundProbe
      summary: Notification URL check and subscription challenge
      security: []
      description: |
        Providers check that a notification URL answers before they subscribe it. The answer
        is 200 with no body, or, for a provider that sends a subscription challenge (Strava's
        `hub.challenge`, Oura's `challenge`), 200 with the provider's expected echo. A
        challenge whose verify token does not match is 401. HEAD is answered like GET.
      responses:
        "200":
          description: Reachable; the challenge echo when the provider sent one.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [provider-facing]
      operationId: inbound
      summary: Provider notification endpoint
      security: []
      description: |
        Verified with the provider's own signature scheme. An accepted event queues a pull for
        every active connection of the provider user, or, for a notice a pull cannot fetch back
        (a deleted record), is stored as a raw object for each of them and queued for the ETL,
        which removes the record. A notice that cannot be stored is 500, so the provider
        retries.
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
      responses:
        "200": { description: Accepted. }
        "204": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500":
          description: The notification could not be stored; the provider should retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Read-only MCP server (Streamable HTTP, stateless)
      security:
        - tenantKey: []
        - userToken: []
      description: |
        Model Context Protocol JSON-RPC messages (initialize, tools/list, tools/call). A
        tenant key reads every user of the tenant and passes `user_id` to each tool; a user
        token needs the `read` scope and reads only its own user. Tools: `list_users`,
        `list_quantity_types`, `get_samples`, `get_category_samples`, `get_sleep`,
        `get_workouts`, `get_workout_route`, `get_nutrition`, `get_daily`, `get_rr_intervals`,
        `get_hrv`, `get_menstrual_cycles`, `get_tags`, `get_coverage`, `list_connections`. Each
        tool result is JSON text with `records`, `next_cursor` and `truncated`. A refusal (missing `user_id`, another tenant's user, `limit` above 1000)
        is a tool error inside a 200, as MCP prescribes. See docs/mcp.md.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        "202": { description: Notification accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: The tenant's audit log, newest first
      description: |
        One event per authenticated request (tenant key or user token) and per
        administrative or system action: who (the credential), what (the action
        and route), about which user, when, and the status. Never a health value,
        a secret or a query string. Append only; events older than
        `OHS_AUDIT_RETENTION_DAYS` (default 365) are pruned.
      parameters:
        - name: user_id
          in: query
          description: Only events about this end user.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: An exact action (`data.export`), or a prefix ending in a dot (`data.`).
          schema: { type: string }
        - name: since
          in: query
          description: Events at or after this time (RFC 3339 or YYYY-MM-DD).
          schema: { type: string }
        - name: until
          in: query
          description: Events before this time (RFC 3339 or YYYY-MM-DD).
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /openapi.yaml:
    get:
      tags: [ops]
      operationId: openapi
      summary: This OpenAPI description, as served by this version
      description: Readable from any origin (`Access-Control-Allow-Origin` is `*`), so a hosted
        Swagger UI, Redoc or Postman can import it by URL.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness (database ping and raw store check)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        "503":
          description: The database or the raw store does not answer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics (absent when OHS_METRICS=false)
      description: |
        Instance wide counters, never per-tenant data. On the API listener a
        scrape presents the `OHS_METRICS_TOKEN` bearer token; with no token
        configured every scrape is refused with 403. With
        `OHS_METRICS_LISTEN` set the route moves to that address (404 here),
        where the token is asked for only when set.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: The bearer token is missing or is not `OHS_METRICS_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: No `OHS_METRICS_TOKEN` is configured, so the API listener serves no metrics.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    tenantKey:
      type: http
      scheme: bearer
      description: Tenant API key, `ohs_sk_` + 43 base62 characters.
    userToken:
      type: http
      scheme: bearer
      description: User token, `ohs_ut_` + 43 base62 characters, with the scope the route needs.
    metricsToken:
      type: http
      scheme: bearer
      description: The instance's `OHS_METRICS_TOKEN`, for Prometheus scrapes of `/metrics`.

  headers:
    IdempotentReplayed:
      description: "true when the response was replayed for a repeated Idempotency-Key."
      schema: { type: string, const: "true" }

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FHIRPatientID:
      name: patient_id
      in: path
      required: true
      description: The Patient id, which is the user id; any other value is a 404.
      schema: { type: string }
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryID:
      name: delivery_id
      in: path
      required: true
      schema: { type: integer }
    TagID:
      name: tag_id
      in: path
      required: true
      description: The `id` of a time tag of this user.
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      description: Connector slug, see GET /v1/providers.
      schema: { type: string, examples: [withings] }
    ConnectSessionToken:
      name: session
      in: query
      required: true
      description: The token of the connect session link.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    View:
      name: view
      in: query
      description: |
        `merged` (the default): when several sources recorded the same thing (a ring and a
        watch the same night, a phone and a watch the same steps, one sample directly and
        through an aggregator), only the best ranked source's record is listed, so nothing
        counts twice. The order of sources is the user's (see source-priorities). `all`:
        every stored record of every source.
      schema: { type: string, enum: [merged, all], default: merged }
    Start:
      name: start
      in: query
      description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    End:
      name: end
      in: query
      description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD. Must not be before start.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    BadRequest:
      description: Invalid parameters or body.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, unknown, revoked or expired credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: This credential cannot call this route (wrong kind or missing scope).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not the caller's.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many requests of this kind are queued; wait for them to finish.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The body is too large.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyMismatch:
      description: The Idempotency-Key was used with a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ConnectHTML:
      description: |
        A page of the hosted connection flow. Sent with `Cache-Control: no-store`,
        `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY` and a Content-Security-Policy that
        allows no script.
      content:
        text/html:
          schema: { type: string }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, examples: [about:blank] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id:
          type: string
          description: The X-Request-Id of the response, to quote when reporting the error.

    PageBase:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    ConsentCategoryName:
      type: string
      enum: [activity, location, heart, ecg, blood_pressure, glucose, respiratory, body, sleep, nutrition, reproductive, mental, other]
    ConsentCategory:
      type: object
      required: [category, granted, granted_at, revoked_at]
      properties:
        category: { $ref: "#/components/schemas/ConsentCategoryName" }
        granted: { type: boolean }
        granted_at: { type: [string, "null"], format: date-time, description: "When it was last granted." }
        revoked_at: { type: [string, "null"], format: date-time, description: "When it was revoked, while it is." }
    ConsentSource:
      type: object
      required: [provider, categories, updated_at]
      properties:
        provider: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ConsentCategory" }
        updated_at: { type: string, format: date-time }
    ConsentEvent:
      type: object
      required: [id, at, provider, category, action, actor_id, evidence]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        provider: { type: string }
        category: { $ref: "#/components/schemas/ConsentCategoryName" }
        action: { type: string, enum: [granted, revoked] }
        actor_id: { type: string, description: "The id of the API key that made the change." }
        evidence: { type: string }

    AuditEvent:
      type: object
      required: [id, at, actor, action, user_id, status, detail]
      properties:
        id: { type: integer, description: "Increasing; the cursor of the next page." }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [api_key, user_token, admin, system]
            id:
              type: string
              description: |
                The API key's id, the first 16 hex characters of a user token's SHA-256
                hash, or the command or worker for admin and system events.
        action:
          type: string
          description: |
            data.read, data.export, data.write, user.create, user.read, user.delete,
            user.erased, token.create, connection.read, connection.create,
            connection.delete, connection.sync, webhook.read, webhook.write, audit.read, config.read,
            config.write, tenant.create, key.create, key.revoke (more may be added).
        user_id: { type: [string, "null"], format: uuid, description: "The end user the action concerns." }
        method: { type: string, description: "The HTTP method, absent outside a request." }
        route: { type: string, description: "The route pattern, absent outside a request." }
        status: { type: [integer, "null"], description: "The HTTP status, null outside a request." }
        request_id: { type: string, description: "The X-Request-Id of the request." }
        detail: { type: object, description: "Identifiers only, such as a job id or a key prefix." }

    Provider:
      type: object
      required: [slug, kinds]
      properties:
        slug: { type: string, examples: [apple_health] }
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }

    CreateUserRequest:
      type: object
      additionalProperties: false
      properties:
        external_ref:
          type: string
          maxLength: 255
          description: The tenant's own reference, unique per tenant.

    User:
      type: object
      required: [id, external_ref, status, created_at]
      properties:
        id: { type: string, format: uuid }
        external_ref: { type: [string, "null"] }
        status: { type: string, enum: [active, deleting] }
        created_at: { type: string, format: date-time }

    DeletionJob:
      type: object
      required: [job_id, user_id, provider, status, created_at, finished_at]
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        provider:
          type: [string, "null"]
          description: The provider whose data the job erases; null when it deletes the whole user.
        status:
          type: string
          enum: [pending, running, done, failed]
          description: done once every raw file and row of the user (or of the user and provider) is deleted.
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    MintTokenRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [upload, connect, read] }
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: |
            Lifetime in seconds. 0 or absent means 3600. At most 86400, or 2592000 (30 days)
            when read is the only scope.

    UserToken:
      type: object
      required: [token, expires_at, scopes]
      properties:
        token: { type: string, description: "ohs_ut_ token. Shown only once." }
        expires_at: { type: string, format: date-time }
        scopes:
          type: array
          items: { type: string, enum: [upload, connect, read] }

    WebhookEventType:
      type: string
      enum: [data.written, data.deleted, data.erased, user.deleted, connection.needs_reauth, connection.broken, connection.restored, tag.created, tag.updated, tag.deleted, consent.granted, consent.revoked]
      description: |
        `data.written`: a sync wrote new or changed records. `data.deleted`: records the
        provider deleted were removed. `data.erased`: everything a user held from one provider
        was erased on your request. `user.deleted`: a user and all their data were erased.
        `connection.needs_reauth`: a provider refused the user's grant; the user must connect again.
        `connection.broken`: a connection stopped syncing; `reason` says why and `action` what fixes
        it (`reconnect`: send the user through the connect flow; `wait`: it resumes by itself).
        `connection.restored`: a broken connection synced again.
        `tag.created`, `tag.updated`, `tag.deleted`: a time tag of the user was created, changed
        or deleted through the API.
        `consent.granted`, `consent.revoked`: a user granted or revoked data categories of a source.

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048, examples: ["https://app.example.com/hooks/health"] }
        description: { type: string, maxLength: 255 }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
          description: Empty or absent means every type, including types added later.

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 255 }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        enabled: { type: boolean }

    Webhook:
      type: object
      required: [id, url, description, event_types, status, disabled_reason, failing_since, last_success_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        status:
          type: string
          enum: [active, disabled]
          description: |
            An endpoint that has accepted nothing for 5 days is disabled when one more delivery
            runs out of attempts.
        disabled_reason: { type: [string, "null"] }
        failing_since:
          type: [string, "null"]
          format: date-time
          description: Start of the current run of failed attempts; null after a success.
        last_success_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: whsec_ signing secret. Shown only once.
              examples: ["whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"]

    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, status, attempts, last_status_code, last_error, next_attempt_at, created_at, delivered_at, replay_of]
      properties:
        id: { type: integer }
        event_id: { type: string, format: uuid, description: "The webhook-id header and the payload's id." }
        event_type: { type: string }
        status:
          type: string
          enum: [pending, running, done, parked]
          description: parked after 8 failed attempts (about 28 hours), or when the endpoint was disabled.
        attempts: { type: integer }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        next_attempt_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        replay_of:
          type: [integer, "null"]
          description: The delivery this one replays (same event and payload); null for an original.

    WebhookAttempt:
      type: object
      required: [id, attempt, started_at, duration_ms, status_code, error, response_body_excerpt]
      properties:
        id: { type: integer }
        attempt:
          type: integer
          minimum: 1
          description: Counts the delivery's attempts from 1, across retries.
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        status_code: { type: [integer, "null"], description: "Null when no HTTP answer came (timeout, refused connection)." }
        error: { type: [string, "null"], description: Null on a success. }
        response_body_excerpt:
          type: [string, "null"]
          maxLength: 1024
          description: |
            The first 1 KiB of the receiver's answer, printable UTF-8 only (other bytes become `?`).
            Null when the answer had no body.

    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [payload, attempt_history]
          properties:
            payload:
              $ref: "#/components/schemas/WebhookEvent"
              description: The exact JSON body sent, on every attempt.
            attempt_history:
              type: array
              description: The last 20 attempts, oldest first.
              items: { $ref: "#/components/schemas/WebhookAttempt" }

    TestWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        event_type:
          description: The event to send a sample of. Absent means `webhook.test`.
          oneOf:
            - $ref: "#/components/schemas/WebhookEventType"
            - { type: string, const: webhook.test }

    WebhookEvent:
      type: object
      description: |
        The body of every delivery. It names what changed, never a health value: read the data
        with the API. Signed per Standard Webhooks (headers webhook-id, webhook-timestamp,
        webhook-signature).
      required: [id, type, timestamp, data]
      properties:
        id: { type: string, format: uuid }
        type:
          oneOf:
            - $ref: "#/components/schemas/WebhookEventType"
            - { type: string, const: webhook.test }
        timestamp: { type: string, format: date-time }
        test:
          type: boolean
          const: true
          description: Present on events sent by the test route only. Such an event describes nothing that happened.
        data:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            external_ref: { type: [string, "null"] }
            provider: { type: string }
            records:
              type: object
              additionalProperties: { type: integer }
              description: data.written. Rows written or updated per table.
            types:
              type: array
              items: { type: string }
              description: data.written. The metrics the sync held.
            first_day: { type: string, format: date, description: "data.written. First data day." }
            last_day: { type: string, format: date, description: "data.written. Last data day." }
            records_deleted: { type: integer, description: data.deleted. }
            job_id: { type: string, format: uuid, description: "data.erased. The deletion job that finished." }
            tag_id: { type: string, format: uuid, description: "tag.created, tag.updated and tag.deleted." }
            reason:
              type: string
              enum: [needs_reauth, missing_scope, failing, rate_limited]
              description: connection.broken.
            action: { type: string, enum: [reconnect, wait], description: connection.broken. }
            retry_at: { type: string, format: date-time, description: "connection.broken, rate_limited. When pulls resume." }
            last_error: { type: string, description: "connection.broken, failing. The provider error, made safe to show." }
            consecutive_failures: { type: integer, description: "connection.broken, failing." }
            previous_reason: { type: string, description: connection.restored. }
            broken_since: { type: string, format: date-time, description: connection.restored. }
            broken_seconds: { type: integer, description: connection.restored. }
            endpoint_id: { type: string, format: uuid, description: webhook.test. }

    Connection:
      type: object
      required: [provider, status, created_at]
      properties:
        provider: { type: string }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        scopes:
          type: array
          items: { type: string }
        last_sync_at: { type: [string, "null"], format: date-time }
        initial_backfill_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/ConnectionHealth" }

    ConnectionHealth:
      type: object
      description: |
        Whether the connection syncs, and if not why and what fixes it. `reason` is `needs_reauth`
        (the provider refused the grant: token expired or revoked), `missing_scope` (the grant lacks a
        permission the data needs), `failing` (the last 3 pulls failed) or `rate_limited` (the provider
        asked to wait an hour or more, until `retry_at`). `action` is `reconnect` (send the user
        through the connect flow again) or `wait` (it resumes by itself).
      required: [healthy, reason, action, since, retry_at]
      properties:
        healthy: { type: boolean }
        reason: { type: [string, "null"], enum: [needs_reauth, missing_scope, failing, rate_limited, null] }
        action: { type: [string, "null"], enum: [reconnect, wait, null] }
        since: { type: [string, "null"], format: date-time }
        retry_at: { type: [string, "null"], format: date-time }

    SyncRun:
      type: object
      description: |
        One pull of one connection. `status` is `queued`, `running`, `retrying` (the last attempt
        failed, see `error`; the next is at `next_attempt_at`), `rate_limited` (the provider asked to
        wait until `next_attempt_at`), `succeeded`, `failed` (attempts spent, or the grant was refused)
        or `cancelled` (the connection was disconnected). `objects_stored` counts the raw provider
        payloads stored; the records written from them are announced by `data.written` webhooks.
      required: [id, provider, trigger, status, data_type, window_start, window_end, attempts, objects_stored,
        error, created_at, started_at, finished_at, next_attempt_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string }
        trigger: { type: string, enum: [backfill, scheduled, notification, manual] }
        status: { type: string, enum: [queued, running, retrying, rate_limited, succeeded, failed, cancelled] }
        data_type: { type: [string, "null"], description: Set when a notification named the one data type to pull. }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        attempts: { type: integer, description: Failed attempts so far. }
        objects_stored: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time }

    ConnectSessionRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_uri:
          type: string
          format: uri
          maxLength: 2048
          description: Where the user lands after each consent. Absolute https URL (http only for localhost).
        providers:
          type: array
          maxItems: 64
          items: { type: string }
          description: Provider slugs the page offers, in this order. Each must be an OAuth provider enabled on this instance. Default, every one.
        app_name: { type: string, maxLength: 80, description: Shown as the page title. }
        logo_url: { type: string, format: uri, maxLength: 2048, description: An https image shown above the title. }
        ttl_seconds: { type: integer, minimum: 60, maximum: 3600, default: 1800 }

    ConnectSession:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri, description: "`<OHS_PUBLIC_URL>/connect?session=<token>`" }
        expires_at: { type: string, format: date-time }

    SourceFreshness:
      type: object
      required: [provider, kind, status, state, synced_through, lag_seconds, push_healthy, pull_every_seconds, consecutive_failures]
      properties:
        provider: { type: string }
        kind: { type: string, enum: [oauth, device] }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        state: { type: string, enum: [fresh, stale, failing, syncing, needs_reauth, disconnected] }
        synced_through: { type: [string, "null"], format: date-time }
        lag_seconds: { type: [integer, "null"] }
        last_sync_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time, description: Last provider notification. }
        push_healthy: { type: boolean }
        pull_every_seconds: { type: integer, description: Regular pull interval; 0 for a device source. }
        next_pull_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        consecutive_failures: { type: integer }
        health: { $ref: "#/components/schemas/ConnectionHealth" }

    Provenance:
      type: object
      required: [provider, source, device, ingested_at]
      properties:
        provider:
          type: string
          description: The integration the record came through (apple_health, withings...).
        source:
          type: [string, "null"]
          description: The vendor that produced the record, when it differs or is known.
        device: { type: [string, "null"] }
        ingested_at: { type: string, format: date-time }

    Metadata:
      type: object
      description: Provider fields kept as is, plus timezone (IANA name) when known.
      additionalProperties: true

    Sample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, value, unit, start_date, end_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string, examples: [heart_rate] }
            value: { type: number }
            unit: { type: [string, "null"], examples: [bpm] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            source_bundle_id: { type: [string, "null"] }
            device_model: { type: [string, "null"] }
            product_type: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            is_primary_source: { type: [boolean, "null"] }
            was_user_entered: { type: [boolean, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    CategorySample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string }
            value_int: { type: [integer, "null"] }
            value_label: { type: [string, "null"] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RRInterval:
      type: object
      required: [timestamp, rr_ms, series_id, provider, ingested_at]
      properties:
        timestamp: { type: string, format: date-time, description: The beat that ends the interval. }
        rr_ms: { type: number, description: "The interval from the previous beat, in milliseconds." }
        series_id: { type: string }
        provider: { type: string }
        ingested_at: { type: string, format: date-time }

    HRVSeries:
      type: object
      required: [series_id, provider, start_date, end_date, intervals, accepted_intervals, successive_pairs,
        mean_rr_ms, mean_heart_rate_bpm, sdnn_ms, rmssd_ms, pnn50_percent]
      properties:
        series_id: { type: string }
        provider: { type: string }
        start_date: { type: string, format: date-time, description: The series' first beat. }
        end_date: { type: string, format: date-time, description: The series' last beat. }
        intervals: { type: integer, description: Stored intervals of the series. }
        accepted_intervals: { type: integer, description: Intervals kept after the plausibility and ectopic checks. }
        successive_pairs: { type: integer, description: Pairs of accepted intervals of consecutive beats. }
        mean_rr_ms: { type: [number, "null"], description: Null when no interval is accepted. }
        mean_heart_rate_bpm: { type: [number, "null"] }
        sdnn_ms: { type: [number, "null"], description: Null below 10 successive pairs. }
        rmssd_ms: { type: [number, "null"], description: Null below 10 successive pairs. }
        pnn50_percent: { type: [number, "null"], description: Null below 10 successive pairs. }

    SleepSession:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, bedtime_start, metadata]
          properties:
            id: { type: integer, format: int64 }
            bedtime_start: { type: string, format: date-time }
            bedtime_end: { type: [string, "null"], format: date-time }
            total_sleep_seconds: { type: [integer, "null"] }
            deep_sleep_seconds: { type: [integer, "null"] }
            rem_sleep_seconds: { type: [integer, "null"] }
            light_sleep_seconds: { type: [integer, "null"] }
            awake_seconds: { type: [integer, "null"] }
            sleep_score: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            resting_hr: { type: [number, "null"] }
            respiratory_rate: { type: [number, "null"] }
            spo2_avg: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    SleepPhase:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, session_id, phase, start_date, duration_s]
          properties:
            id: { type: integer, format: int64 }
            session_id: { type: integer, format: int64 }
            phase: { type: string, examples: [deep, rem, light, awake] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: integer }

    Workout:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, activity_type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            activity_type: { type: string, examples: [running] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: [integer, "null"] }
            active_energy_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            avg_heart_rate: { type: [number, "null"] }
            max_heart_rate: { type: [number, "null"] }
            avg_speed_mps: { type: [number, "null"] }
            elevation_gain_m: { type: [number, "null"] }
            vo2_max: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RoutePoint:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, workout_id, timestamp, latitude, longitude]
          properties:
            id: { type: integer, format: int64 }
            workout_id: { type: integer, format: int64 }
            timestamp: { type: string, format: date-time }
            latitude: { type: number }
            longitude: { type: number }
            altitude_m: { type: [number, "null"] }
            speed_mps: { type: [number, "null"] }
            course_deg: { type: [number, "null"] }

    NutritionLog:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            meal_type: { type: [string, "null"] }
            energy_kcal: { type: [number, "null"] }
            protein_g: { type: [number, "null"] }
            carbs_g: { type: [number, "null"] }
            fat_g: { type: [number, "null"] }
            fiber_g: { type: [number, "null"] }
            sugar_g: { type: [number, "null"] }
            sodium_mg: { type: [number, "null"] }
            nutrients:
              type: [object, "null"]
              description: Extended nutrients by name.
              additionalProperties: true
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    DailySummary:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, date, metadata]
          properties:
            id: { type: integer, format: int64 }
            date: { type: string, format: date, description: The user's local calendar day. }
            readiness_score: { type: [number, "null"] }
            activity_score: { type: [number, "null"] }
            sleep_score: { type: [number, "null"] }
            recovery_score: { type: [number, "null"] }
            strain_score: { type: [number, "null"] }
            step_count: { type: [integer, "null"] }
            active_kcal: { type: [number, "null"] }
            total_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            floors_climbed: { type: [integer, "null"] }
            resting_hr: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }
            sources:
              type: object
              additionalProperties: { type: string }
              description: |
                Merged view only: the source of each figure, keyed by the figure's name
                (for example `{"step_count": "apple_health", "readiness_score": "oura"}`).

    SourceOrders:
      type: object
      description: Orders of source slugs, best first, keyed by metric, group or `*`.
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 50
        items: { type: string }

    SourcePriorities:
      type: object
      required: [priorities, defaults]
      properties:
        priorities: { $ref: "#/components/schemas/SourceOrders" }
        defaults: { $ref: "#/components/schemas/SourceOrders" }

    MenstrualFlowDay:
      type: object
      required: [date, flow, providers]
      properties:
        date: { type: string, format: date, description: The user's local calendar day. }
        flow:
          type: string
          enum: [unspecified, light, medium, heavy]
          description: The heaviest flow recorded that day.
        providers:
          type: array
          items: { type: string }
          description: The providers that recorded flow that day, sorted.

    MenstrualCycle:
      type: object
      required: [start_date, period_end_date, period_length_days, end_date, cycle_length_days, providers, flow_days]
      properties:
        start_date: { type: string, format: date, description: The first day of the period. }
        period_end_date: { type: string, format: date, description: The period's last flow day. }
        period_length_days:
          type: integer
          minimum: 1
          description: Days from start_date to period_end_date, both included (gap days count).
        end_date:
          type: [string, "null"]
          format: date
          description: The day before the next period starts; null while the cycle is open.
        cycle_length_days:
          type: [integer, "null"]
          minimum: 1
          description: Days from start_date to the next period's first day; null while open.
        providers:
          type: array
          items: { type: string }
          description: The providers that recorded the period's flow days, sorted.
        flow_days:
          type: array
          items: { $ref: "#/components/schemas/MenstrualFlowDay" }
          description: The period's flow days in order; a gap day without flow is absent.

    Coverage:
      type: object
      required: [pending_jobs, parked_jobs, rejected_records, days, truncated]
      properties:
        pending_jobs:
          type: integer
          description: ETL jobs of the user not finished yet (pending or running).
        parked_jobs:
          type: integer
          description: ETL jobs that exhausted their retries (an operator must look).
        rejected_records:
          type: integer
          description: |
            Lines of the user the ETL could not store (bad value, missing field, unknown unit)
            and has not recovered since, each line once; an object that failed as a whole
            counts as one. Counts every provider and day, whatever the filters.
        truncated:
          type: boolean
          description: True when more than 10000 days matched; days holds the earliest.
        days:
          type: array
          items:
            type: object
            required: [provider, date, records, metrics, last_synced_at]
            properties:
              provider: { type: string }
              date: { type: string, format: date }
              records: { type: integer, description: Sum over metrics. }
              metrics:
                type: object
                additionalProperties: { type: integer }
              last_synced_at: { type: string, format: date-time }

    SamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Sample" } }
    CategorySamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/CategorySample" } }
    RRIntervalPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RRInterval" } }
    HRVSeriesPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/HRVSeries" } }
    SleepSessionPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepSession" } }
    SleepPhasePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepPhase" } }
    WorkoutPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Workout" } }
    RoutePointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RoutePoint" } }
    NutritionLogPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/NutritionLog" } }
    DailySummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/DailySummary" } }

    MenstrualCyclePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/MenstrualCycle" } }

    TimeTagKind:
      type: string
      enum: [illness, injury, travel, jet_lag, vaccination, medication, alcohol, other]
      description: The controlled vocabulary of time tags; see docs/time-tags.md.

    TimeTagTime:
      oneOf:
        - { type: string, format: date-time }
        - { type: string, format: date }

    TimeTag:
      type: object
      required: [id, kind, label, start_at, end_at, timezone, note, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TimeTagKind" }
        label: { type: [string, "null"], maxLength: 100 }
        start_at: { type: string, format: date-time }
        end_at:
          type: [string, "null"]
          format: date-time
          description: Exclusive end; null while the tag is ongoing.
        timezone:
          type: [string, "null"]
          description: An IANA time zone, for example the destination zone of a trip.
          examples: [Asia/Tokyo]
        note: { type: [string, "null"], maxLength: 2000 }
        source:
          type: string
          description: Who recorded the tag; `user` unless the creator named itself.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateTimeTagRequest:
      type: object
      additionalProperties: false
      required: [kind, start_at]
      properties:
        kind: { $ref: "#/components/schemas/TimeTagKind" }
        label:
          type: [string, "null"]
          maxLength: 100
          description: A short free text. Empty or null is none.
        start_at: { $ref: "#/components/schemas/TimeTagTime" }
        end_at:
          description: After `start_at`. Absent or null for a tag still ongoing.
          oneOf:
            - $ref: "#/components/schemas/TimeTagTime"
            - { type: "null" }
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: An IANA time zone name. Empty or null is none.
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Free text, treated as health data. Empty or null is none.
        source:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
          description: Who records the tag, for example your app's name. Absent means `user`.

    UpdateTimeTagRequest:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/TimeTagKind" }
        label: { type: [string, "null"], maxLength: 100 }
        start_at: { $ref: "#/components/schemas/TimeTagTime" }
        end_at:
          oneOf:
            - $ref: "#/components/schemas/TimeTagTime"
            - { type: "null" }
        timezone: { type: [string, "null"], maxLength: 64 }
        note: { type: [string, "null"], maxLength: 2000 }

    TimeTagPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/TimeTag" } }

    FHIRCoding:
      type: object
      properties:
        system: { type: string, format: uri }
        code: { type: string }
        display: { type: string }
    FHIRCodeableConcept:
      type: object
      properties:
        coding:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FHIRCoding" }
        text: { type: string }
    FHIRReference:
      type: object
      properties:
        reference: { type: string, examples: ["Patient/3f0c2f8e-8b8a-4c55-9f5e-2b0f3a1d9c11"] }
        identifier: { $ref: "#/components/schemas/FHIRIdentifier" }
        display: { type: string }
    FHIRIdentifier:
      type: object
      properties:
        system: { type: string, format: uri }
        value: { type: string }
    FHIRMeta:
      type: object
      properties:
        source:
          type: string
          format: uri
          description: The provider the record came through.
        profile:
          type: array
          items: { type: string, format: uri }
        tag:
          type: array
          description: The vendor that produced the record, when known.
          items: { $ref: "#/components/schemas/FHIRCoding" }
    FHIRPatient:
      type: object
      description: The user as a FHIR R4 Patient (docs/fhir.md).
      required: [resourceType, id, active]
      properties:
        resourceType: { type: string, const: Patient }
        id: { type: string, format: uuid }
        identifier:
          type: array
          description: The tenant's external_ref, when it set one.
          items: { $ref: "#/components/schemas/FHIRIdentifier" }
        active: { type: boolean, const: true }
    FHIRDevice:
      type: object
      description: A device the user's records came from, as a FHIR R4 Device (docs/fhir.md).
      required: [resourceType, id]
      properties:
        resourceType: { type: string, const: Device }
        id: { type: string, pattern: "^dev-[0-9a-f]{16}$", examples: [dev-4cd59d3e7b09cd28] }
        meta: { $ref: "#/components/schemas/FHIRMeta" }
        identifier:
          type: array
          description: The provider's device id (provenance `device`), when known.
          items: { $ref: "#/components/schemas/FHIRIdentifier" }
        deviceName:
          type: array
          description: The device model (`device_model`), when known.
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string, const: model-name }
        modelNumber: { type: string, description: "The product type (`product_type`), when known." }
        patient: { $ref: "#/components/schemas/FHIRReference" }
    FHIRProvenance:
      type: object
      description: Who and what produced one Observation, as a FHIR R4 Provenance (docs/fhir.md).
      required: [resourceType, id, target, recorded, agent]
      properties:
        resourceType: { type: string, const: Provenance }
        id: { type: string, pattern: "^prov-[A-Za-z0-9\\-\\.]{1,59}$", examples: [prov-qs-1234] }
        target:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FHIRReference" }
        recorded: { type: string, format: date-time, description: When the record was ingested. }
        agent:
          type: array
          minItems: 1
          description: The Device (`author`) when the record names one, then the provider (`assembler`).
          items:
            type: object
            required: [who]
            properties:
              type: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              who: { $ref: "#/components/schemas/FHIRReference" }
        entity:
          type: array
          description: The provider's own record (each external id), when it has one.
          items:
            type: object
            required: [role, what]
            properties:
              role: { type: string, const: derivation }
              what: { $ref: "#/components/schemas/FHIRReference" }
    FHIRCapabilityStatement:
      type: object
      description: What the FHIR routes serve, as a FHIR R4 CapabilityStatement.
      required: [resourceType, status, date, kind, fhirVersion, format, rest]
      properties:
        resourceType: { type: string, const: CapabilityStatement }
        status: { type: string, const: active }
        date: { type: string }
        kind: { type: string, const: instance }
        implementation:
          type: object
          properties:
            description: { type: string }
            url: { type: string, format: uri }
        fhirVersion: { type: string, const: 4.0.1 }
        format: { type: array, items: { type: string } }
        rest:
          type: array
          items:
            type: object
            properties:
              mode: { type: string, const: server }
              security:
                type: object
                properties:
                  description: { type: string }
              resource:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    interaction:
                      type: array
                      items:
                        type: object
                        properties:
                          code: { type: string }
                    searchParam:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          definition: { type: string, format: uri }
                          type: { type: string }
                          documentation: { type: string }
                    operation:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          definition: { type: string, format: uri }
    FHIRBundleLink:
      type: object
      required: [relation, url]
      properties:
        relation: { type: string, enum: [self, next] }
        url: { type: string, format: uri }
    FHIRDeviceBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Devices, one page.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link: { type: array, items: { $ref: "#/components/schemas/FHIRBundleLink" } }
        entry:
          type: array
          description: Absent when there is none.
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRDevice" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
    FHIRProvenanceBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Provenance.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link: { type: array, items: { $ref: "#/components/schemas/FHIRBundleLink" } }
        entry:
          type: array
          description: Absent when there is none.
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRProvenance" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
    FHIREverythingBundle:
      type: object
      description: |
        One page of a Patient's $everything: a FHIR R4 searchset Bundle of the Patient (first
        page), Observations, Devices and Provenance.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link: { type: array, items: { $ref: "#/components/schemas/FHIRBundleLink" } }
        entry:
          type: array
          description: Absent on an empty page after the first.
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource:
                oneOf:
                  - $ref: "#/components/schemas/FHIRPatient"
                  - $ref: "#/components/schemas/FHIRObservation"
                  - $ref: "#/components/schemas/FHIRDevice"
                  - $ref: "#/components/schemas/FHIRProvenance"
              search:
                type: object
                properties:
                  mode: { type: string, enum: [match, include] }
    OMHDataPoint:
      type: object
      description: |
        One Open mHealth data point (omh:data-point:1.0): a header (omh:header:1.2) and a body
        that follows the schema `header.schema_id` names (docs/open-mhealth.md).
      required: [header, body]
      properties:
        header:
          type: object
          required: [id, creation_date_time, schema_id, acquisition_provenance, user_id]
          properties:
            id:
              type: string
              description: The record's id, the same as its FHIR Observation id (`qs-`, `bp-`, `sleep-`, `workout-`).
              examples: [qs-1234]
            creation_date_time: { type: string, format: date-time, description: When the record was stored. }
            schema_id:
              type: object
              required: [namespace, name, version]
              properties:
                namespace: { type: string, const: omh }
                name: { type: string, examples: [heart-rate] }
                version: { type: string, examples: ["2.0"] }
            acquisition_provenance:
              type: object
              required: [source_name]
              properties:
                source_name: { type: string, description: The provider the record came from. }
                source_data_point_id: { type: string, description: "The provider's own id of the record." }
                modality: { type: string, enum: [sensed, self-reported] }
            user_id: { type: string, format: uuid }
        body:
          type: object
          description: The measure, in the shape of its schema.
    OMHDataPointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/OMHDataPoint" } }
    FHIRObservation:
      type: object
      description: |
        A FHIR R4 Observation made from one quantity sample, a blood pressure pair, a sleep
        session, a workout or a daily summary (docs/fhir.md).
      required: [resourceType, id, status, code, subject]
      properties:
        resourceType: { type: string, const: Observation }
        id: { type: string, pattern: "^[A-Za-z0-9\\-\\.]{1,64}$", examples: [qs-1234] }
        meta:
          type: object
          properties:
            source:
              type: string
              format: uri
              description: The provider the record came through.
            profile:
              type: array
              items: { type: string, format: uri }
            tag:
              type: array
              description: The vendor that produced the record, when known.
              items: { $ref: "#/components/schemas/FHIRCoding" }
        identifier:
          type: array
          description: The provider's own id of the record (of each sample of a panel), when it has one.
          items:
            type: object
            properties:
              system: { type: string, format: uri }
              value: { type: string }
        status: { type: string, const: final }
        category:
          type: array
          items: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        code: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        subject: { $ref: "#/components/schemas/FHIRReference" }
        effectiveDateTime: { type: string, format: date-time }
        effectivePeriod:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        issued:
          type: string
          format: date-time
          description: When the record was ingested (the later of a panel's two samples).
        valueQuantity: { $ref: "#/components/schemas/FHIRQuantity" }
        dataAbsentReason: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        device: { $ref: "#/components/schemas/FHIRReference" }
        component:
          type: array
          minItems: 1
          description: |
            The two values of a blood pressure panel, or a sleep session's, workout's or daily
            summary's other fields; a field without a value is left out.
          items:
            type: object
            required: [code]
            properties:
              code: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              valueQuantity: { $ref: "#/components/schemas/FHIRQuantity" }
              valueCodeableConcept: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              dataAbsentReason: { $ref: "#/components/schemas/FHIRCodeableConcept" }
    FHIRQuantity:
      type: object
      properties:
        value: { type: number }
        unit: { type: string }
        system: { type: string, const: "http://unitsofmeasure.org" }
        code: { type: string, examples: ["/min"] }
    FHIRBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Observations.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link:
          type: array
          items:
            type: object
            required: [relation, url]
            properties:
              relation: { type: string, enum: [self, next] }
              url: { type: string, format: uri }
        entry:
          type: array
          description: Absent on an empty page (FHIR JSON has no empty arrays).
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRObservation" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
