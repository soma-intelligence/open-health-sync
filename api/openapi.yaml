# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.1.0
info:
  title: Open Health Sync API
  version: "1.0.0"
  summary: Self-hostable health data aggregator.
  description: |
    All bodies are JSON. Times are RFC 3339 in UTC. Values are in canonical units.

    **Auth.** `Authorization: Bearer <secret>`. Tenant API keys (`ohs_sk_...`) call the
    tenant routes, server to server. User tokens (`ohs_ut_...`), minted with
    `POST /v1/users/{id}/tokens`, are scoped to one end user and to `upload`, `connect`
    or `read`, and call the user routes. A tenant key on a user route, or a user token on
    a tenant route, gets 403.

    **Lists** are ordered by time ascending and paged with `cursor` and `limit` (default
    100, at most 1000; a larger limit is a 400). Every list answers
    `{"data": [...], "next_cursor": "..." | null}`; pass `next_cursor` back as `cursor`
    until it is null. Time windows are half open: `start` <= record time < `end`.
    `start` and `end` take an RFC 3339 time or a `YYYY-MM-DD` date (midnight UTC).

    **Errors** are RFC 9457 `application/problem+json`. A user, workout or sleep session
    of another tenant is a 404, never a 403.

    **Request ids.** Every response carries `X-Request-Id` (the caller's own when it is 1
    to 128 letters, digits, `-`, `_` or `.`, else a fresh one); a problem body repeats it as
    `request_id`, and the server logs carry it too.

    **Idempotency.** `Idempotency-Key` (1 to 255 characters) is honoured on
    `POST /v1/users`: a retry with the same key and the same request within 24 hours gets the first response back, with
    `Idempotent-Replayed: true`. The same key with another request is a 422; a retry while
    the first call still runs is a 409. Token minting ignores the header (replaying it would
    mean storing the token); device uploads are idempotent by their own headers.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: The instance serving this document (GET /openapi.yaml), or set your own.
tags:
  - name: providers
  - name: users
  - name: tokens
  - name: connections
  - name: read
  - name: ingest
  - name: provider-facing
  - name: mcp
  - name: ops
security:
  - tenantKey: []

paths:
  /v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: Connectors enabled on this instance
      responses:
        "200":
          description: Enabled connectors, by slug.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create an end user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: An empty body creates a user without an external reference.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
              description: /v1/users/{id}
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A user with this external_ref exists, or an idempotent request with this key is in progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyMismatch" }
    get:
      tags: [users]
      operationId: listUsers
      summary: List the tenant's end users, oldest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [users]
      operationId: getUser
      summary: Get one end user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Hard-delete an end user
      description: |
        The user's status becomes `deleting` at once: reads of their data return 404 and
        the user's tokens stop working, so uploads get 401 (410 only for an upload whose
        token was accepted just before). A background job then revokes provider connections (best effort),
        deletes the user's raw files and every row of the user, then the user.
        `GET /v1/deletions/{job_id}` tells when it is done.
      responses:
        "202":
          description: Deletion accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/deletions/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        description: The `job_id` returned by `DELETE /v1/users/{id}`.
        schema: { type: string, format: uuid }
    get:
      tags: [users]
      operationId: getDeletion
      summary: Status of a user deletion
      description: |
        Poll until `status` is `done`: the user's raw files and rows are gone. The job is kept
        after the user is deleted. Another tenant's job is a 404.
      responses:
        "200":
          description: The deletion job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [tokens]
      operationId: mintUserToken
      summary: Mint a user token
      description: |
        Returns an opaque `ohs_ut_` token for one active user, shown only in this response
        (`Cache-Control: no-store`). Lifetime: one hour by default, at most 24 hours; a token
        whose only scope is `read` may live up to 30 days (2592000 s), for a person's own AI
        agent configuration (MCP). `Idempotency-Key` is ignored here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MintTokenRequest" }
      responses:
        "201":
          description: Minted.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/users/{id}/connections:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [connections]
      operationId: listConnections
      summary: The user's provider connections
      responses:
        "200":
          description: Connections, one per provider.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/freshness:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [connections]
      operationId: getFreshness
      summary: How up to date each of the user's sources is
      description: |
        One entry per provider connection, then one per device source (Apple Health) that uploaded,
        ordered by provider. `synced_through` is the end of the most recent window pulled (the time of
        the last upload for a device source) and `lag_seconds` is how far behind now it is. Providers
        that send notifications are pulled within seconds of a change; the regular pull is a backstop,
        every 6 hours while notifications arrive (`push_healthy`) and every hour otherwise.
        `state` is `fresh`, `stale` (behind by more than two pull intervals, or no upload for 26 hours),
        `failing` (the last 3 pulls failed, see `last_error`), `syncing` (first pull not done),
        `needs_reauth` or `disconnected`.
      responses:
        "200":
          description: Freshness of every source.
          content:
            application/json:
              schema:
                type: object
                required: [as_of, data]
                properties:
                  as_of: { type: string, format: date-time }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SourceFreshness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/connections/{provider}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/Provider"
    post:
      tags: [connections]
      operationId: startConnection
      summary: Start connecting a provider
      description: |
        Returns the provider's consent URL. Send the user there; after consent the user
        lands on `redirect_uri?status=connected|error&provider=<slug>`, or on a built-in
        result page when no `redirect_uri` is given. Each call mints a fresh single-use state;
        `Idempotency-Key` is not honoured here.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                redirect_uri: { type: string, format: uri }
      responses:
        "200":
          description: Consent URL.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Disconnect a provider
      description: Revokes the provider grant (best effort) and stops pulling. Data already collected is kept.
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/samples:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listSamples
      summary: Quantity samples of one type
      parameters:
        - name: type
          in: query
          required: true
          description: Canonical quantity type, for example heart_rate or step_count. A name outside the quantity type catalog is a 400 (unless this user has samples of it).
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamplePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/category-samples:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listCategorySamples
      summary: Category samples (events)
      parameters:
        - name: type
          in: query
          description: Canonical category type; all types when absent.
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySamplePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/sleep:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listSleep
      summary: Sleep sessions
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by bedtime_start.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepSessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/sleep/{session_id}/phases:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: session_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [read]
      operationId: listSleepPhases
      summary: Phases of one sleep session
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleepPhasePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/workouts:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listWorkouts
      summary: Workouts
      parameters:
        - name: type
          in: query
          description: Canonical activity type (running, cycling...); all when absent.
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/workouts/{workout_id}/route:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: workout_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [read]
      operationId: getWorkoutRoute
      summary: GPS route of one workout
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by timestamp.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutePointPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/nutrition:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listNutrition
      summary: Nutrition logs
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionLogPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/daily:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listDaily
      summary: Daily summaries
      description: One row per provider and local calendar day. `start` and `end` compare as dates.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/coverage:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: getCoverage
      summary: What has landed, per provider and day, and what is still processing
      description: |
        Record counts per provider per local day, and `pending_jobs`, the user's ETL jobs not
        finished yet. After an upload, poll until `pending_jobs` is 0 to know every part has
        been processed; then `rejected_records` above 0 means some lines were not stored.
        Not paged: at most 10000 days are returned, the earliest, and
        `truncated` is true when more matched (narrow `start` and `end`). `start` and `end`
        compare as dates.
      parameters:
        - name: provider
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
      responses:
        "200":
          description: Coverage report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ingest/apple-health:
    post:
      tags: [ingest]
      operationId: ingestAppleHealth
      summary: Upload one part of an Apple Health export
      description: |
        One gzip NDJSON part (at most 64 MiB, never truncated), one data type per part.
        Re-sending the same part is safe: the answer is 200 with `duplicate: true`. Other
        bytes under a (day, batch, part) already stored are a 409. Each instance processes a
        bounded number of uploads at once; above it the answer is 503 with `Retry-After`.
      security:
        - userToken: [upload]
      parameters:
        - name: X-OHS-Type
          in: header
          required: true
          description: HealthKit type identifier of every line of the part.
          schema: { type: string }
        - name: X-OHS-Day
          in: header
          required: true
          schema: { type: string, format: date }
        - name: X-OHS-Batch
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-OHS-Part
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, contentEncoding: binary }
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        "200":
          description: Stored (or already stored) and queued for processing.
          content:
            application/json:
              schema:
                type: object
                required: [key, duplicate]
                properties:
                  key: { type: string, description: Raw object key. }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The user started being deleted while this upload was stored (its token was accepted just before); nothing is kept.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503":
          description: Too many uploads in progress on this instance.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: oauthCallback
      summary: OAuth redirect target registered with each provider
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the tenant's redirect_uri with status (connected or error) and provider.
          headers:
            Location:
              schema: { type: string, format: uri }
        "200":
          description: Built-in result page, when the connect call gave no redirect_uri.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Unknown, used or expired state.
          content:
            text/html:
              schema: { type: string }
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /inbound/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    post:
      tags: [provider-facing]
      operationId: inbound
      summary: Provider notification endpoint
      security: []
      description: Verified with the provider's own signature scheme. Accepted events queue pulls.
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
      responses:
        "200": { description: Accepted. }
        "204": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Read-only MCP server (Streamable HTTP, stateless)
      security:
        - tenantKey: []
        - userToken: []
      description: |
        Model Context Protocol JSON-RPC messages (initialize, tools/list, tools/call). A
        tenant key reads every user of the tenant and passes `user_id` to each tool; a user
        token needs the `read` scope and reads only its own user. Tools: `list_users`,
        `list_quantity_types`, `get_samples`, `get_category_samples`, `get_sleep`,
        `get_workouts`, `get_workout_route`, `get_nutrition`, `get_daily`, `get_coverage`,
        `list_connections`. Each tool result is JSON text with `records`, `next_cursor` and
        `truncated`. A refusal (missing `user_id`, another tenant's user, `limit` above 1000)
        is a tool error inside a 200, as MCP prescribes. See docs/mcp.md.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        "202": { description: Notification accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /openapi.yaml:
    get:
      tags: [ops]
      operationId: openapi
      summary: This OpenAPI description, as served by this version
      description: Readable from any origin (`Access-Control-Allow-Origin` is `*`), so a hosted
        Swagger UI, Redoc or Postman can import it by URL.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness (database ping and raw store check)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        "503":
          description: The database or the raw store does not answer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics (absent when OHS_METRICS=false)
      security: []
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    tenantKey:
      type: http
      scheme: bearer
      description: Tenant API key, `ohs_sk_` + 43 base62 characters.
    userToken:
      type: http
      scheme: bearer
      description: User token, `ohs_ut_` + 43 base62 characters, with the scope the route needs.

  headers:
    IdempotentReplayed:
      description: "true when the response was replayed for a repeated Idempotency-Key."
      schema: { type: string, const: "true" }

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      description: Connector slug, see GET /v1/providers.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Start:
      name: start
      in: query
      description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    End:
      name: end
      in: query
      description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD. Must not be before start.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    BadRequest:
      description: Invalid parameters or body.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, unknown, revoked or expired credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: This credential cannot call this route (wrong kind or missing scope).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not the caller's.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The body is too large.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyMismatch:
      description: The Idempotency-Key was used with a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, examples: [about:blank] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id:
          type: string
          description: The X-Request-Id of the response, to quote when reporting the error.

    PageBase:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    Provider:
      type: object
      required: [slug, kinds]
      properties:
        slug: { type: string, examples: [apple_health] }
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }

    CreateUserRequest:
      type: object
      additionalProperties: false
      properties:
        external_ref:
          type: string
          maxLength: 255
          description: The tenant's own reference, unique per tenant.

    User:
      type: object
      required: [id, external_ref, status, created_at]
      properties:
        id: { type: string, format: uuid }
        external_ref: { type: [string, "null"] }
        status: { type: string, enum: [active, deleting] }
        created_at: { type: string, format: date-time }

    DeletionJob:
      type: object
      required: [job_id, user_id, status, created_at, finished_at]
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, done, failed]
          description: done once every raw file and row of the user is deleted.
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    MintTokenRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [upload, connect, read] }
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: |
            Lifetime in seconds. 0 or absent means 3600. At most 86400, or 2592000 (30 days)
            when read is the only scope.

    UserToken:
      type: object
      required: [token, expires_at, scopes]
      properties:
        token: { type: string, description: "ohs_ut_ token. Shown only once." }
        expires_at: { type: string, format: date-time }
        scopes:
          type: array
          items: { type: string, enum: [upload, connect, read] }

    Connection:
      type: object
      required: [provider, status, created_at]
      properties:
        provider: { type: string }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        scopes:
          type: array
          items: { type: string }
        last_sync_at: { type: [string, "null"], format: date-time }
        initial_backfill_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SourceFreshness:
      type: object
      required: [provider, kind, status, state, synced_through, lag_seconds, push_healthy, pull_every_seconds, consecutive_failures]
      properties:
        provider: { type: string }
        kind: { type: string, enum: [oauth, device] }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        state: { type: string, enum: [fresh, stale, failing, syncing, needs_reauth, disconnected] }
        synced_through: { type: [string, "null"], format: date-time }
        lag_seconds: { type: [integer, "null"] }
        last_sync_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time, description: Last provider notification. }
        push_healthy: { type: boolean }
        pull_every_seconds: { type: integer, description: Regular pull interval; 0 for a device source. }
        next_pull_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        consecutive_failures: { type: integer }

    Provenance:
      type: object
      required: [provider, source, device, ingested_at]
      properties:
        provider:
          type: string
          description: The integration the record came through (apple_health, withings...).
        source:
          type: [string, "null"]
          description: The vendor that produced the record, when it differs or is known.
        device: { type: [string, "null"] }
        ingested_at: { type: string, format: date-time }

    Metadata:
      type: object
      description: Provider fields kept as is, plus timezone (IANA name) when known.
      additionalProperties: true

    Sample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, value, unit, start_date, end_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string, examples: [heart_rate] }
            value: { type: number }
            unit: { type: [string, "null"], examples: [bpm] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            source_bundle_id: { type: [string, "null"] }
            device_model: { type: [string, "null"] }
            product_type: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            is_primary_source: { type: [boolean, "null"] }
            was_user_entered: { type: [boolean, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    CategorySample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string }
            value_int: { type: [integer, "null"] }
            value_label: { type: [string, "null"] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    SleepSession:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, bedtime_start, metadata]
          properties:
            id: { type: integer, format: int64 }
            bedtime_start: { type: string, format: date-time }
            bedtime_end: { type: [string, "null"], format: date-time }
            total_sleep_seconds: { type: [integer, "null"] }
            deep_sleep_seconds: { type: [integer, "null"] }
            rem_sleep_seconds: { type: [integer, "null"] }
            light_sleep_seconds: { type: [integer, "null"] }
            awake_seconds: { type: [integer, "null"] }
            sleep_score: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            resting_hr: { type: [number, "null"] }
            respiratory_rate: { type: [number, "null"] }
            spo2_avg: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    SleepPhase:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, session_id, phase, start_date, duration_s]
          properties:
            id: { type: integer, format: int64 }
            session_id: { type: integer, format: int64 }
            phase: { type: string, examples: [deep, rem, light, awake] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: integer }

    Workout:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, activity_type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            activity_type: { type: string, examples: [running] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: [integer, "null"] }
            active_energy_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            avg_heart_rate: { type: [number, "null"] }
            max_heart_rate: { type: [number, "null"] }
            avg_speed_mps: { type: [number, "null"] }
            elevation_gain_m: { type: [number, "null"] }
            vo2_max: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RoutePoint:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, workout_id, timestamp, latitude, longitude]
          properties:
            id: { type: integer, format: int64 }
            workout_id: { type: integer, format: int64 }
            timestamp: { type: string, format: date-time }
            latitude: { type: number }
            longitude: { type: number }
            altitude_m: { type: [number, "null"] }
            speed_mps: { type: [number, "null"] }
            course_deg: { type: [number, "null"] }

    NutritionLog:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            meal_type: { type: [string, "null"] }
            energy_kcal: { type: [number, "null"] }
            protein_g: { type: [number, "null"] }
            carbs_g: { type: [number, "null"] }
            fat_g: { type: [number, "null"] }
            fiber_g: { type: [number, "null"] }
            sugar_g: { type: [number, "null"] }
            sodium_mg: { type: [number, "null"] }
            nutrients:
              type: [object, "null"]
              description: Extended nutrients by name.
              additionalProperties: true
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    DailySummary:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, date, metadata]
          properties:
            id: { type: integer, format: int64 }
            date: { type: string, format: date, description: The user's local calendar day. }
            readiness_score: { type: [number, "null"] }
            activity_score: { type: [number, "null"] }
            sleep_score: { type: [number, "null"] }
            recovery_score: { type: [number, "null"] }
            strain_score: { type: [number, "null"] }
            step_count: { type: [integer, "null"] }
            active_kcal: { type: [number, "null"] }
            total_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            floors_climbed: { type: [integer, "null"] }
            resting_hr: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    Coverage:
      type: object
      required: [pending_jobs, parked_jobs, rejected_records, days, truncated]
      properties:
        pending_jobs:
          type: integer
          description: ETL jobs of the user not finished yet (pending or running).
        parked_jobs:
          type: integer
          description: ETL jobs that exhausted their retries (an operator must look).
        rejected_records:
          type: integer
          description: |
            Lines of the user the ETL could not store (bad value, missing field, unknown unit)
            and has not recovered since, each line once; an object that failed as a whole
            counts as one. Counts every provider and day, whatever the filters.
        truncated:
          type: boolean
          description: True when more than 10000 days matched; days holds the earliest.
        days:
          type: array
          items:
            type: object
            required: [provider, date, records, metrics, last_synced_at]
            properties:
              provider: { type: string }
              date: { type: string, format: date }
              records: { type: integer, description: Sum over metrics. }
              metrics:
                type: object
                additionalProperties: { type: integer }
              last_synced_at: { type: string, format: date-time }

    SamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Sample" } }
    CategorySamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/CategorySample" } }
    SleepSessionPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepSession" } }
    SleepPhasePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepPhase" } }
    WorkoutPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Workout" } }
    RoutePointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RoutePoint" } }
    NutritionLogPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/NutritionLog" } }
    DailySummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/DailySummary" } }
