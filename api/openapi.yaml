# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.1.0
info:
  title: Open Health Sync API
  version: "1.0.0"
  summary: Self-hostable health data aggregator.
  description: |
    All bodies are JSON. Times are RFC 3339 in UTC. Values are in canonical units.

    **Auth.** `Authorization: Bearer <secret>`. Tenant API keys (`ohs_sk_...`) call the
    tenant routes, server to server. User tokens (`ohs_ut_...`), minted with
    `POST /v1/users/{id}/tokens`, are scoped to one end user and to `upload`, `connect`
    or `read`, and call the user routes. A tenant key on a user route, or a user token on
    a tenant route, gets 403.

    **Lists** are ordered by time ascending and paged with `cursor` and `limit` (default
    100, at most 1000; a larger limit is a 400). Every list answers
    `{"data": [...], "next_cursor": "..." | null}`; pass `next_cursor` back as `cursor`
    until it is null. Time windows are half open: `start` <= record time < `end`.
    `start` and `end` take an RFC 3339 time or a `YYYY-MM-DD` date (midnight UTC).

    **FHIR.** `GET /v1/users/{id}/fhir/Observation` serves the same quantity samples, blood
    pressure readings, sleep sessions, workouts, daily summaries, ECG recordings and nutrition logs as FHIR R4 Observations
    (`application/fhir+json`), the user as a Patient, the devices the records came from as
    Devices, who produced each Observation as its Provenance, and all of them in one paged
    Bundle with `GET /v1/users/{id}/fhir/Patient/{id}/$everything`; see docs/fhir.md.
    `GET /v1/users/{id}/omh/data-points` serves
    them as Open mHealth data points; see docs/open-mhealth.md.

    **Exports.** `GET /v1/users/{id}/exports/{dataset}` streams every record of one list in a
    time window as a single CSV or Parquet file, and `GET /v1/users/{id}/archive` everything
    held about one user as a single zip file (data portability); see docs/exports.md.

    **Share links.** `POST /v1/users/{id}/shares` makes a SMART Health Link: an encrypted
    snapshot of the user's records that the person gives to whoever they choose. The
    reader's viewer calls the public `POST /shl/{manifest_id}` with no credential; see
    docs/share-links.md.

    **Errors** are RFC 9457 `application/problem+json`. A user, workout or sleep session
    of another tenant is a 404, never a 403. Any operation answers 503 with `Retry-After`
    (seconds) while the instance cannot reach its database; the same request can be sent
    again then.

    **Request ids.** Every response carries `X-Request-Id` (the caller's own when it is 1
    to 128 letters, digits, `-`, `_` or `.`, else a fresh one); a problem body repeats it as
    `request_id`, and the server logs carry it too.

    **Idempotency.** `Idempotency-Key` (1 to 255 characters) is honoured on
    `POST /v1/users`, `POST /v1/users/{id}/tags` and `POST /v1/users/{id}/self-reports`: a retry with the same key and the same request within 24 hours gets the first response back, with
    `Idempotent-Replayed: true`. The same key with another request is a 422; a retry while
    the first call still runs is a 409. Token minting ignores the header (replaying it would
    mean storing the token); device uploads are idempotent by their own headers.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: The instance serving this document (GET /openapi.yaml), or set your own.
tags:
  - name: providers
  - name: users
  - name: tokens
  - name: webhooks
  - name: connections
  - name: consent
  - name: read
  - name: tags
  - name: self-reports
  - name: shares
  - name: fhir
  - name: omh
  - name: exports
  - name: ingest
  - name: provider-facing
  - name: mcp
  - name: tenant
  - name: pipeline
  - name: admin
  - name: audit
  - name: ops
security:
  - tenantKey: []

webhooks:
  event:
    post:
      tags: [webhooks]
      summary: An event sent to a registered endpoint
      description: |
        Verify `webhook-signature` (`v1,` + base64 HMAC-SHA256 of `{webhook-id}.{webhook-timestamp}.{body}`
        keyed by the base64-decoded secret after `whsec_`), refuse a timestamp more than 5
        minutes off, and deduplicate on `webhook-id`. Answer 2xx within 15 seconds; anything
        else is retried.
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string, description: Unix seconds } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Accepted. }

paths:
  /v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: Connectors enabled on this instance
      description: |
        The connectors enabled on this instance, less those an instance admin turned off for the
        caller's tenant.
      responses:
        "200":
          description: Enabled connectors, by slug.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create an end user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: An empty body creates a user without an external reference.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
              description: /v1/users/{id}
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A user with this external_ref exists, or an idempotent request with this key is in progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyMismatch" }
    get:
      tags: [users]
      operationId: listUsers
      summary: List the tenant's end users, oldest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [users]
      operationId: getUser
      summary: Get one end user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Hard-delete an end user
      description: |
        The user's status becomes `deleting` at once: reads of their data return 404 and
        the user's tokens stop working, so uploads get 401 (410 only for an upload whose
        token was accepted just before). A background job then revokes provider connections (best effort),
        deletes the user's raw files and every row of the user, then the user.
        `GET /v1/deletions/{job_id}` tells when it is done.
      responses:
        "202":
          description: Deletion accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/deletions/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        description: |
          The `job_id` returned by `DELETE /v1/users/{id}`, `DELETE /v1/users/{id}/data/{provider}`
          or `DELETE /v1/users/{id}/connections/{provider}?delete_data=true`.
        schema: { type: string, format: uuid }
    get:
      tags: [users]
      operationId: getDeletion
      summary: Status of a deletion
      description: |
        Poll until `status` is `done`: the user's raw files and rows are gone (with `provider`
        set, only those of that provider). The job is kept after the user is deleted. Another
        tenant's job is a 404.
      responses:
        "200":
          description: The deletion job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks:
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Register a webhook endpoint
      description: |
        The endpoint receives a signed POST for each event of `event_types` (empty or absent:
        every type). The response carries the signing `secret` (`whsec_...`), shown only here
        (`Cache-Control: no-store`). The URL must be https and must not point at a private,
        loopback or link-local address, unless the instance sets `OHS_WEBHOOK_ALLOW_PRIVATE=true`.
        At most 20 endpoints per tenant. `Idempotency-Key` is ignored here. See docs/webhooks.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Registered.
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: The tenant's webhook endpoints
      description: Oldest first, on one page (`next_cursor` is always null).
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - properties:
                      data:
                        items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      tags: [webhooks]
      operationId: getWebhook
      summary: One webhook endpoint
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Change a webhook endpoint
      description: |
        Absent fields stay as they are. `enabled: false` disables the endpoint and parks its
        pending deliveries; `enabled: true` re-activates it (also after an automatic disable)
        and clears its failure state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookRequest" }
      responses:
        "200":
          description: The endpoint after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: The endpoint and its deliveries are deleted; nothing more is sent to it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks/{webhook_id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Replace the signing secret
      description: |
        The new secret signs every request from now on, retries of earlier events included.
        Shown only in this response.
      responses:
        "200":
          description: The new secret.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string, examples: ["whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks/{webhook_id}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      tags: [webhooks]
      operationId: testWebhook
      summary: Send a test event
      description: |
        Queues a test event for this endpoint alone, whatever its event types. Without a body (or
        with `event_type` `webhook.test`) it is the generic `webhook.test` event. With another
        `event_type` it is a realistic sample of that event, about no real user (`user_id` is the
        nil UUID, `external_ref` is `sample-user`). Either payload carries `"test": true`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestWebhookRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: The endpoint's deliveries
      description: |
        Newest first (unlike the data lists). Finished deliveries are kept 30 days.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, running, done, parked] }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - properties:
                      data:
                        items: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks/{webhook_id}/deliveries/{delivery_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    get:
      tags: [webhooks]
      operationId: getWebhookDelivery
      summary: One delivery with its payload and attempts
      description: |
        The delivery, the exact JSON body it sends (`payload`) and its attempts, oldest first: status
        code, error, timing and the first 1 KiB of the receiver's answer. The last 20 attempts
        are kept.
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/webhooks/{webhook_id}/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    post:
      tags: [webhooks]
      operationId: replayWebhookDelivery
      summary: Send a finished delivery's event again, as a new delivery
      description: |
        Queues a new delivery of a `done` or `parked` delivery's event: same `event_id` (so the same
        `webhook-id` header, which receivers deduplicate on) and same payload. The new delivery
        has `replay_of` set and its own attempts; the original keeps its history. One still pending
        or running is a 409. At most 10 replays of an endpoint wait at once; more is a 429.
      responses:
        "202":
          description: Queued. `Location` is the new delivery.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/webhooks/{webhook_id}/deliveries/{delivery_id}/retry:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    post:
      tags: [webhooks]
      operationId: retryWebhookDelivery
      summary: Send a finished delivery again
      description: |
        A `done` or `parked` delivery is sent again from its first attempt, with its original
        `webhook-id` and payload. One still pending or running is a 409.
      responses:
        "202":
          description: Queued again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [tokens]
      operationId: mintUserToken
      summary: Mint a user token
      description: |
        Returns an opaque `ohs_ut_` token for one active user, shown only in this response
        (`Cache-Control: no-store`). Lifetime: one hour by default, at most 24 hours; a token
        whose only scope is `read` may live up to 30 days (2592000 s), for a person's own AI
        agent configuration (MCP). `Idempotency-Key` is ignored here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MintTokenRequest" }
      responses:
        "201":
          description: Minted.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/users/{id}/connections:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [connections]
      operationId: listConnections
      summary: The user's provider connections
      responses:
        "200":
          description: Connections, one per provider.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/freshness:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [connections]
      operationId: getFreshness
      summary: How up to date each of the user's sources is
      description: |
        One entry per provider connection, then one per device source (Apple Health) that uploaded,
        ordered by provider. `synced_through` is the end of the most recent window pulled (the time of
        the last upload for a device source) and `lag_seconds` is how far behind now it is. Providers
        that send notifications are pulled within seconds of a change; the regular pull is a backstop,
        every 6 hours while notifications arrive (`push_healthy`) and every hour otherwise.
        `state` is `fresh`, `stale` (behind by more than two pull intervals, or no upload for 26 hours),
        `failing` (the last 3 pulls failed, see `last_error`), `syncing` (first pull not done),
        `needs_reauth` or `disconnected`.
      responses:
        "200":
          description: Freshness of every source.
          content:
            application/json:
              schema:
                type: object
                required: [as_of, data]
                properties:
                  as_of: { type: string, format: date-time }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SourceFreshness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/connections/{provider}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/Provider"
    post:
      tags: [connections]
      operationId: startConnection
      summary: Start connecting a provider
      description: |
        Returns the provider's consent URL. Send the user there; after consent the user
        lands on `redirect_uri?status=connected|error&provider=<slug>`, or on a built-in
        result page when no `redirect_uri` is given. Each call mints a fresh single-use state;
        `Idempotency-Key` is not honoured here. While the user's data from this provider is
        being deleted the answer is 409: connect again once the deletion job is done. 403 when an
        instance admin turned the provider off for the tenant. For a provider without a consent
        page for other apps (Eight Sleep) the URL is this server's own sign-in page,
        `/oauth/{provider}/signin`, which asks for the account email and password; it ends the
        same way.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                redirect_uri: { type: string, format: uri }
      responses:
        "200":
          description: Consent URL.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Disconnect a provider
      description: |
        Revokes the provider grant (best effort) and stops pulling. By default the data
        already collected is kept (204).

        With `delete_data=true` the user's data from this provider is erased too: the
        disconnect happens at once, then a background job deletes every record, raw file and
        sync record of this user and provider (the user and their other providers stay). The
        answer is 202 with the `job_id` to poll at `GET /v1/deletions/{job_id}`; asking again
        while it runs returns the same job. Until it is done the provider cannot be connected
        again and its uploads are refused. The `data.erased` webhook announces the end.
      parameters:
        - name: delete_data
          in: query
          required: false
          description: true also erases the data the user holds from this provider.
          schema: { type: boolean, default: false }
      responses:
        "202":
          description: Disconnected, and the erasure of the provider's data accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "204": { description: Disconnected; the data already collected is kept. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/consents:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [consent]
      operationId: listConsents
      summary: The user's consent per source and data category
      description: |
        Every source the user has recorded consent for, with the state of each data
        category, and the list of categories. A source with no consent recorded stores
        everything, unless the instance sets `OHS_CONSENT_REQUIRED=true`, where it stores
        nothing.
      responses:
        "200":
          description: Consent per source.
          content:
            application/json:
              schema:
                type: object
                required: [data, categories]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsentSource" }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/ConsentCategoryName" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/consents/history:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [consent]
      operationId: listConsentHistory
      summary: Every consent change of the user, newest first
      description: |
        One event per category granted or revoked, with the credential that made the change
        and the evidence it gave. Kept while the user exists; erased with the user.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ConsentEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/consents/{provider}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/Provider"
    put:
      tags: [consent]
      operationId: setConsent
      summary: Set the categories the user allows from a source
      description: |
        `granted` becomes the whole list: every category left out is revoked. From then on
        the source's records outside `granted` are dropped before they are stored, and the
        records already stored in a revoked category are deleted in the background. Each
        change is kept in the history and announced by the `consent.granted` and
        `consent.revoked` webhooks. Raw payloads are not split by category: they follow
        `OHS_RETENTION_DAYS` and the user's erasure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [granted]
              properties:
                granted:
                  type: array
                  description: The categories allowed; [] for none.
                  items: { $ref: "#/components/schemas/ConsentCategoryName" }
                evidence:
                  type: string
                  maxLength: 500
                  description: What backs the change, such as a consent form version.
      responses:
        "200":
          description: The user's consent for this source after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [consent]
      operationId: revokeConsent
      summary: Revoke every category of a source
      description: The same as a PUT with `granted` empty.
      parameters:
        - name: evidence
          in: query
          required: false
          description: What backs the revocation, at most 500 characters.
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The user's consent for this source after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/data/{provider}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/Provider"
    delete:
      tags: [users]
      operationId: deleteProviderData
      summary: Erase a user's data from one provider
      description: |
        Erases everything the user holds from one provider without touching any connection:
        the route for device providers (`apple_health`, `health_connect`), which have no
        connection, and for a provider already disconnected. A background job deletes every
        record, raw file and sync record of this user and provider; the user and their other
        providers stay. The answer is 202 with the `job_id` to poll at
        `GET /v1/deletions/{job_id}`; asking again while it runs returns the same job. Until
        it is done, uploads of that provider for the user are refused (409). A provider the
        user is still connected to is a 409: use
        `DELETE /v1/users/{id}/connections/{provider}?delete_data=true`. A provider unknown to
        this build is a 404.
      responses:
        "202":
          description: Erasure accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/users/{id}/connect-sessions:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [connections]
      operationId: createConnectSession
      summary: Create a link to the hosted connection page
      description: |
        Returns a link to a page served by Open Health Sync where the user picks a provider and goes
        through its consent, so your app needs no connection UI of its own. The token in the link is
        the page's only credential: send the link to this user only. It serves several providers
        until `expires_at`. After each consent the user lands on
        `redirect_uri?status=connected|error&provider=<slug>`, or, without `redirect_uri`, on the
        built-in result page, which links back to the connection page. See docs/connect-page.md.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectSessionRequest" }
      responses:
        "201":
          description: The page link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/connections/{provider}/sync:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/Provider"
    post:
      tags: [connections]
      operationId: syncConnection
      summary: Sync a connection now
      description: |
        Queues a pull of the connection ahead of routine work and answers with the sync run; follow it
        at the `Location` header. The window ends now and starts where the connection's data ends
        (minus an hour of overlap), a day back for a connection that never synced, or at `from`
        (at most 30 days back). While a manual run of the connection is still queued or running, the
        answer is 200 with that run and nothing new is queued. 409 when the connection does not sync
        (`needs_reauth`, `disconnected`: connect the user again), its provider is not enabled here,
        or an instance admin turned the provider off for the tenant.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from: { type: string, format: date-time }
      responses:
        "200":
          description: A manual run of this connection is already queued or running.
          headers:
            Location: { schema: { type: string }, description: The run. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRun" }
        "202":
          description: Queued.
          headers:
            Location: { schema: { type: string }, description: The run. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{id}/sync-runs:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [connections]
      operationId: listSyncRuns
      summary: The user's sync history
      description: |
        Every pull of the user's connections, newest first: what started it, its window, its status,
        the raw payloads it stored and the provider's error when it failed. Finished runs are kept
        30 days.
      parameters:
        - name: provider
          in: query
          description: Only this provider's runs.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SyncRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/sync-runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: run_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [connections]
      operationId: getSyncRun
      summary: One sync run
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/samples:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listSamples
      summary: Quantity samples of one type
      parameters:
        - name: type
          in: query
          required: true
          description: Canonical quantity type, for example heart_rate or step_count. A name outside the quantity type catalog is a 400 (unless this user has samples of it).
          schema: { type: string, examples: [heart_rate] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamplePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/samples/stats:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: sampleStats
      summary: Statistics of one quantity type per hour or per local day
      description: |
        Count, sum, mean, min and max of the samples whose start falls in each interval. With
        `view=merged` (the default) each interval holds one row, from the best ranked source
        that recorded something in it (see source-priorities), so nothing counts twice; the
        choice is made per interval, not per record. With `view=all` there is one series per
        provider, source and unit: a phone and a watch counting the same steps stay apart.
        Not paged.

        Served from a continuous aggregate when the database has one and `tz` has a whole-hour
        offset over the range, else computed from the samples (same answer). Data written for a
        past hour (an imported history, a provider deletion) shows within about 5 minutes.
      parameters:
        - name: type
          in: query
          required: true
          description: Canonical quantity type, as for listSamples.
          schema: { type: string }
        - name: interval
          in: query
          description: Width of the intervals.
          schema: { type: string, enum: [hour, day], default: day }
        - name: tz
          in: query
          description: IANA time zone of the intervals; a day runs from local midnight to local midnight.
          schema: { type: string, default: UTC, example: Europe/Paris }
        - name: start
          in: query
          required: true
          description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD (midnight in tz). Widened to a whole interval.
          schema:
            oneOf:
              - { type: string, format: date-time }
              - { type: string, format: date }
        - name: end
          in: query
          required: true
          description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD (midnight in tz). Widened to a whole interval; at most 10000 intervals after start.
          schema:
            oneOf:
              - { type: string, format: date-time }
              - { type: string, format: date }
        - name: provider
          in: query
          description: Keep one provider.
          schema: { type: string }
        - $ref: "#/components/parameters/View"
      responses:
        "200":
          description: The intervals that hold samples, by start, provider, source and unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/category-samples:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [read]
      operationId: listCategorySamples
      summary: Category samples (events)
      parameters:
        - name: type
          in: query
          description: Canonical category type; all types when absent.
          schema: { type: string }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySamplePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{id}/sleep:
