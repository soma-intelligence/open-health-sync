                  - properties:
                      data:
                        items: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/webhooks/{webhook_id}/deliveries/{delivery_id}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    get:
      tags: [admin]
      operationId: getAdminTenantWebhookDelivery
      summary: One delivery with its payload and attempts (instance admin, one tenant)
      description: |
        `GET /v1/webhooks/{webhook_id}/deliveries/{delivery_id}` (`getWebhookDelivery`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/webhooks/{webhook_id}/deliveries/{delivery_id}/retry:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    post:
      tags: [admin]
      operationId: retryAdminTenantWebhookDelivery
      summary: Send a finished delivery again (instance admin, one tenant)
      description: |
        `POST /v1/webhooks/{webhook_id}/deliveries/{delivery_id}/retry` (`retryWebhookDelivery`) for the tenant of `tenant_id`, run with an
        instance admin key: the same body, parameters and answer as the tenant's own key
        gets; a `Location` points at the admin route. Recorded in the caller's audit log
        and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      responses:
        "202":
          description: Queued again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/tenants/{tenant_id}/webhooks/{webhook_id}/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    post:
      tags: [admin]
      operationId: replayAdminTenantWebhookDelivery
      summary: Send a finished delivery's event again, as a new delivery (instance admin, one tenant)
      description: |
        `POST /v1/webhooks/{webhook_id}/deliveries/{delivery_id}/replay` (`replayWebhookDelivery`) for the tenant of `tenant_id`, run with an
        instance admin key: the same body, parameters and answer as the tenant's own key
        gets; a `Location` points at the admin route. Recorded in the caller's audit log
        and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      responses:
        "202":
          description: Queued. `Location` is the new delivery.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/admin/tenants/{tenant_id}/pipeline/sync-runs:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: listAdminTenantPipelineSyncRuns
      summary: Sync runs of every user of the tenant (instance admin, one tenant)
      description: |
        `GET /v1/pipeline/sync-runs` (`listTenantSyncRuns`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, retrying, rate_limited, succeeded, failed, cancelled] }
        - name: provider
          in: query
          description: Only this provider's runs.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TenantSyncRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/pipeline/etl-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: listAdminTenantETLJobs
      summary: Processing jobs of the tenant (instance admin, one tenant)
      description: |
        `GET /v1/pipeline/etl-jobs` (`listETLJobs`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [parked, pending, running], default: parked }
        - name: provider
          in: query
          description: Only this provider's jobs.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ETLJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/pipeline/etl-jobs/retry:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    post:
      tags: [admin]
      operationId: retryAdminTenantParkedETLJobs
      summary: Retry every parked processing job (instance admin, one tenant)
      description: |
        `POST /v1/pipeline/etl-jobs/retry` (`retryParkedETLJobs`) for the tenant of `tenant_id`, run with an
        instance admin key: the same body, parameters and answer as the tenant's own key
        gets; a `Location` points at the admin route. Recorded in the caller's audit log
        and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string, description: Only this provider's parked jobs. }
      responses:
        "200":
          description: How many jobs were queued again.
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties:
                  retried: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/pipeline/etl-jobs/{job_id}/retry:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - name: job_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [admin]
      operationId: retryAdminTenantETLJob
      summary: Retry one parked processing job (instance admin, one tenant)
      description: |
        `POST /v1/pipeline/etl-jobs/{job_id}/retry` (`retryETLJob`) for the tenant of `tenant_id`, run with an
        instance admin key: the same body, parameters and answer as the tenant's own key
        gets; a `Location` points at the admin route. Recorded in the caller's audit log
        and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      responses:
        "200":
          description: The job, pending again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ETLJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/tenants/{tenant_id}/audit:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: listAdminTenantAuditEvents
      summary: The tenant's audit log, newest first (instance admin, one tenant)
      description: |
        `GET /v1/audit` (`listAuditEvents`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - name: user_id
          in: query
          description: Only events about this end user.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: An exact action (`data.export`), or a prefix ending in a dot (`data.`).
          schema: { type: string }
        - name: since
          in: query
          description: Events at or after this time (RFC 3339 or YYYY-MM-DD).
          schema: { type: string }
        - name: until
          in: query
          description: Events before this time (RFC 3339 or YYYY-MM-DD).
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: The tenant's audit log, newest first
      description: |
        One event per authenticated request (tenant key or user token) and per
        administrative or system action: who (the credential), what (the action
        and route), about which user, when, and the status. Never a health value,
        a secret or a query string. Append only; events older than
        `OHS_AUDIT_RETENTION_DAYS` (default 365) are pruned.
      parameters:
        - name: user_id
          in: query
          description: Only events about this end user.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: An exact action (`data.export`), or a prefix ending in a dot (`data.`).
          schema: { type: string }
        - name: since
          in: query
          description: Events at or after this time (RFC 3339 or YYYY-MM-DD).
          schema: { type: string }
        - name: until
          in: query
          description: Events before this time (RFC 3339 or YYYY-MM-DD).
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/setup:
    get:
      tags: [ops]
      operationId: getSetup
      summary: Whether the first-run setup is open (only when OHS_SETUP_TOKEN is set)
      description: |
        Public, no credential. `needed` is true while `OHS_SETUP_TOKEN` is set and the
        instance has no tenant. With no `OHS_SETUP_TOKEN` the route is not mounted (404).
        See docs/setup.md.
      security: []
      responses:
        "200":
          description: "The setup state. Sent with `Cache-Control: no-store`."
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ops]
      operationId: runSetup
      summary: Create the first tenant and its API key with the setup token
      description: |
        The first run without a terminal: the body carries `OHS_SETUP_TOKEN` (compared in
        constant time) instead of a bearer credential. It works once: while the instance
        has no tenant, it creates one with its first API key and returns the key, shown only
        this once. Any tenant existing, however it was created, closes it for good (409).
        The body is at most 4 KiB. The creation is recorded in the new tenant's audit log
        (`tenant.create`, actor `system` / `setup`). With no `OHS_SETUP_TOKEN` the route is
        not mounted (404). See docs/setup.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: "The tenant and its first API key. Sent with `Cache-Control: no-store`."
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The setup token is missing or is not `OHS_SETUP_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The instance already has a tenant; the setup is closed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /openapi.yaml:
    get:
      tags: [ops]
      operationId: openapi
      summary: This OpenAPI description, as served by this version
      description: Readable from any origin (`Access-Control-Allow-Origin` is `*`), so a hosted
        Swagger UI, Redoc or Postman can import it by URL.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness (database ping and raw store check)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        "503":
          description: The database or the raw store does not answer.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics (absent when OHS_METRICS=false)
      description: |
        Instance wide counters, never per-tenant data. On the API listener a
        scrape presents the `OHS_METRICS_TOKEN` bearer token; with no token
        configured every scrape is refused with 403. With
        `OHS_METRICS_LISTEN` set the route moves to that address (404 here),
        where the token is asked for only when set.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: The bearer token is missing or is not `OHS_METRICS_TOKEN`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: No `OHS_METRICS_TOKEN` is configured, so the API listener serves no metrics.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    tenantKey:
      type: http
      scheme: bearer
      description: Tenant API key, `ohs_sk_` + 43 base62 characters.
    userToken:
      type: http
      scheme: bearer
      description: User token, `ohs_ut_` + 43 base62 characters, with the scope the route needs.
    metricsToken:
      type: http
      scheme: bearer
      description: The instance's `OHS_METRICS_TOKEN`, for Prometheus scrapes of `/metrics`.

  headers:
    IdempotentReplayed:
      description: "true when the response was replayed for a repeated Idempotency-Key."
      schema: { type: string, const: "true" }

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FHIRPatientID:
      name: patient_id
      in: path
      required: true
      description: The Patient id, which is the user id; any other value is a 404.
      schema: { type: string }
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryID:
      name: delivery_id
      in: path
      required: true
      schema: { type: integer }
    TagID:
      name: tag_id
      in: path
      required: true
      description: The `id` of a time tag of this user.
      schema: { type: string, format: uuid }
    ShareID:
      name: share_id
      in: path
      required: true
      description: The `id` of a share link of this user.
      schema: { type: string, format: uuid }
    ManifestID:
      name: manifest_id
      in: path
      required: true
      description: |
        The last path segment of a share link's `url`: 43 base64url characters (32 random
        bytes). The server keeps only its SHA-256 hash.
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      description: Connector slug, see GET /v1/providers.
      schema: { type: string, examples: [withings] }
    TenantID:
      name: tenant_id
      in: path
      required: true
      description: The `id` of a tenant; any other value is a 404.
      schema: { type: string, format: uuid }
    ConnectSessionToken:
      name: session
      in: query
      required: true
      description: The token of the connect session link.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    View:
      name: view
      in: query
      description: |
        `merged` (the default): when several sources recorded the same thing (a ring and a
        watch the same night, a phone and a watch the same steps, one sample directly and
        through an aggregator), only the best ranked source's record is listed, so nothing
        counts twice. The order of sources is the user's (see source-priorities). `all`:
        every stored record of every source.
      schema: { type: string, enum: [merged, all], default: merged }
    Start:
      name: start
      in: query
      description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    End:
      name: end
      in: query
      description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD. Must not be before start.
      schema:
        oneOf:
          - { type: string, format: date-time }
          - { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    BadRequest:
      description: Invalid parameters or body.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, unknown, revoked or expired credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: This credential cannot call this route (wrong kind or missing scope).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not the caller's.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many requests of this kind are queued; wait for them to finish.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The body is too large.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyMismatch:
      description: The Idempotency-Key was used with a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ConnectHTML:
      description: |
        A page of the hosted connection flow. Sent with `Cache-Control: no-store`,
        `Referrer-Policy: no-referrer`, `X-Frame-Options: DENY` and a Content-Security-Policy that
        allows no script.
      content:
        text/html:
          schema: { type: string }
    RateLimited:
      description: |
        Over the rate limit of this provider-facing route (per client address, and per provider
        for notifications); nothing was done. Limits are set per instance, see the
        self-hosting guide.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    ShareInactive:
      description: |
        The share link is unknown, revoked, disabled, past its expiry, or this location was
        used already; the cases are not told apart.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ShareBusy:
      description: |
        The share link or its user stayed locked past 2 seconds (a burst of requests on the
        link, or the user being erased); nothing was recorded.
      headers:
        Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    SetupStatus:
      type: object
      required: [needed]
      properties:
        needed:
          type: boolean
          description: True while the instance has no tenant and POST /v1/setup can create one.
    SetupRequest:
      type: object
      required: [setup_token]
      additionalProperties: false
      properties:
        setup_token:
          type: string
          description: The instance's `OHS_SETUP_TOKEN`.
        tenant_name:
          type: string
          maxLength: 100
          description: Name of the tenant; surrounding spaces are trimmed. Empty or absent means `default`. No control character.
    SetupResult:
      type: object
      required: [tenant_id, api_key]
      properties:
        tenant_id: { type: string, format: uuid }
        api_key:
          type: string
          description: The tenant API key (`ohs_sk_...`), shown only this once.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, examples: [about:blank] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id:
          type: string
          description: The X-Request-Id of the response, to quote when reporting the error.

    PageBase:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    ConsentCategoryName:
      type: string
      enum: [activity, location, heart, ecg, blood_pressure, glucose, respiratory, body, sleep, nutrition, reproductive, mental, other]
    ConsentCategory:
      type: object
      required: [category, granted, granted_at, revoked_at]
      properties:
        category: { $ref: "#/components/schemas/ConsentCategoryName" }
        granted: { type: boolean }
        granted_at: { type: [string, "null"], format: date-time, description: "When it was last granted." }
        revoked_at: { type: [string, "null"], format: date-time, description: "When it was revoked, while it is." }
    ConsentSource:
      type: object
      required: [provider, categories, updated_at]
      properties:
        provider: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ConsentCategory" }
        updated_at: { type: string, format: date-time }
    ConsentEvent:
      type: object
      required: [id, at, provider, category, action, actor_id, evidence]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        provider: { type: string }
        category: { $ref: "#/components/schemas/ConsentCategoryName" }
        action: { type: string, enum: [granted, revoked] }
        actor_id: { type: string, description: "The id of the API key that made the change." }
        evidence: { type: string }

    Tenant:
      type: object
      required: [id, name, admin, created_at, key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        admin:
          type: boolean
          description: True for the instance admin tenant, whose keys manage the providers. The first tenant of an instance is the admin.
        created_at: { type: string, format: date-time }
        key:
          type: object
          description: The key making the call.
          required: [id, prefix]
          properties:
            id: { type: string, format: uuid }
            prefix: { type: string, examples: [ohs_sk_2dybB] }

    APIKey:
      type: object
      required: [id, prefix, created_at, last_used_at, revoked_at, current]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string, description: "The start of the key, kept in clear to tell keys apart." }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        current: { type: boolean, description: True for the key making the call. }

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "The whole key, returned this once." }

    AdminTenant:
      type: object
      required: [id, name, admin, created_at, active_keys]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        admin:
          type: boolean
          description: True for an instance admin tenant, whose keys reach the /v1/admin routes.
        created_at: { type: string, format: date-time }
        active_keys: { type: integer, description: "The tenant's keys that are not revoked." }

    CreatedAdminTenant:
      allOf:
        - $ref: "#/components/schemas/AdminTenant"
        - type: object
          required: [key]
          properties:
            key:
              $ref: "#/components/schemas/CreatedAPIKey"
              description: The tenant's first key, with its secret, returned this once.

    CreateAdminTenantRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: |
            Surrounding spaces are trimmed; what is left must be 1 to 100 characters, none of them a
            control character.

    DemoUserRequest:
      type: object
      additionalProperties: false
      properties:
        external_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The user to fill, created when the tenant has none with this reference. By default
            `demo-user` for `mix` and `demo-<persona>` for the others, so each persona fills its own.
        days:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
          description: Days of data, ending yesterday.
        persona:
          type: string
          enum: [mix, runner, sleep, weight]
          default: mix
          description: |
            The kind of person: `mix` (one person seen through six sources), `runner` (polar, whoop,
            apple_health), `sleep` (a short, irregular sleeper: oura, apple_health) or `weight`
            (someone watching their weight: withings, fitbit). See docs/demo.md.

    DemoUser:
      type: object
      required: [user, days, rows_written, persona]
      properties:
        user: { $ref: "#/components/schemas/User" }
        days: { type: integer }
        rows_written:
          type: integer
          description: Rows this call stored; 0 when every day was already there.
        persona:
          type: string
          enum: [mix, runner, sleep, weight]
          description: The persona written.

    Pipeline:
      type: object
      required: [generated_at, users, sources, sync, processing, storage, delivery]
      properties:
        generated_at: { type: string, format: date-time }
        users:
          type: object
          required: [active, deleting]
          properties:
            active: { type: integer, format: int64 }
            deleting: { type: integer, format: int64 }
        sources:
          type: array
          items: { $ref: "#/components/schemas/PipelineSource" }
        sync:
          type: object
          description: |
            Sync runs in flight (`queued`, `running`, `retrying` after a failed attempt,
            `rate_limited`), and those created in the last 24 hours that ended `failed` or
            `succeeded`.
          required: [queued, running, retrying, rate_limited, failed_24h, succeeded_24h]
          properties:
            queued: { type: integer, format: int64 }
            running: { type: integer, format: int64 }
            retrying: { type: integer, format: int64 }
            rate_limited: { type: integer, format: int64 }
            failed_24h: { type: integer, format: int64 }
            succeeded_24h: { type: integer, format: int64 }
        processing:
          type: object
          description: Processing jobs by status, and the records processing rejected and has not recovered (as in the coverage report).
          required: [pending, running, parked, rejected_records]
          properties:
            pending: { type: integer, format: int64 }
            running: { type: integer, format: int64 }
            parked: { type: integer, format: int64 }
            rejected_records: { type: integer, format: int64 }
        storage:
          type: object
          description: Raw payloads stored in the last 24 hours.
          required: [raw_objects_24h, raw_bytes_24h]
          properties:
            raw_objects_24h: { type: integer, format: int64 }
            raw_bytes_24h: { type: integer, format: int64 }
        delivery:
          type: object
          description: Webhook endpoints (failing ones are on but their last deliveries failed) and the deliveries not done.
          required: [endpoints, endpoints_failing, endpoints_disabled, pending, parked]
          properties:
            endpoints: { type: integer, format: int64 }
            endpoints_failing: { type: integer, format: int64 }
            endpoints_disabled: { type: integer, format: int64 }
            pending: { type: integer, format: int64 }
            parked: { type: integer, format: int64 }

    PipelineSource:
      type: object
      required: [slug, name, kinds, enabled, connections, broken, paused_until]
      properties:
        slug: { type: string }
        name: { type: string }
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }
        enabled: { type: boolean }
        connections:
          type: object
          description: The tenant's connections by status (active, needs_reauth, disconnected).
          additionalProperties: { type: integer, format: int64 }
        broken: { type: integer, format: int64, description: Active connections whose health is not ok. }
        paused_until:
          type: [string, "null"]
          format: date-time
          description: Set while the provider's rate limit pauses every pull.

    TenantSyncRun:
      allOf:
        - $ref: "#/components/schemas/SyncRun"
        - type: object
          required: [user_id]
          properties:
            user_id: { type: string, format: uuid }

    ETLJob:
      type: object
      description: One processing job, turning a stored raw payload into records.
      required: [id, user_id, provider, tier, status, attempts, error, created_at, next_attempt_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        provider: { type: string }
        tier: { type: string }
        status: { type: string, enum: [pending, running, parked, done] }
        attempts: { type: integer }
        error: { type: [string, "null"], description: The error of the last failed attempt. }
        created_at: { type: string, format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time, description: Set while the job is pending. }

    AdminProvider:
      type: object
      required: [slug, name, kinds, status, enabled, source, keys, error, urls, updated_at, updated_by]
      properties:
        slug: { type: string }
        name: { type: string }
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }
        status:
          type: string
          enum: [active, off, not_configured, error, built_in]
          description: |
            `active` runs; `off` was turned off; `not_configured` lacks a required key; `error` has
            keys the provider's rules refuse (see `error`); `built_in` needs no key and is always on.
        enabled: { type: boolean }
        source:
          type: [string, "null"]
          enum: [env, console, null]
          description: Where the keys come from. Environment variables win over the console as a whole.
        keys:
          type: array
          items: { $ref: "#/components/schemas/AdminProviderKey" }
        error: { type: [string, "null"] }
        urls:
          type: object
          description: The addresses to register in the provider's developer portal.
          required: [redirect, inbound]
          properties:
            redirect: { type: [string, "null"], description: "The OAuth redirect URI, for a provider users connect to." }
            inbound: { type: [string, "null"], description: "Where the provider posts notifications, for a push provider." }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"], description: The id of the API key that saved the last change. }

    AdminProviderKey:
      type: object
      required: [name, env, required, secret, set, value]
      properties:
        name: { type: string, examples: [CLIENT_ID] }
        env: { type: string, description: "The environment variable that can set it instead.", examples: [OHS_OURA_CLIENT_ID] }
        required: { type: boolean }
        secret: { type: boolean }
        set: { type: boolean }
        value: { type: [string, "null"], description: The saved value of a key that is not a secret. Secrets are never served. }

    AdminProviderPatch:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: object
          description: Key name to its new value; null removes the key.
          additionalProperties: { type: [string, "null"] }
        enabled: { type: boolean }

    AdminTenantProvider:
      type: object
      required: [slug, name, kinds, instance_status, enabled, own_keys, available, updated_at]
      properties:
        slug: { type: string, examples: [oura] }
        name: { type: string, examples: [Oura] }
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }
        instance_status:
          type: string
          enum: [active, off, not_configured, error, built_in]
          description: The provider's status on the instance, as `GET /v1/admin/providers` gives it.
        enabled:
          type: boolean
          description: The tenant's switch, true unless an instance admin turned it off.
        own_keys:
          type: boolean
          description: |
            True while the tenant has keys of its own for the provider
            (`/v1/admin/tenants/{tenant_id}/providers/{provider}/keys`).
        available:
          type: boolean
          description: |
            True when the tenant's users can use the provider now: `enabled` is true and either the
            tenant's own keys run, or the tenant has none and the instance runs the provider
            (`active` or `built_in`).
        updated_at:
          type: [string, "null"]
          format: date-time
          description: The last change of the switch, null when it was never set.

    AdminTenantProviderKeys:
      type: object
      required: [provider, set, status, error, client_id, keys, urls, created_at, updated_at, updated_by]
      properties:
        provider: { type: string, examples: [withings] }
        set:
          type: boolean
          description: True while the tenant has keys of its own for the provider.
        status:
          type: string
          enum: [active, error, not_set]
          description: |
            `active`: the tenant's new connections use these keys. `error`: they do not run (they no
            longer open with the configured encryption keys, or the provider refused them, see
            `error`); the tenant cannot connect the provider until they are set again or removed.
            `not_set`: the tenant uses the instance's keys.
        error: { type: [string, "null"] }
        client_id:
          type: [string, "null"]
          description: The first and last four characters of `CLIENT_ID`, never all of it.
          examples: [abcd...wxyz]
        keys:
          type: array
          description: Every key the provider takes. No value is ever served.
          items:
            type: object
            required: [name, required, secret, set]
            properties:
              name: { type: string, examples: [CLIENT_SECRET] }
              required: { type: boolean }
              secret: { type: boolean }
              set: { type: boolean }
        urls:
          type: object
          description: |
            The addresses to register in the tenant's application at the provider: the instance's,
            the same for every tenant.
          required: [redirect, inbound]
          properties:
            redirect: { type: [string, "null"], description: "The OAuth redirect URI." }
            inbound: { type: [string, "null"], description: "Where the provider posts notifications, for a push provider." }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"], description: The id of the admin key that saved the keys. }
        reauth_required:
          type: integer
          description: |
            Only in the answers of PUT and DELETE: how many connections of the tenant the change
            set `needs_reauth`.

    AdminTenantProviderKeysPut:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: object
          description: |
            Every key of the tenant's application by name, such as `CLIENT_ID` and
            `CLIENT_SECRET`; the provider's `keys` lists them. Replaces the previous ones whole.
          additionalProperties: { type: string }
          examples:
            - { CLIENT_ID: your-client-id, CLIENT_SECRET: your-client-secret }

    AdminTenantProviderPatch:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: false turns the provider off for the tenant, true turns it back on.

    AuditEvent:
      type: object
      required: [id, at, actor, action, user_id, status, detail]
      properties:
        id: { type: integer, description: "Increasing; the cursor of the next page." }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [api_key, user_token, admin, system, share_link]
            id:
              type: string
              description: |
                The API key's id, the first 16 hex characters of a user token's SHA-256
                hash, the command or worker for admin and system events, or the share's id
                for a share link used by its reader.
        action:
          type: string
          description: |
            data.read, data.export, data.write, user.create, user.read, user.delete,
            user.erased, token.create, connection.read, connection.create,
            connection.delete, connection.sync, webhook.read, webhook.write, audit.read, config.read,
            config.write, tenant.create, tenant.provider, tenant.provider_keys, key.create,
            key.revoke, share.create,
            share.read, share.revoke, share.access (more may be added).
        user_id: { type: [string, "null"], format: uuid, description: "The end user the action concerns." }
        method: { type: string, description: "The HTTP method, absent outside a request." }
        route: { type: string, description: "The route pattern, absent outside a request." }
        status: { type: [integer, "null"], description: "The HTTP status, null outside a request." }
        request_id: { type: string, description: "The X-Request-Id of the request." }
        detail: { type: object, description: "Identifiers only, such as a job id or a key prefix." }

    Provider:
      type: object
      required: [slug, kinds]
      properties:
        slug: { type: string, examples: [apple_health] }
        name:
          type: string
          description: Display name, the slug when the build has none. Older servers leave it out.
          examples: [Apple Health]
        kinds:
          type: array
          items: { type: string, enum: [oauth, push, device] }
        data_types:
          type: array
          description: >-
            What the connector delivers: first the record kinds it writes (sample,
            category, sleep, workout, route, nutrition, ecg, heartbeat, daily), then
            the canonical quantity names it can produce. Read from the connector's
            source, so a quantity is listed when the connector can write it, not
            when a given user has it. Older servers leave it out.
          items: { type: string }
          examples: [[sample, sleep, workout, heart_rate, step_count]]

    CreateUserRequest:
      type: object
      additionalProperties: false
      properties:
        external_ref:
          type: string
          maxLength: 255
          description: The tenant's own reference, unique per tenant.

    User:
      type: object
      required: [id, external_ref, status, created_at]
      properties:
        id: { type: string, format: uuid }
        external_ref: { type: [string, "null"] }
        status: { type: string, enum: [active, deleting] }
        created_at: { type: string, format: date-time }

    DeletionJob:
      type: object
      required: [job_id, user_id, provider, status, created_at, finished_at]
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        provider:
          type: [string, "null"]
          description: The provider whose data the job erases; null when it deletes the whole user.
        status:
          type: string
          enum: [pending, running, done, failed]
          description: done once every raw file and row of the user (or of the user and provider) is deleted.
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    MintTokenRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [upload, connect, read] }
        ttl_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
          description: |
            Lifetime in seconds. 0 or absent means 3600. At most 86400, or 2592000 (30 days)
            when read is the only scope.

    UserToken:
      type: object
      required: [token, expires_at, scopes]
      properties:
        token: { type: string, description: "ohs_ut_ token. Shown only once." }
        expires_at: { type: string, format: date-time }
        scopes:
          type: array
          items: { type: string, enum: [upload, connect, read] }

    WebhookEventType:
      type: string
      enum: [data.written, data.deleted, data.erased, user.deleted, connection.needs_reauth, connection.broken, connection.restored, tag.created, tag.updated, tag.deleted, consent.granted, consent.revoked, share.created, share.revoked, share.accessed]
      description: |
        `data.written`: a sync wrote new or changed records. `data.deleted`: records the
        provider deleted were removed. `data.erased`: everything a user held from one provider
        was erased on your request. `user.deleted`: a user and all their data were erased.
        `connection.needs_reauth`: a provider refused the user's grant; the user must connect again.
        `connection.broken`: a connection stopped syncing; `reason` says why and `action` what fixes
        it (`reconnect`: send the user through the connect flow; `wait`: it resumes by itself).
        `connection.restored`: a broken connection synced again.
        `tag.created`, `tag.updated`, `tag.deleted`: a time tag of the user was created, changed
        or deleted through the API.
        `consent.granted`, `consent.revoked`: a user granted or revoked data categories of a source.
        `share.created`: a share link of the user was made. `share.revoked`: a share link
        stopped before its expiry; `reason` says why. `share.accessed`: a share link's file was
        given to a reader. They name the share, never the link, its key, its label or the reader.

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048, examples: ["https://app.example.com/hooks/health"] }
        description: { type: string, maxLength: 255 }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
          description: Empty or absent means every type, including types added later.

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 255 }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        enabled: { type: boolean }

    Webhook:
      type: object
      required: [id, url, description, event_types, status, disabled_reason, failing_since, last_success_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        status:
          type: string
          enum: [active, disabled]
          description: |
            An endpoint that has accepted nothing for 5 days is disabled when one more delivery
            runs out of attempts.
        disabled_reason: { type: [string, "null"] }
        failing_since:
          type: [string, "null"]
          format: date-time
          description: Start of the current run of failed attempts; null after a success.
        last_success_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: whsec_ signing secret. Shown only once.
              examples: ["whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"]

    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, status, attempts, last_status_code, last_error, next_attempt_at, created_at, delivered_at, replay_of]
      properties:
        id: { type: integer }
        event_id: { type: string, format: uuid, description: "The webhook-id header and the payload's id." }
        event_type: { type: string }
        status:
          type: string
          enum: [pending, running, done, parked]
          description: parked after 8 failed attempts (about 28 hours), or when the endpoint was disabled.
        attempts: { type: integer }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        next_attempt_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        replay_of:
          type: [integer, "null"]
          description: The delivery this one replays (same event and payload); null for an original.

    WebhookAttempt:
      type: object
      required: [id, attempt, started_at, duration_ms, status_code, error, response_body_excerpt]
      properties:
        id: { type: integer }
        attempt:
          type: integer
          minimum: 1
          description: Counts the delivery's attempts from 1, across retries.
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        status_code: { type: [integer, "null"], description: "Null when no HTTP answer came (timeout, refused connection)." }
        error: { type: [string, "null"], description: Null on a success. }
        response_body_excerpt:
          type: [string, "null"]
          maxLength: 1024
          description: |
            The first 1 KiB of the receiver's answer, printable UTF-8 only (other bytes become `?`).
            Null when the answer had no body.

    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [payload, attempt_history]
          properties:
            payload:
              $ref: "#/components/schemas/WebhookEvent"
              description: The exact JSON body sent, on every attempt.
            attempt_history:
              type: array
              description: The last 20 attempts, oldest first.
              items: { $ref: "#/components/schemas/WebhookAttempt" }

    TestWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        event_type:
          description: The event to send a sample of. Absent means `webhook.test`.
          oneOf:
            - $ref: "#/components/schemas/WebhookEventType"
            - { type: string, const: webhook.test }

    WebhookEvent:
      type: object
      description: |
        The body of every delivery. It names what changed, never a health value: read the data
        with the API. Signed per Standard Webhooks (headers webhook-id, webhook-timestamp,
        webhook-signature).
      required: [id, type, timestamp, data]
      properties:
        id: { type: string, format: uuid }
        type:
          oneOf:
            - $ref: "#/components/schemas/WebhookEventType"
            - { type: string, const: webhook.test }
        timestamp: { type: string, format: date-time }
        test:
          type: boolean
          const: true
          description: Present on events sent by the test route only. Such an event describes nothing that happened.
        data:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            external_ref: { type: [string, "null"] }
            provider: { type: string }
            records:
              type: object
              additionalProperties: { type: integer }
              description: data.written. Rows written or updated per table.
            types:
              type: array
              items: { type: string }
              description: data.written. The metrics the sync held.
            first_day: { type: string, format: date, description: "data.written. First data day." }
            last_day: { type: string, format: date, description: "data.written. Last data day." }
            records_deleted: { type: integer, description: data.deleted. }
            job_id: { type: string, format: uuid, description: "data.erased. The deletion job that finished." }
            tag_id: { type: string, format: uuid, description: "tag.created, tag.updated and tag.deleted." }
            categories:
              type: array
              items: { $ref: "#/components/schemas/ConsentCategoryName" }
              description: consent.granted and consent.revoked, the categories that changed; share.created, the categories shared.
            share_id: { type: string, format: uuid, description: "share.created, share.revoked and share.accessed." }
            expires_at: { type: string, format: date-time, description: share.created. }
            passcode: { type: boolean, description: "share.created. Whether the link needs a passcode." }
            reason:
              type: string
              enum: [needs_reauth, missing_scope, failing, rate_limited, owner, consent, provider_erased, passcode_attempts]
              description: |
                connection.broken: needs_reauth, missing_scope, failing or rate_limited.
                share.revoked: owner (revoked through the API), consent (a consent change refused
                a category it holds), provider_erased (the records of a provider it holds were
                erased) or passcode_attempts (too many wrong passcodes).
            action: { type: string, enum: [reconnect, wait], description: connection.broken. }
            retry_at: { type: string, format: date-time, description: "connection.broken, rate_limited. When pulls resume." }
            last_error: { type: string, description: "connection.broken, failing. The provider error, made safe to show." }
            consecutive_failures: { type: integer, description: "connection.broken, failing." }
            previous_reason: { type: string, description: connection.restored. }
            broken_since: { type: string, format: date-time, description: connection.restored. }
            broken_seconds: { type: integer, description: connection.restored. }
            endpoint_id: { type: string, format: uuid, description: webhook.test. }

    Connection:
      type: object
      required: [provider, status, created_at]
      properties:
        provider: { type: string }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        scopes:
          type: array
          items: { type: string }
        last_sync_at: { type: [string, "null"], format: date-time }
        initial_backfill_at: { type: [string, "null"], format: date-time, description: "When the pull of the user's history was queued." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        connected_at: { type: string, format: date-time, deprecated: true, description: "Same as created_at, under its earlier name." }
        health: { $ref: "#/components/schemas/ConnectionHealth" }

    ConnectionHealth:
      type: object
      description: |
        Whether the connection syncs, and if not why and what fixes it. `reason` is `needs_reauth`
        (the provider refused the grant: token expired or revoked), `missing_scope` (the grant lacks a
        permission the data needs), `failing` (the last 3 pulls failed) or `rate_limited` (the provider
        asked to wait an hour or more, until `retry_at`). `action` is `reconnect` (send the user
        through the connect flow again) or `wait` (it resumes by itself).
      required: [healthy, reason, action, since, retry_at]
      properties:
        healthy: { type: boolean }
        reason: { type: [string, "null"], enum: [needs_reauth, missing_scope, failing, rate_limited, null] }
        action: { type: [string, "null"], enum: [reconnect, wait, null] }
        since: { type: [string, "null"], format: date-time }
        retry_at: { type: [string, "null"], format: date-time }

    SyncRun:
      type: object
      description: |
        One pull of one connection. `status` is `queued`, `running`, `retrying` (the last attempt
        failed, see `error`; the next is at `next_attempt_at`), `rate_limited` (the provider asked to
        wait until `next_attempt_at`), `succeeded`, `failed` (attempts spent, or the grant was refused)
        or `cancelled` (the connection was disconnected). `objects_stored` counts the raw provider
        payloads stored; the records written from them are announced by `data.written` webhooks.
      required: [id, provider, trigger, status, data_type, window_start, window_end, attempts, objects_stored,
        error, created_at, started_at, finished_at, next_attempt_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string }
        trigger: { type: string, enum: [backfill, scheduled, notification, manual] }
        status: { type: string, enum: [queued, running, retrying, rate_limited, succeeded, failed, cancelled] }
        data_type: { type: [string, "null"], description: Set when a notification named the one data type to pull. }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        attempts: { type: integer, description: Failed attempts so far. }
        objects_stored: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        next_attempt_at: { type: [string, "null"], format: date-time }

    ConnectSessionRequest:
      type: object
      additionalProperties: false
      properties:
        redirect_uri:
          type: string
          format: uri
          maxLength: 2048
          description: Where the user lands after each consent. Absolute https URL (http only for localhost).
        providers:
          type: array
          maxItems: 64
          items: { type: string }
          description: Provider slugs the page offers, in this order. Each must be an OAuth provider enabled on this instance. Default, every one.
        app_name: { type: string, maxLength: 80, description: Shown as the page title. }
        logo_url: { type: string, format: uri, maxLength: 2048, description: An https image shown above the title. }
        ttl_seconds: { type: integer, minimum: 60, maximum: 3600, default: 1800 }

    ConnectSession:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri, description: "`<OHS_PUBLIC_URL>/connect?session=<token>`" }
        expires_at: { type: string, format: date-time }

    SourceFreshness:
      type: object
      required: [provider, kind, status, state, synced_through, lag_seconds, push_healthy, pull_every_seconds, consecutive_failures]
      properties:
        provider: { type: string }
        kind: { type: string, enum: [oauth, device] }
        status: { type: string, enum: [active, needs_reauth, disconnected] }
        state: { type: string, enum: [fresh, stale, failing, syncing, needs_reauth, disconnected] }
        synced_through: { type: [string, "null"], format: date-time }
        lag_seconds: { type: [integer, "null"] }
        last_sync_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time, description: Last provider notification. }
        push_healthy: { type: boolean }
        pull_every_seconds: { type: integer, description: Regular pull interval; 0 for a device source. }
        next_pull_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        consecutive_failures: { type: integer }
        health: { $ref: "#/components/schemas/ConnectionHealth" }

    Provenance:
      type: object
      required: [provider, source, device, ingested_at]
      properties:
        provider:
          type: string
          description: The integration the record came through (apple_health, withings...).
        source:
          type: [string, "null"]
          description: The vendor that produced the record, when it differs or is known.
        device: { type: [string, "null"] }
        ingested_at: { type: string, format: date-time }

    Metadata:
      type: object
      description: Provider fields kept as is, plus timezone (IANA name) when known.
      additionalProperties: true

    Sample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, value, unit, start_date, end_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string, examples: [heart_rate] }
            value: { type: number }
            unit: { type: [string, "null"], examples: [bpm] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            source_bundle_id: { type: [string, "null"] }
            device_model: { type: [string, "null"] }
            product_type: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            is_primary_source: { type: [boolean, "null"] }
            was_user_entered: { type: [boolean, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    CategorySample:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string }
            value_int: { type: [integer, "null"] }
            value_label: { type: [string, "null"] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            source_name: { type: [string, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RRInterval:
      type: object
      required: [timestamp, rr_ms, series_id, provider, ingested_at]
      properties:
        timestamp: { type: string, format: date-time, description: The beat that ends the interval. }
        rr_ms: { type: number, description: "The interval from the previous beat, in milliseconds." }
        series_id: { type: string }
        provider: { type: string }
        ingested_at: { type: string, format: date-time }

    HRVSeries:
      type: object
      required: [series_id, provider, start_date, end_date, intervals, accepted_intervals, successive_pairs,
        mean_rr_ms, mean_heart_rate_bpm, sdnn_ms, rmssd_ms, pnn50_percent]
      properties:
        series_id: { type: string }
        provider: { type: string }
        start_date: { type: string, format: date-time, description: The series' first beat. }
        end_date: { type: string, format: date-time, description: The series' last beat. }
        intervals: { type: integer, description: Stored intervals of the series. }
        accepted_intervals: { type: integer, description: Intervals kept after the plausibility and ectopic checks. }
        successive_pairs: { type: integer, description: Pairs of accepted intervals of consecutive beats. }
        mean_rr_ms: { type: [number, "null"], description: Null when no interval is accepted. }
        mean_heart_rate_bpm: { type: [number, "null"] }
        sdnn_ms: { type: [number, "null"], description: Null below 10 successive pairs. }
        rmssd_ms: { type: [number, "null"], description: Null below 10 successive pairs. }
        pnn50_percent: { type: [number, "null"], description: Null below 10 successive pairs. }

    SleepSession:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, bedtime_start, metadata]
          properties:
            id: { type: integer, format: int64 }
            bedtime_start: { type: string, format: date-time }
            bedtime_end: { type: [string, "null"], format: date-time }
            total_sleep_seconds: { type: [integer, "null"] }
            deep_sleep_seconds: { type: [integer, "null"] }
            rem_sleep_seconds: { type: [integer, "null"] }
            light_sleep_seconds: { type: [integer, "null"] }
            awake_seconds: { type: [integer, "null"] }
            sleep_score: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            resting_hr: { type: [number, "null"] }
            respiratory_rate: { type: [number, "null"] }
            spo2_avg: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    SleepPhase:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, session_id, phase, start_date, duration_s]
          properties:
            id: { type: integer, format: int64 }
            session_id: { type: integer, format: int64 }
            phase: { type: string, examples: [deep, rem, light, awake] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: integer }

    Workout:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, activity_type, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            activity_type: { type: string, examples: [running] }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            duration_s: { type: [integer, "null"] }
            active_energy_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            avg_heart_rate: { type: [number, "null"] }
            max_heart_rate: { type: [number, "null"] }
            avg_speed_mps: { type: [number, "null"] }
            elevation_gain_m: { type: [number, "null"] }
            vo2_max: { type: [number, "null"] }
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    RoutePoint:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, workout_id, timestamp, latitude, longitude]
          properties:
            id: { type: integer, format: int64 }
            workout_id: { type: integer, format: int64 }
            timestamp: { type: string, format: date-time }
            latitude: { type: number }
            longitude: { type: number }
            altitude_m: { type: [number, "null"] }
            speed_mps: { type: [number, "null"] }
            course_deg: { type: [number, "null"] }

    NutritionLog:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, start_date, metadata]
          properties:
            id: { type: integer, format: int64 }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            meal_type:
              type: [string, "null"]
              description: breakfast, lunch, dinner or snack.
            energy_kcal: { type: [number, "null"] }
            protein_g: { type: [number, "null"] }
            carbs_g: { type: [number, "null"] }
            fat_g: { type: [number, "null"] }
            fiber_g: { type: [number, "null"] }
            sugar_g: { type: [number, "null"] }
            sodium_mg: { type: [number, "null"] }
            nutrients:
              type: [object, "null"]
              description: |
                Extended nutrients by name (caffeine, vitamin_d, water...), each in its
                nutrient's unit (docs/api.md lists them).
              additionalProperties: true
            external_id: { type: [string, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }

    DailySummary:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, date, metadata]
          properties:
            id: { type: integer, format: int64 }
            date: { type: string, format: date, description: The user's local calendar day. }
            readiness_score: { type: [number, "null"] }
            activity_score: { type: [number, "null"] }
            sleep_score: { type: [number, "null"] }
            recovery_score: { type: [number, "null"] }
            strain_score: { type: [number, "null"] }
            step_count: { type: [integer, "null"] }
            active_kcal: { type: [number, "null"] }
            total_kcal: { type: [number, "null"] }
            distance_m: { type: [number, "null"] }
            floors_climbed: { type: [integer, "null"] }
            resting_hr: { type: [number, "null"] }
            hrv_avg_ms: { type: [number, "null"] }
            metadata: { $ref: "#/components/schemas/Metadata" }
            sources:
              type: object
              additionalProperties: { type: string }
              description: |
                Merged view only: the source of each figure, keyed by the figure's name
                (for example `{"step_count": "apple_health", "readiness_score": "oura"}`).

    SourceOrders:
      type: object
      description: Orders of source slugs, best first, keyed by metric, group or `*`.
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 50
        items: { type: string }

    SourcePriorities:
      type: object
      required: [priorities, defaults]
      properties:
        priorities: { $ref: "#/components/schemas/SourceOrders" }
        defaults: { $ref: "#/components/schemas/SourceOrders" }

    MenstrualFlowDay:
      type: object
      required: [date, flow, providers]
      properties:
        date: { type: string, format: date, description: The user's local calendar day. }
        flow:
          type: string
          enum: [unspecified, light, medium, heavy]
          description: The heaviest flow recorded that day.
        providers:
          type: array
          items: { type: string }
          description: The providers that recorded flow that day, sorted.

    MenstrualCycle:
      type: object
      required: [start_date, period_end_date, period_length_days, end_date, cycle_length_days, providers, flow_days]
      properties:
        start_date: { type: string, format: date, description: The first day of the period. }
        period_end_date: { type: string, format: date, description: The period's last flow day. }
        period_length_days:
          type: integer
          minimum: 1
          description: Days from start_date to period_end_date, both included (gap days count).
        end_date:
          type: [string, "null"]
          format: date
          description: The day before the next period starts; null while the cycle is open.
        cycle_length_days:
          type: [integer, "null"]
          minimum: 1
          description: Days from start_date to the next period's first day; null while open.
        providers:
          type: array
          items: { type: string }
          description: The providers that recorded the period's flow days, sorted.
        flow_days:
          type: array
          items: { $ref: "#/components/schemas/MenstrualFlowDay" }
          description: The period's flow days in order; a gap day without flow is absent.

    ECGRecording:
      allOf:
        - $ref: "#/components/schemas/Provenance"
        - type: object
          required: [id, start_date, end_date, classification, classification_value, symptoms_status,
            average_heart_rate, sampling_frequency_hz, number_of_measurements, metadata]
          properties:
            id: { type: integer, format: int64 }
            start_date: { type: string, format: date-time }
            end_date: { type: [string, "null"], format: date-time }
            classification:
              type: [string, "null"]
              description: |
                The label the recording device gave, in its maker's vocabulary, passed through as
                recorded. Apple Health: not_set, sinus_rhythm, atrial_fibrillation,
                inconclusive_low_heart_rate, inconclusive_high_heart_rate, inconclusive_poor_reading,
                inconclusive_other, unrecognized. Withings: negative, positive, inconclusive. Null
                when the stored value is none of these.
              examples: [sinus_rhythm]
            classification_value:
              type: integer
              description: The stored value the label comes from.
            symptoms_status:
              type: [string, "null"]
              description: Whether the person recorded symptoms with the recording (not_set, none, present).
            average_heart_rate: { type: [number, "null"], description: "Beats per minute, as the device reported it." }
            sampling_frequency_hz: { type: number, description: "Samples per second; 0 when the provider gives none." }
            number_of_measurements: { type: integer, description: The sample count the device reported. }
            metadata: { $ref: "#/components/schemas/Metadata" }

    ECGSamples:
      type: object
      required: [count, truncated, offsets_s, voltages_uv]
      properties:
        count: { type: integer, description: Samples returned. }
        truncated: { type: boolean, description: More samples are stored than the 100000 returned. }
        offsets_s:
          type: array
          items: { type: number }
          description: Seconds from start_date, in order.
        voltages_uv:
          type: array
          items: { type: number }
          description: Microvolts, single lead, one per offset.

    ECGRecordingDetail:
      allOf:
        - $ref: "#/components/schemas/ECGRecording"
        - type: object
          required: [samples]
          properties:
            samples: { $ref: "#/components/schemas/ECGSamples" }

    ECGRecordingPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/ECGRecording" } }

    Coverage:
      type: object
      required: [pending_jobs, parked_jobs, rejected_records, days, truncated]
      properties:
        pending_jobs:
          type: integer
          description: |
            Work of the user not finished yet: ETL jobs and provider pulls (backfill,
            scheduled or notified), pending or running. A pull that keeps failing stays
            pending while it retries; `GET /v1/users/{id}/freshness` says why.
        parked_jobs:
          type: integer
          description: ETL jobs that exhausted their retries (an operator must look).
        rejected_records:
          type: integer
          description: |
            Lines of the user the ETL could not store (bad value, missing field, unknown unit)
            and has not recovered since, each line once; an object that failed as a whole
            counts as one. Counts every provider and day, whatever the filters.
        truncated:
          type: boolean
          description: True when more than 10000 days matched; days holds the earliest.
        days:
          type: array
          items:
            type: object
            required: [provider, date, records, metrics, last_synced_at]
            properties:
              provider: { type: string }
              date: { type: string, format: date }
              records: { type: integer, description: Sum over metrics. }
              metrics:
                type: object
                additionalProperties: { type: integer }
              last_synced_at: { type: string, format: date-time }

    SampleStats:
      type: object
      required: [type, interval, tz, view, start, end, buckets, truncated]
      properties:
        type: { type: string }
        interval: { type: string, enum: [hour, day] }
        tz: { type: string }
        view: { type: string, enum: [merged, all] }
        start: { type: string, format: date-time, description: "Start of the range after widening, with the offset of tz." }
        end: { type: string, format: date-time }
        truncated:
          type: boolean
          description: True when more than 50000 rows matched; buckets holds the earliest.
        buckets:
          type: array
          items:
            type: object
            required: [start, provider, source, unit, count, sum, avg, min, max]
            properties:
              start: { type: string, format: date-time, description: "Start of the interval, with the offset of tz." }
              provider: { type: string }
              source: { type: string, description: "App, bundle or device that recorded the samples; empty when the provider names none." }
              unit: { type: [string, "null"] }
              count: { type: integer }
              sum: { type: number }
              avg: { type: number }
              min: { type: number }
              max: { type: number }

    SamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Sample" } }
    CategorySamplePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/CategorySample" } }
    RRIntervalPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RRInterval" } }
    HRVSeriesPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/HRVSeries" } }
    SleepSessionPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepSession" } }
    SleepPhasePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/SleepPhase" } }
    WorkoutPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Workout" } }
    RoutePointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/RoutePoint" } }
    NutritionLogPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/NutritionLog" } }
    DailySummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/DailySummary" } }

    MenstrualCyclePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/MenstrualCycle" } }

    TimeTagKind:
      type: string
      enum: [illness, injury, travel, jet_lag, vaccination, medication, alcohol, other]
      description: The controlled vocabulary of time tags; see docs/time-tags.md.

    TimeTagTime:
      oneOf:
        - { type: string, format: date-time }
        - { type: string, format: date }

    TimeTag:
      type: object
      required: [id, kind, label, start_at, end_at, timezone, note, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TimeTagKind" }
        label: { type: [string, "null"], maxLength: 100 }
        start_at: { type: string, format: date-time }
        end_at:
          type: [string, "null"]
          format: date-time
          description: Exclusive end; null while the tag is ongoing.
        timezone:
          type: [string, "null"]
          description: An IANA time zone, for example the destination zone of a trip.
          examples: [Asia/Tokyo]
        note: { type: [string, "null"], maxLength: 2000 }
        source:
          type: string
          description: Who recorded the tag; `user` unless the creator named itself.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SelfReportKind:
      type: string
      enum: [feeling, mood, stress, energy, sleep_quality, muscle_soreness, exertion, pain]
      description: |
        The scale of each kind: feeling, mood, stress, energy, sleep_quality and
        muscle_soreness from 1 to 5; exertion and pain from 0 to 10 (docs/self-reports.md).

    CreateSelfReportsRequest:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SelfReportInput" }

    SelfReportInput:
      type: object
      additionalProperties: false
      required: [kind, value, start_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Your id of the report. Sending it again replaces the stored value. Absent, the
            server gives one (a retry then records the report twice, unless it carries the
            same Idempotency-Key).
        kind: { $ref: "#/components/schemas/SelfReportKind" }
        value:
          type: integer
          minimum: 0
          maximum: 10
          description: A whole number on the kind's scale.
        start_at:
          type: string
          format: date-time
          description: When the rating applies, between 1900 and 2200.
        end_at:
          type: [string, "null"]
          format: date-time
          description: After `start_at`, for a rating of a period (a training session). Absent or null for an instant.
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: The IANA time zone the person was in. Empty or null is none.

    SelfReport:
      type: object
      required: [id, kind, type, value, start_at, end_at, timezone]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SelfReportKind" }
        type: { type: string, description: "The quantity type it is stored as, `reported_<kind>`.", examples: [reported_feeling] }
        value: { type: integer }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, "null"], format: date-time }
        timezone: { type: [string, "null"] }

    SelfReportsResponse:
      type: object
      required: [reports, duplicate]
      properties:
        reports:
          type: array
          description: The reports as stored, in request order, each with its id.
          items: { $ref: "#/components/schemas/SelfReport" }
        duplicate:
          type: boolean
          description: true when these exact reports had already been received.

    CreateTimeTagRequest:
      type: object
      additionalProperties: false
      required: [kind, start_at]
      properties:
        kind: { $ref: "#/components/schemas/TimeTagKind" }
        label:
          type: [string, "null"]
          maxLength: 100
          description: A short free text. Empty or null is none.
        start_at: { $ref: "#/components/schemas/TimeTagTime" }
        end_at:
          description: After `start_at`. Absent or null for a tag still ongoing.
          oneOf:
            - $ref: "#/components/schemas/TimeTagTime"
            - { type: "null" }
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: An IANA time zone name. Empty or null is none.
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Free text, treated as health data. Empty or null is none.
        source:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
          description: Who records the tag, for example your app's name. Absent means `user`.

    UpdateTimeTagRequest:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/TimeTagKind" }
        label: { type: [string, "null"], maxLength: 100 }
        start_at: { $ref: "#/components/schemas/TimeTagTime" }
        end_at:
          oneOf:
            - $ref: "#/components/schemas/TimeTagTime"
            - { type: "null" }
        timezone: { type: [string, "null"], maxLength: 64 }
        note: { type: [string, "null"], maxLength: 2000 }

    TimeTagPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/TimeTag" } }

    ShareCategory:
      type: string
      enum: [activity, heart, blood_pressure, glucose, respiratory, body, sleep, other]
      description: |
        The consent categories a share link can hold: those with records in the FHIR view.
        location, ecg, nutrition, reproductive and mental are refused (400).

    Share:
      type: object
      description: A share link as its owner reads it. Never the link, its key or the passcode.
      required: [id, label, categories, start, end, expires_at, passcode, passcode_failures, status, revoked_at, revoked_reason, observations, file_bytes, accesses, last_accessed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, maxLength: 80, description: "Shown to the reader; empty for none." }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ShareCategory" }
        start: { type: string, format: date-time, description: "Inclusive start of the time window." }
        end: { type: string, format: date-time, description: "Exclusive end of the time window." }
        expires_at: { type: string, format: date-time, description: "When the link stops working." }
        passcode: { type: boolean, description: "Whether the link needs a passcode." }
        passcode_failures:
          type: integer
          description: Wrong or missing passcodes so far; the 10th disables the link.
        status:
          type: string
          enum: [active, expired, revoked, disabled]
          description: |
            `active`: the link works. `expired`: past `expires_at`. `revoked`: stopped before its
            expiry (see `revoked_reason`). `disabled`: too many wrong passcodes.
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_reason:
          type: [string, "null"]
          enum: [owner, consent, provider_erased, passcode_attempts, null]
        observations: { type: integer, description: "How many Observations the file holds." }
        file_bytes: { type: integer, description: "The size of the encrypted file when it was made." }
        accesses: { type: integer, description: "How many manifest requests were served the file." }
        last_accessed_at: { type: [string, "null"], format: date-time, description: "The latest of them." }
        created_at: { type: string, format: date-time }

    ShareAccess:
      type: object
      required: [at, recipient, outcome]
      properties:
        at: { type: string, format: date-time }
        recipient: { type: string, description: "The name the reader gave, as given." }
        outcome:
          type: string
          enum: [served, wrong_passcode, inactive]
          description: |
            `served`: the manifest was answered. `wrong_passcode`: a wrong or missing passcode.
            `inactive`: the link no longer worked (listed once a day at most; the audit log
            has every one).

    ShareDetail:
      allOf:
        - $ref: "#/components/schemas/Share"
        - type: object
          required: [recent_accesses]
          properties:
            recent_accesses:
              type: array
              description: The 50 latest manifest requests, newest first.
              items: { $ref: "#/components/schemas/ShareAccess" }

    SharePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Share" } }

    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [categories, start, end, expires_at]
      properties:
        categories:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ShareCategory" }
        start:
          description: Inclusive start of the window, RFC 3339 or YYYY-MM-DD.
          oneOf:
            - { type: string, format: date-time }
            - { type: string, format: date }
        end:
          description: Exclusive end of the window, after `start`.
          oneOf:
            - { type: string, format: date-time }
            - { type: string, format: date }
        expires_at:
          description: When the link stops working, in the future and at most 365 days ahead.
          oneOf:
            - { type: string, format: date-time }
            - { type: string, format: date }
        passcode:
          type: [string, "null"]
          minLength: 6
          maxLength: 64
          description: |
            When set, the reader must give it. 6 to 64 characters, no control character. The
            server keeps a PBKDF2-SHA256 hash of it only.
        label:
          type: string
          maxLength: 80
          description: Shown to the reader, for example who the link is for. One line.

    CreatedShare:
      allOf:
        - $ref: "#/components/schemas/Share"
        - type: object
          required: [uri, viewer_url]
          properties:
            uri:
              type: string
              description: |
                The link, `shlink:/` + the base64url payload (`url`, `key`, `exp`, `flag` `P`
                with a passcode, `label`). It carries the key: shown only this once.
            viewer_url:
              type: string
              description: The built-in viewer with the link in its fragment (`.../shl/view#shlink:/...`).

    ShareManifestRequest:
      type: object
      required: [recipient]
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 256
          description: Who opens the link, as the reader names themselves; shown to the owner.
        passcode: { type: string, description: "Required when the link's flag holds P." }
        embeddedLengthMax:
          type: integer
          minimum: 0
          description: The longest file to embed; a longer one comes as a `location`.

    ShareManifest:
      type: object
      required: [status, files]
      properties:
        status:
          type: string
          const: finalized
          description: A snapshot never changes.
        files:
          type: array
          items:
            type: object
            required: [contentType, lastUpdated]
            properties:
              contentType: { type: string, const: application/fhir+json }
              embedded: { type: string, description: "The file, a compact JWE." }
              location: { type: string, format: uri, description: "Where to GET the file, once, within 15 minutes." }
              lastUpdated: { type: string, format: date-time }

    PasscodeProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [remainingAttempts]
          properties:
            remainingAttempts:
              type: integer
              minimum: 0
              description: Wrong passcodes the link still takes before it is disabled.

    FHIRCoding:
      type: object
      properties:
        system: { type: string, format: uri }
        code: { type: string }
        display: { type: string }
    FHIRCodeableConcept:
      type: object
      properties:
        coding:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FHIRCoding" }
        text: { type: string }
    FHIRReference:
      type: object
      properties:
        reference: { type: string, examples: ["Patient/3f0c2f8e-8b8a-4c55-9f5e-2b0f3a1d9c11"] }
        identifier: { $ref: "#/components/schemas/FHIRIdentifier" }
        display: { type: string }
    FHIRIdentifier:
      type: object
      properties:
        system: { type: string, format: uri }
        value: { type: string }
    FHIRMeta:
      type: object
      properties:
        source:
          type: string
          format: uri
          description: The provider the record came through.
        profile:
          type: array
          items: { type: string, format: uri }
        tag:
          type: array
          description: The vendor that produced the record, when known.
          items: { $ref: "#/components/schemas/FHIRCoding" }
    FHIRPatient:
      type: object
      description: The user as a FHIR R4 Patient (docs/fhir.md).
      required: [resourceType, id, active]
      properties:
        resourceType: { type: string, const: Patient }
        id: { type: string, format: uuid }
        identifier:
          type: array
          description: The tenant's external_ref, when it set one.
          items: { $ref: "#/components/schemas/FHIRIdentifier" }
        active: { type: boolean, const: true }
    FHIRDevice:
      type: object
      description: A device the user's records came from, as a FHIR R4 Device (docs/fhir.md).
      required: [resourceType, id]
      properties:
        resourceType: { type: string, const: Device }
        id: { type: string, pattern: "^dev-[0-9a-f]{16}$", examples: [dev-4cd59d3e7b09cd28] }
        meta: { $ref: "#/components/schemas/FHIRMeta" }
        identifier:
          type: array
          description: The provider's device id (provenance `device`), when known.
          items: { $ref: "#/components/schemas/FHIRIdentifier" }
        deviceName:
          type: array
          description: The device model (`device_model`), when known.
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string, const: model-name }
        modelNumber: { type: string, description: "The product type (`product_type`), when known." }
        patient: { $ref: "#/components/schemas/FHIRReference" }
    FHIRProvenance:
      type: object
      description: Who and what produced one Observation, as a FHIR R4 Provenance (docs/fhir.md).
      required: [resourceType, id, target, recorded, agent]
      properties:
        resourceType: { type: string, const: Provenance }
        id: { type: string, pattern: "^prov-[A-Za-z0-9\\-\\.]{1,59}$", examples: [prov-qs-1234] }
        target:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FHIRReference" }
        recorded: { type: string, format: date-time, description: When the record was ingested. }
        agent:
          type: array
          minItems: 1
          description: The Device (`author`) when the record names one, then the provider (`assembler`).
          items:
            type: object
            required: [who]
            properties:
              type: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              who: { $ref: "#/components/schemas/FHIRReference" }
        entity:
          type: array
          description: The provider's own record (each external id), when it has one.
          items:
            type: object
            required: [role, what]
            properties:
              role: { type: string, const: derivation }
              what: { $ref: "#/components/schemas/FHIRReference" }
    FHIRCapabilityStatement:
      type: object
      description: What the FHIR routes serve, as a FHIR R4 CapabilityStatement.
      required: [resourceType, status, date, kind, fhirVersion, format, rest]
      properties:
        resourceType: { type: string, const: CapabilityStatement }
        status: { type: string, const: active }
        date: { type: string }
        kind: { type: string, const: instance }
        implementation:
          type: object
          properties:
            description: { type: string }
            url: { type: string, format: uri }
        fhirVersion: { type: string, const: 4.0.1 }
        format: { type: array, items: { type: string } }
        rest:
          type: array
          items:
            type: object
            properties:
              mode: { type: string, const: server }
              security:
                type: object
                properties:
                  description: { type: string }
              resource:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    interaction:
                      type: array
                      items:
                        type: object
                        properties:
                          code: { type: string }
                    searchParam:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          definition: { type: string, format: uri }
                          type: { type: string }
                          documentation: { type: string }
                    operation:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          definition: { type: string, format: uri }
    FHIRBundleLink:
      type: object
      required: [relation, url]
      properties:
        relation: { type: string, enum: [self, next] }
        url: { type: string, format: uri }
    FHIRDeviceBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Devices, one page.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link: { type: array, items: { $ref: "#/components/schemas/FHIRBundleLink" } }
        entry:
          type: array
          description: Absent when there is none.
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRDevice" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
    FHIRProvenanceBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Provenance.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link: { type: array, items: { $ref: "#/components/schemas/FHIRBundleLink" } }
        entry:
          type: array
          description: Absent when there is none.
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRProvenance" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
    FHIREverythingBundle:
      type: object
      description: |
        One page of a Patient's $everything: a FHIR R4 searchset Bundle of the Patient (first
        page), Observations, Devices and Provenance.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link: { type: array, items: { $ref: "#/components/schemas/FHIRBundleLink" } }
        entry:
          type: array
          description: Absent on an empty page after the first.
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource:
                oneOf:
                  - $ref: "#/components/schemas/FHIRPatient"
                  - $ref: "#/components/schemas/FHIRObservation"
                  - $ref: "#/components/schemas/FHIRDevice"
                  - $ref: "#/components/schemas/FHIRProvenance"
              search:
                type: object
                properties:
                  mode: { type: string, enum: [match, include] }
    OMHDataPoint:
      type: object
      description: |
        One Open mHealth data point (omh:data-point:1.0): a header (omh:header:1.2) and a body
        that follows the schema `header.schema_id` names (docs/open-mhealth.md).
      required: [header, body]
      properties:
        header:
          type: object
          required: [id, creation_date_time, schema_id, acquisition_provenance, user_id]
          properties:
            id:
              type: string
              description: The record's id, the same as its FHIR Observation id (`qs-`, `bp-`, `sleep-`, `workout-`).
              examples: [qs-1234]
            creation_date_time: { type: string, format: date-time, description: When the record was stored. }
            schema_id:
              type: object
              required: [namespace, name, version]
              properties:
                namespace: { type: string, const: omh }
                name: { type: string, examples: [heart-rate] }
                version: { type: string, examples: ["2.0"] }
            acquisition_provenance:
              type: object
              required: [source_name]
              properties:
                source_name: { type: string, description: The provider the record came from. }
                source_data_point_id: { type: string, description: "The provider's own id of the record." }
                modality: { type: string, enum: [sensed, self-reported] }
            user_id: { type: string, format: uuid }
        body:
          type: object
          description: The measure, in the shape of its schema.
    OMHDataPointPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/OMHDataPoint" } }
    FHIRObservation:
      type: object
      description: |
        A FHIR R4 Observation made from one quantity sample, a blood pressure pair, a sleep
        session, a workout, a daily summary or an ECG recording (docs/fhir.md).
      required: [resourceType, id, status, code, subject]
      properties:
        resourceType: { type: string, const: Observation }
        id: { type: string, pattern: "^[A-Za-z0-9\\-\\.]{1,64}$", examples: [qs-1234] }
        meta:
          type: object
          properties:
            source:
              type: string
              format: uri
              description: The provider the record came through.
            profile:
              type: array
              items: { type: string, format: uri }
            tag:
              type: array
              description: The vendor that produced the record, when known.
              items: { $ref: "#/components/schemas/FHIRCoding" }
        identifier:
          type: array
          description: The provider's own id of the record (of each sample of a panel), when it has one.
          items:
            type: object
            properties:
              system: { type: string, format: uri }
              value: { type: string }
        status: { type: string, const: final }
        category:
          type: array
          items: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        code: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        subject: { $ref: "#/components/schemas/FHIRReference" }
        effectiveDateTime: { type: string, format: date-time }
        effectivePeriod:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        issued:
          type: string
          format: date-time
          description: When the record was ingested (the later of a panel's two samples).
        performer:
          type: array
          description: The person, on a self report (category survey); absent otherwise.
          items: { $ref: "#/components/schemas/FHIRReference" }
        valueQuantity: { $ref: "#/components/schemas/FHIRQuantity" }
        valueCodeableConcept:
          allOf: [{ $ref: "#/components/schemas/FHIRCodeableConcept" }]
          description: Instead of valueQuantity for a classification (ecg_afib_classification).
        dataAbsentReason: { $ref: "#/components/schemas/FHIRCodeableConcept" }
        device: { $ref: "#/components/schemas/FHIRReference" }
        component:
          type: array
          minItems: 1
          description: |
            The two values of a blood pressure panel, or a sleep session's, workout's, daily
            summary's or ECG recording's other fields; a field without a value is left out.
          items:
            type: object
            required: [code]
            properties:
              code: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              valueQuantity: { $ref: "#/components/schemas/FHIRQuantity" }
              valueCodeableConcept: { $ref: "#/components/schemas/FHIRCodeableConcept" }
              valueSampledData: { $ref: "#/components/schemas/FHIRSampledData" }
              dataAbsentReason: { $ref: "#/components/schemas/FHIRCodeableConcept" }
    FHIRSampledData:
      type: object
      description: |
        An ECG recording's voltage samples: `data` holds the values, separated by spaces, each
        `origin + factor * value` in microvolts (factor is absent, so 1), `period` milliseconds
        apart; `E` marks a value that is not a finite number.
      required: [origin, period, dimensions, data]
      properties:
        origin: { $ref: "#/components/schemas/FHIRQuantity" }
        period: { type: number, description: Milliseconds between two samples. }
        factor: { type: number }
        dimensions: { type: integer, const: 1 }
        data: { type: string }
    FHIRQuantity:
      type: object
      properties:
        value: { type: number }
        unit: { type: string }
        system: { type: string, const: "http://unitsofmeasure.org" }
        code: { type: string, examples: ["/min"] }
    FHIRBundle:
      type: object
      description: A FHIR R4 searchset Bundle of Observations.
      required: [resourceType, type, link]
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string, const: searchset }
        link:
          type: array
          items:
            type: object
            required: [relation, url]
            properties:
              relation: { type: string, enum: [self, next] }
              url: { type: string, format: uri }
        entry:
          type: array
          description: Absent on an empty page (FHIR JSON has no empty arrays).
          items:
            type: object
            required: [fullUrl, resource]
            properties:
              fullUrl: { type: string, format: uri }
              resource: { $ref: "#/components/schemas/FHIRObservation" }
              search:
                type: object
                properties:
                  mode: { type: string, const: match }
