  /v1/ingest/bluetooth:
    post:
      tags: [ingest]
      operationId: ingestBluetooth
      summary: Upload one part of Bluetooth device values
      description: |
        One gzip NDJSON part (at most 64 MiB, never truncated), one characteristic value a
        standard Bluetooth health device sent per line: `{"at": "<RFC 3339 arrival time with
        offset>", "char": "2a37", "value": "<hex>", "session": "<id of the connection>",
        "device": {"name", "manufacturer", "model", "firmware"}, "device_user": <index>}`
        (`device` and `device_user` optional; the line format is in docs/connectors/bluetooth.md;
        `ohs-bridge` and the Swift and Kotlin SDKs write it). The server decodes heart rate with
        RR intervals, blood pressure, weight, body composition, glucose, temperature and pulse
        oximetry; other characteristics are stored and not mapped. The part is refused with
        400, and nothing is stored, when a line breaks the format; a value that does not decode
        is a failed record of its line only. Same headers, limits and answers as the Apple
        Health upload.
        Re-sending the same part is safe: the answer is 200 with `duplicate: true`. Other
        bytes under a (day, batch, part) already stored are a 409, and so is a part sent while
        this provider's data is being deleted for the user (nothing is kept; send it again
        once the deletion job is done). Each instance processes a
        bounded number of uploads at once; above it the answer is 503 with `Retry-After`.
      security:
        - userToken: [upload]
      parameters:
        - name: X-OHS-Type
          in: header
          required: true
          description: Always `gatt`.
          schema: { type: string, enum: [gatt] }
        - name: X-OHS-Day
          in: header
          required: true
          description: UTC day of the part's first line (the server does not check it).
          schema: { type: string, format: date }
        - name: X-OHS-Batch
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-OHS-Part
          in: header
          required: true
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, contentEncoding: binary }
          application/octet-stream:
            schema: { type: string, contentEncoding: binary }
      responses:
        "200":
          description: Stored (or already stored) and queued for processing.
          content:
            application/json:
              schema:
                type: object
                required: [key, duplicate]
                properties:
                  key: { type: string, description: Raw object key. }
                  duplicate: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The user started being deleted while this upload was stored (its token was accepted just before); nothing is kept.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503":
          description: Too many uploads in progress on this instance, or for this tenant.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /connect:
    get:
      tags: [connections]
      operationId: connectPage
      summary: Hosted connection page
      security: []
      description: |
        The page a connect session link opens, for the end user's browser. It shows the app name and
        logo of the session and one button per allowed provider with the user's connection status
        (connected, needs reconnecting, not connected). A button posts to `POST /connect/{provider}`.
        An unknown token is 404 and an expired one 410, as a page that says nothing more.
      parameters:
        - $ref: "#/components/parameters/ConnectSessionToken"
      responses:
        "200": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }

  /connect/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [connections]
      operationId: connectProviderPage
      summary: Hosted connection page for one provider
      security: []
      description: The connection page with only this provider's button. 404 when the session does not allow it.
      parameters:
        - $ref: "#/components/parameters/ConnectSessionToken"
      responses:
        "200": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }
    post:
      tags: [connections]
      operationId: connectStart
      summary: Start consent from the hosted page
      security: []
      description: |
        The form the page posts. Mints a single-use OAuth state exactly like
        `POST /v1/users/{id}/connections/{provider}`, with the session's `redirect_uri`, and sends the
        browser to the provider's consent page. The session stays usable until it expires.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [session]
              properties:
                session: { type: string, description: The token of the connect session link. }
      responses:
        "303":
          description: To the provider's consent page.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/ConnectHTML" }
        "404": { $ref: "#/components/responses/ConnectHTML" }
        "410": { $ref: "#/components/responses/ConnectHTML" }

  /oauth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: oauthCallback
      summary: OAuth redirect target registered with each provider
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to the tenant's redirect_uri with status (connected or error) and provider.
          headers:
            Location:
              schema: { type: string, format: uri }
        "200":
          description: Built-in result page, when the connect call gave no redirect_uri.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Unknown, used or expired state.
          content:
            text/html:
              schema: { type: string }
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /oauth/{provider}/signin:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: signInPage
      summary: Sign-in page of a provider without a consent page
      security: []
      description: |
        The `authorize_url` of a provider that has no consent page for other apps (Eight Sleep).
        An HTML form asking for the email and password of the user's account at the provider.
        404 for any other provider.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The sign-in form.
          content:
            text/html:
              schema: { type: string }
        "302":
          description: Expired state; back to the tenant's redirect_uri with status=error.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400":
          description: Unknown or used state.
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Not a provider that signs in with a password.
          content:
            text/html:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [provider-facing]
      operationId: signIn
      summary: Sign in to a provider without a consent page
      security: []
      description: |
        Posted by the sign-in form. The password is sent to the provider only, never logged, and
        kept sealed under `OHS_ENCRYPTION_KEY` with the connection, so the server can sign in
        again when the provider's token expires. A refused password renders the form again
        (401) and keeps the state; success ends like the OAuth callback.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state, email, password]
              properties:
                state: { type: string }
                email: { type: string }
                password: { type: string, format: password }
      responses:
        "302":
          description: Back to the tenant's redirect_uri with status (connected or error) and provider.
          headers:
            Location:
              schema: { type: string, format: uri }
        "200":
          description: Built-in result page, when the connect call gave no redirect_uri.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Missing field, or unknown or used state.
          content:
            text/html:
              schema: { type: string }
        "401":
          description: The provider refused the email or password; the form again.
          content:
            text/html:
              schema: { type: string }
        "429":
          description: The provider, or this server's rate limit, refused the attempt for now.
          content:
            text/html:
              schema: { type: string }
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /inbound/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [provider-facing]
      operationId: inboundProbe
      summary: Notification URL check and subscription challenge
      security: []
      description: |
        Providers check that a notification URL answers before they subscribe it. The answer
        is 200 with no body, or, for a provider that sends a subscription challenge (Strava's
        `hub.challenge`, Oura's `challenge`), 200 with the provider's expected echo. A
        challenge whose verify token does not match is 401. HEAD is answered like GET.
      responses:
        "200":
          description: Reachable; the challenge echo when the provider sent one.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [provider-facing]
      operationId: inbound
      summary: Provider notification endpoint
      security: []
      description: |
        Verified with the provider's own signature scheme. An accepted event queues a pull for
        every active connection of the provider user, or, for a notice a pull cannot fetch back
        (a deleted record), is stored as a raw object for each of them and queued for the ETL,
        which removes the record. A notice that cannot be stored is 500, so the provider
        retries.
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
      responses:
        "200": { description: Accepted. }
        "204": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: The notification could not be stored; the provider should retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /shl/{manifest_id}:
    parameters:
      - $ref: "#/components/parameters/ManifestID"
    post:
      tags: [shares]
      operationId: shareManifest
      summary: Manifest request of a share link (SMART Health Links)
      security: []
      description: |
        The `url` of a share link's payload, called by the reader's viewer (the built-in one at
        `/shl/view` or any other that implements SMART Health Links) with no credential: the
        manifest id is the secret. Any origin may call it (`Access-Control-Allow-Origin: *`).
        Every request on a known link is recorded in the audit log (`share.access`, actor
        `share_link`).

        The answer holds the one file of the share, `application/fhir+json` encrypted as a
        JWE: `embedded` when it fits `embeddedLengthMax` (or no limit was sent), else a
        `location` that serves it once, within 15 minutes. A link that is unknown, revoked,
        disabled or past its expiry is a 404, and the cases cannot be told apart. A wrong or
        missing passcode is a 401 with `remainingAttempts`; the 10th wrong passcode disables
        the link for good. A link busy past 2 seconds is a 503 with `Retry-After`. Unknown
        members of the body are ignored. Rate limited per client address
        (`OHS_RATE_LIMIT_OAUTH`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareManifestRequest" }
      responses:
        "200":
          description: The manifest.
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareManifest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The passcode is wrong or missing.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/PasscodeProblem" }
        "404": { $ref: "#/components/responses/ShareInactive" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ShareBusy" }
    options:
      tags: [shares]
      operationId: shareManifestPreflight
      summary: CORS preflight of a manifest request
      security: []
      description: Lets a viewer on any origin post a manifest request with a JSON body.
      responses:
        "204":
          description: Allowed.
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
            Access-Control-Allow-Methods: { schema: { type: string, const: POST } }
            Access-Control-Allow-Headers: { schema: { type: string, const: Content-Type } }
            Access-Control-Max-Age: { schema: { type: string } }

  /shl/file/{ticket}:
    parameters:
      - name: ticket
        in: path
        required: true
        description: The last path segment of a manifest's `location`.
        schema: { type: string }
    get:
      tags: [shares]
      operationId: shareFile
      summary: The file at a manifest's location, once
      security: []
      description: |
        Serves the encrypted file (a compact JWE) of a manifest's `location` once, within 15
        minutes of the manifest request. A used or expired location, or one of a share that
        stopped since, is a 404. HEAD is refused (405), so a link checker never uses the
        location up. Rate limited with the manifest route. Recorded in the audit log
        (`share.access`, outcome `file`).
      responses:
        "200":
          description: The JWE.
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/jose:
              schema: { type: string }
        "404": { $ref: "#/components/responses/ShareInactive" }
        "405":
          description: A method other than GET.
          headers:
            Allow: { schema: { type: string, const: GET } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ShareBusy" }

  /shl/view:
    get:
      tags: [shares]
      operationId: shareViewer
      summary: The built-in share link viewer
      security: []
      description: |
        A page that opens a share link given in its address fragment
        (`/shl/view#shlink:/...`), so the key never reaches a server. It asks the reader's name
        (and the passcode when the link needs one), sends the manifest request to this
        instance, decrypts the file in the browser (WebCrypto) and shows one table per metric
        with its unit, time and source. It shows the records as recorded, with no
        interpretation. Its own script and stylesheet only (`/shl/view/view.mjs`,
        `/shl/view/view.css`), under a Content-Security-Policy that allows nothing else.
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /shl/view/{asset}:
    get:
      tags: [shares]
      operationId: shareViewerAsset
      summary: The viewer's script or stylesheet
      security: []
      parameters:
        - name: asset
          in: path
          required: true
          schema: { type: string, enum: [view.mjs, view.css] }
      responses:
        "200":
          description: The file.
          content:
            text/javascript:
              schema: { type: string }
            text/css:
              schema: { type: string }
        "404":
          description: No such file.
          content:
            text/plain:
              schema: { type: string }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Read-only MCP server (Streamable HTTP, stateless)
      security:
        - tenantKey: []
        - userToken: []
      description: |
        Model Context Protocol JSON-RPC messages (initialize, tools/list, tools/call). A
        tenant key reads every user of the tenant and passes `user_id` to each tool; a user
        token needs the `read` scope and reads only its own user. Tools: `list_users`,
        `list_quantity_types`, `get_samples`, `get_category_samples`, `get_sleep`,
        `get_workouts`, `get_workout_route`, `get_nutrition`, `get_daily`, `get_rr_intervals`,
        `get_hrv`, `get_menstrual_cycles`, `get_tags`, `get_coverage`, `list_connections`. Each
        tool result is JSON text with `records`, `next_cursor` and `truncated`. A refusal (missing `user_id`, another tenant's user, `limit` above 1000)
        is a tool error inside a 200, as MCP prescribes. See docs/mcp.md.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        "202": { description: Notification accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: The tenant of the calling key
      description: |
        The tenant the key belongs to, whether it is the instance admin (the one tenant whose keys
        manage the providers, see /v1/admin/providers) and which key is calling.
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/keys:
    get:
      tags: [tenant]
      operationId: listKeys
      summary: The tenant's API keys
      description: |
        Every key of the tenant, revoked ones included, newest first. Only the prefix of a key is
        stored in clear; the secret itself was shown once, when the key was created.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tenant]
      operationId: createKey
      summary: Create an API key for the tenant
      description: |
        A new key of the calling key's tenant, as `ohs admin key create` makes. The whole key is in
        this answer only. To rotate: deploy the new key, then revoke the old one. Recorded in the
        audit log as `key.create`.
      requestBody:
        required: false
        description: Empty, or an empty object.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: "The key, with its secret. Sent with `Cache-Control: no-store`."
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [tenant]
      operationId: revokeKey
      summary: Revoke an API key
      description: |
        Every call with the key is refused from now on. A key cannot revoke itself (409): revoke it
        with another key of the tenant. Revoking a revoked key changes nothing. Recorded in the
        audit log as `key.revoke`.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/pipeline:
    get:
      tags: [pipeline]
      operationId: getPipeline
      summary: The tenant's pipeline, stage by stage
      description: |
        Counts of the tenant's work at each stage, in the order data flows: the sources (providers
        that are on, and any provider still holding the tenant's connections), the sync runs, the
        processing jobs, the raw archive and the webhook deliveries. Counts only, never a health
        value. The console's overview is this answer.
      responses:
        "200":
          description: The pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/pipeline/sync-runs:
    get:
      tags: [pipeline]
      operationId: listTenantSyncRuns
      summary: Sync runs of every user of the tenant
      description: |
        The sync runs of all the tenant's users, newest first, each with its user. Filter by
        `status` (for example `failed`, the runs that gave up) and by provider.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, retrying, rate_limited, succeeded, failed, cancelled] }
        - name: provider
          in: query
          description: Only this provider's runs.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TenantSyncRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/pipeline/etl-jobs:
    get:
      tags: [pipeline]
      operationId: listETLJobs
      summary: Processing jobs of the tenant
      description: |
        The jobs that turn stored raw payloads into records, newest first. `parked` (the default)
        lists the jobs that failed 5 times and wait for a retry; `pending` and `running` list the
        work in flight. Done jobs are summed up by each user's coverage report.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [parked, pending, running], default: parked }
        - name: provider
          in: query
          description: Only this provider's jobs.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ETLJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/pipeline/etl-jobs/retry:
    post:
      tags: [pipeline]
      operationId: retryParkedETLJobs
      summary: Retry every parked processing job
      description: |
        Queues every parked job of the tenant again with fresh attempts, or only one provider's. A
        job that fails for the same reason parks again after 5 attempts.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string, description: Only this provider's parked jobs. }
      responses:
        "200":
          description: How many jobs were queued again.
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties:
                  retried: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/pipeline/etl-jobs/{job_id}/retry:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [pipeline]
      operationId: retryETLJob
      summary: Retry one parked processing job
      description: Queues the job again with fresh attempts. Only a parked job can be retried (409 otherwise).
      responses:
        "200":
          description: The job, pending again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ETLJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/providers:
    get:
      tags: [admin]
      operationId: listAdminProviders
      summary: Every provider of this build and how it stands (instance admin)
      description: |
        Only a key of the instance admin tenant may call it (403 otherwise; `ohs admin tenant list`
        shows which tenant that is). Provider keys are instance wide: every tenant's users connect
        through the same provider apps. Secret keys are never served, only whether they are set.
        `public_url` is false while `OHS_PUBLIC_URL` is unset: the redirect and notification URLs
        then name localhost, which no provider can reach.
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [data, public_url]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminProvider" }
                  public_url: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/providers/{provider}:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [admin]
      operationId: getAdminProvider
      summary: One provider and how it stands (instance admin)
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: updateAdminProvider
      summary: Save a provider's keys, or turn it on or off (instance admin)
      description: |
        `keys` sets each named key (null removes it); keys left out are kept. The new keys are
        checked with the provider's own rules before anything is stored (422 with the reason when
        they are refused), then sealed with `OHS_ENCRYPTION_KEY` and applied by every process
        within 30 seconds. While any of the provider's `OHS_` environment variables is set, its keys
        come from there and `keys` is refused (409); `enabled` still applies. Recorded in the audit
        log as `config.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProviderPatch" }
      responses:
        "200":
          description: The provider after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The provider's rules refused the keys; nothing was stored.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [admin]
      operationId: forgetAdminProvider
      summary: Forget what the console saved for a provider (instance admin)
      description: |
        Deletes the keys and the switch saved for the provider. Environment variables are not
        touched. Connections and data are kept. 404 when nothing was saved.
      responses:
        "200":
          description: The provider after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/tenants:
    get:
      tags: [admin]
      operationId: listAdminTenants
      summary: Every tenant of the instance, oldest first (instance admin)
      description: |
        Only a key of an instance admin tenant may call the `/v1/admin/tenants` routes (403
        otherwise). Each tenant with its count of active keys, paged like the users. See
        docs/admin-api.md.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of tenants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createAdminTenant
      summary: Create a tenant and its first API key (instance admin)
      description: |
        A new tenant, never an instance admin (making one stays `ohs admin tenant`, run on the
        server), with its first key, as `ohs admin tenant create` makes. The whole key is in this
        answer only. `Idempotency-Key` is not honoured: a replay would mean storing the key.
        Recorded as `tenant.create` in the caller's audit log and in the new tenant's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminTenantRequest" }
      responses:
        "201":
          description: "The tenant, with its first key and the key's secret. Sent with `Cache-Control: no-store`."
          headers:
            Location:
              schema: { type: string }
              description: /v1/admin/tenants/{tenant_id}
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAdminTenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/admin/tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: getAdminTenant
      summary: One tenant (instance admin)
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/pipeline:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: getAdminTenantPipeline
      summary: A tenant's pipeline, stage by stage (instance admin)
      description: The answer the tenant's own key gets from GET /v1/pipeline.
      responses:
        "200":
          description: The pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/keys:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: listAdminTenantKeys
      summary: A tenant's API keys (instance admin)
      description: |
        Every key of the tenant, revoked ones included, oldest first. `current` is true only for the
        key making the call, so only in a listing of the caller's own tenant.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      operationId: createAdminTenantKey
      summary: Create an API key for a tenant (instance admin)
      description: |
        As `ohs admin key create --tenant` makes. The whole key is in this answer only;
        `Idempotency-Key` is not honoured. Recorded as `key.create` in the caller's audit log and in
        the tenant's.
      requestBody:
        required: false
        description: Empty, or an empty object.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: "The key, with its secret. Sent with `Cache-Control: no-store`."
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - name: key_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      operationId: revokeAdminTenantKey
      summary: Revoke a tenant's API key (instance admin)
      description: |
        Every call with the key is refused from now on. Revoking a revoked key changes nothing. The
        key making the call cannot be revoked (409). A key of another tenant is a 404. Recorded as
        `key.revoke` in the caller's audit log and in the tenant's.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/tenants/{tenant_id}/demo-user:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    post:
      tags: [admin]
      operationId: createAdminTenantDemoUser
      summary: Fill a user of a tenant with synthetic data (instance admin)
      description: |
        What `ohs seed --demo --tenant` does: the tenant's user with `external_ref` is reused, or
        created, and `days` days of made-up data from the persona's sources (six for `mix`), ending
        yesterday, are written for it. Every record is marked `{"synthetic": true}`. Running it again
        adds nothing for the days already there. Takes a few seconds for 90 days. Recorded as
        `data.write` in the caller's audit log and in the tenant's. See docs/demo.md.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoUserRequest" }
      responses:
        "200":
          description: The user existed; the days it lacked were written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoUser" }
        "201":
          description: The user was created and filled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The user with this external_ref is being deleted.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/tenants/{tenant_id}/providers:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: listAdminTenantProviders
      summary: The providers of one tenant, each with its switch (instance admin)
      description: |
        Every provider the instance knows, in the order of `GET /v1/admin/providers`, with the
        tenant's switch: on unless an instance admin turned it off. Recorded as `config.read`.
        See docs/admin-api.md.
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminTenantProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/providers/{provider}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/Provider"
    patch:
      tags: [admin]
      operationId: updateAdminTenantProvider
      summary: Turn a provider off, or back on, for one tenant (instance admin)
      description: |
        While a provider is off for a tenant, `GET /v1/providers` and the connect page leave it
        out for the tenant, starting a connection, the OAuth callback, uploads and self reports
        answer 403, sync now answers 409, no pull is planned and a queued one ends `cancelled`
        without reaching the provider. Connections and data are kept. The switch applies at once
        in the process that answers and within 30 seconds in the others. Recorded as
        `tenant.provider` in the caller's audit log and in the tenant's, together with the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTenantProviderPatch" }
      responses:
        "200":
          description: The provider for the tenant after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenantProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/providers/{provider}/keys:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [admin]
      operationId: getAdminTenantProviderKeys
      summary: A tenant's own keys for a provider, without their values (instance admin)
      description: |
        Whether the tenant has keys of its own for the provider and how they stand. No value is
        ever served: `client_id` shows its first and last four characters only, and each key says
        whether it is set. 409 for a provider that takes no keys (a device source). Recorded as
        `config.read`. See docs/admin-api.md.
      responses:
        "200":
          description: The tenant's keys for the provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenantProviderKeys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [admin]
      operationId: putAdminTenantProviderKeys
      summary: Set or replace a tenant's own keys for a provider (instance admin)
      description: |
        The tenant's users then connect the provider through the tenant's OAuth application
        (their consent screen shows it) instead of the instance's; other tenants keep the
        instance's keys. The provider becomes available to the tenant even when the instance has
        no keys for it. The body replaces every key: give the required ones (400 otherwise); the
        provider's own rules check them before anything is stored (422 with the reason). They are
        sealed with `OHS_ENCRYPTION_KEY` and apply at once in the process that answers, within 30
        seconds in the others. A connection keeps the keys it was made with: keys with the same
        `CLIENT_ID`, `REGION` and `ENVIRONMENT` (a secret rotated) keep the tenant's connections,
        keys naming another application set the connections made with the old ones
        `needs_reauth` (counted in `reauth_required`). The callback URL stays the instance's.
        Recorded as `tenant.provider_keys` in the caller's audit log and in the tenant's, together
        with the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTenantProviderKeysPut" }
      responses:
        "200":
          description: The tenant's keys after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenantProviderKeys" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The provider's rules refused the keys; nothing was stored.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [admin]
      operationId: deleteAdminTenantProviderKeys
      summary: Remove a tenant's own keys for a provider (instance admin)
      description: |
        The tenant's new connections go back to the instance's keys (or the provider is no longer
        available to the tenant when the instance has none). Its connections made with the removed
        keys are set `needs_reauth`, with a `connection.needs_reauth` webhook event each, and the
        consents started with them are dropped; connecting the user again uses the keys in force
        then. 404 when the tenant has no keys for the provider. Recorded as
        `tenant.provider_keys`, like a change.
      responses:
        "200":
          description: The tenant's keys after the change (`set` false).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenantProviderKeys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/tenants/{tenant_id}/users:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [admin]
      operationId: listAdminTenantUsers
      summary: List the tenant's end users, oldest first (instance admin, one tenant)
      description: |
        `GET /v1/users` (`listUsers`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Read only. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      operationId: createAdminTenantUser
      summary: Create an end user (instance admin, one tenant)
      description: |
        `POST /v1/users` (`createUser`) for the tenant of `tenant_id`, run with an
        instance admin key: the same body, parameters and answer as the tenant's own key
        gets; a `Location` points at the admin route. Recorded in the caller's audit log
        and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: An empty body creates a user without an external reference.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
              description: /v1/admin/tenants/{tenant_id}/users/{id}
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A user with this external_ref exists, or an idempotent request with this key is in progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyMismatch" }

  /v1/admin/tenants/{tenant_id}/users/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [admin]
      operationId: getAdminTenantUser
      summary: Get one end user (instance admin, one tenant)
      description: |
        `GET /v1/users/{id}` (`getUser`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Read only. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: deleteAdminTenantUser
      summary: Hard-delete an end user (instance admin, one tenant)
      description: |
        `DELETE /v1/users/{id}` (`deleteUser`) for the tenant of `tenant_id`, run with an
        instance admin key: the same body, parameters and answer as the tenant's own key
        gets; a `Location` points at the admin route. Recorded in the caller's audit log
        and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      responses:
        "202":
          description: Deletion accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/users/{id}/daily:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [admin]
      operationId: listAdminTenantDaily
      summary: Daily summaries (instance admin, one tenant)
      description: |
        `GET /v1/users/{id}/daily` (`listDaily`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Read only. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/users/{id}/samples:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [admin]
      operationId: listAdminTenantSamples
      summary: Quantity samples of one type (instance admin, one tenant)
      description: |
        `GET /v1/users/{id}/samples` (`listSamples`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Read only. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - name: type
          in: query
          required: true
          description: Canonical quantity type, for example heart_rate or step_count. A name outside the quantity type catalog is a 400 (unless this user has samples of it).
          schema: { type: string, examples: [heart_rate] }
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/End"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page, by start_date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamplePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/tenants/{tenant_id}/users/{id}/samples/stats:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [admin]
      operationId: getAdminTenantSampleStats
      summary: Statistics of one quantity type per hour or per local day (instance admin, one tenant)
      description: |
        `GET /v1/users/{id}/samples/stats` (`sampleStats`) for the tenant of `tenant_id`, read with an
        instance admin key: the same parameters and the same answer as the tenant's own key
        gets. Read only. Recorded in the caller's audit log and, actor `admin`, in the tenant's.
        See docs/admin-api.md.
      parameters:
        - name: type
          in: query
          required: true
          description: Canonical quantity type, as for listSamples.
          schema: { type: string }
        - name: interval
          in: query
          description: Width of the intervals.
          schema: { type: string, enum: [hour, day], default: day }
        - name: tz
          in: query
          description: IANA time zone of the intervals; a day runs from local midnight to local midnight.
          schema: { type: string, default: UTC, example: Europe/Paris }
        - name: start
          in: query
          required: true
          description: Inclusive lower bound, RFC 3339 or YYYY-MM-DD (midnight in tz). Widened to a whole interval.
          schema:
            oneOf:
              - { type: string, format: date-time }
              - { type: string, format: date }
        - name: end
          in: query
          required: true
          description: Exclusive upper bound, RFC 3339 or YYYY-MM-DD (midnight in tz). Widened to a whole interval; at most 10000 intervals after start.
          schema:
