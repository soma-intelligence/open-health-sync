# SPDX-License-Identifier: AGPL-3.0-only
#
# Publishes server.json to the official MCP registry (registry.modelcontextprotocol.io),
# which MCP clients and directories read to list servers. Runs when a maintainer publishes
# the draft release the release workflow prepared; run it by hand to publish the version
# server.json names on a branch or tag.
#
# Authentication is GitHub OIDC, so no secret: the registry lets this repository publish
# io.github.soma-intelligence/open-health-sync. The registry pulls the image named in
# server.json and checks its io.modelcontextprotocol.server.name label (deploy/Dockerfile),
# so the GHCR package has to be public.
name: mcp-registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISHER_VERSION: v1.8.1
  PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
