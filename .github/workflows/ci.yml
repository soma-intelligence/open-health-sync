name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Console script helpers (node --test, no dependency)
        run: make test-js
      - name: Fuzz the Apple Health upload parser
        run: go test ./connectors/applehealth/ -run '^$' -fuzz FuzzParseUpload -fuzztime=30s
      - name: Integration and API contract (Docker available on the runner)
        run: make integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Quickstart end to end (compose stack)
        run: make e2e

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags: the test builds the last release from its tag
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Upgrade from the last release with data in it
        run: make upgrade-test

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: docker/setup-buildx-action@v3
      - name: Backup and restore end to end (compose stack)
        run: make backup-test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build amd64 and arm64 (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  helm:
    # The chart in deploy/helm/ohs: lint, render, schema check, then a real
    # install on kind against an in-cluster TimescaleDB, with the image built
    # from this checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint
        run: |
          helm lint --strict deploy/helm/ohs
          helm lint --strict deploy/helm/ohs --set database.url=postgres://ohs:ohs@db:5432/ohs
          helm lint --strict deploy/helm/ohs -f deploy/helm/ci/all-optional.yaml
      - name: Render with the default values
        run: |
          # Without a database the render must stop and say what to set.
          if helm template ohs deploy/helm/ohs > /dev/null 2> err.txt; then
            echo "the chart rendered without database.url"; exit 1
          fi
          grep -q "set database.url" err.txt
          helm template ohs deploy/helm/ohs --set database.url=postgres://ohs:ohs@db:5432/ohs > default.yaml
      - name: Render every optional template
        run: |
          helm template ohs deploy/helm/ohs -f deploy/helm/ci/all-optional.yaml > all-optional.yaml
          for kind in Ingress ServiceMonitor NetworkPolicy HorizontalPodAutoscaler PodDisruptionBudget; do
            grep -qx "kind: $kind" all-optional.yaml || { echo "all-optional.yaml has no $kind"; exit 1; }
          done
          test "$(grep -cx 'kind: Deployment' all-optional.yaml)" -eq 3
      - name: Check the manifests against the Kubernetes schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 -skip ServiceMonitor default.yaml all-optional.yaml
      - uses: helm/kind-action@v1
        with:
          cluster_name: ohs
      - uses: docker/setup-buildx-action@v3
      - name: Build the image and load it into kind
        run: |
          docker buildx build --load -f deploy/Dockerfile -t ohs:ci .
          kind load docker-image ohs:ci --name ohs
      - name: Start Postgres with TimescaleDB
        run: |
          kubectl apply -f deploy/helm/ci/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=300s
      - name: Install the chart
        run: helm install ohs deploy/helm/ohs -f deploy/helm/ci/kind.yaml --wait --timeout 5m
      - name: The pod is Ready and answers /healthz
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=ohs,app.kubernetes.io/component=server --timeout=120s
          kubectl port-forward svc/ohs 18080:8080 > port-forward.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          kubectl exec deploy/ohs -- /ohs doctor --quick
          helm test ohs --logs
      - name: Upgrade runs the migrations again and keeps the encryption key
        run: |
          before=$(kubectl get secret ohs-secret -o jsonpath='{.data.OHS_ENCRYPTION_KEY}')
          helm upgrade ohs deploy/helm/ohs -f deploy/helm/ci/kind.yaml --set config.logLevel=debug --wait --timeout 5m
          after=$(kubectl get secret ohs-secret -o jsonpath='{.data.OHS_ENCRYPTION_KEY}')
          test -n "$before"
          test "$before" = "$after" || { echo "the upgrade changed OHS_ENCRYPTION_KEY"; exit 1; }
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=ohs,app.kubernetes.io/component=server --timeout=120s
          helm test ohs --logs
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,pvc,secret,configmap,job -o wide || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/instance=ohs --all-containers --prefix --tail=200 || true
          kubectl logs deploy/postgres --tail=100 || true
          kubectl get events --sort-by=.lastTimestamp || true

  guard:
    # Fork pull requests get no secrets and the guard fails closed without
    # its list, so it runs on pushes and same-repository pull requests only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Guard self-test
        run: scripts/guard_test.sh
      - name: Forbidden terms
        env:
          OHS_FORBIDDEN_TERMS: ${{ secrets.OHS_FORBIDDEN_TERMS }}
        run: |
          git branch --track main origin/main 2>/dev/null || true
          scripts/guard.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # The expected sha256 is pinned here, taken from the release's
        # gitleaks_<version>_checksums.txt and checked against the tarball.
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --redact --config .gitleaks.toml
