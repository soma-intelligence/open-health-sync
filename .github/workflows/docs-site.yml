name: docs-site

# Builds the documentation site whenever its sources change, and keeps the static
# output as a downloadable artifact so a pull request can be previewed locally.
on:
  push:
    branches: [main]
    paths: ["docs-site/**", "docs/**", "api/openapi.yaml", "deploy/docker-compose.yml"]
  pull_request:
    paths: ["docs-site/**", "docs/**", "api/openapi.yaml", "deploy/docker-compose.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run types:check
      - run: npm run build
      - run: npm run check:links
      - name: Keep the static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs-site/out
          retention-days: 14
