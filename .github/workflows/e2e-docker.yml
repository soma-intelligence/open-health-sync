name: e2e-docker

# The whole stack in Docker: the quickstart end to end (make e2e) and the React
# admin console driven by Playwright in its own container (test/e2e/console_ui.sh).
on:
  workflow_dispatch:
  push:
    branches: [main, "test/**"]
  pull_request:
    paths:
      - "deploy/**"
      - "internal/console/**"
      - "web/console/**"
      - "test/e2e/**"
      - ".github/workflows/e2e-docker.yml"

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Quickstart end to end (compose stack)
        run: make e2e

  console-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Console UI end to end (compose stack + Playwright container)
        run: test/e2e/console_ui.sh
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-ui
          path: test/e2e/console-ui/out
          retention-days: 14

  console-audit:
    # The UI audit probes (axe, keyboard, states, forms, phone width). Findings
    # land in the artifact; the job only reports.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Console UI audit (compose stack + Playwright container)
        run: test/e2e/console_ui.sh
        env:
          OHS_UI_AUDIT: "1"
      - name: Audit output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-audit
          path: test/e2e/console-ui/out
          retention-days: 14
