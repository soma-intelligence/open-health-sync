# SPDX-License-Identifier: AGPL-3.0-only
#
# Coverage-guided fuzzing of the Apple Health upload parser. Pull requests run
# the seed corpus only (go test ./... in ci.yml), which is deterministic; the
# mutation search runs here, nightly and on demand. A failing input is kept
# as an artifact: copy it into connectors/applehealth/testdata/fuzz/ to turn
# it into a regression test.
name: fuzz

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applehealth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Fuzz the Apple Health upload parser
        run: go test ./connectors/applehealth/ -run '^$' -fuzz FuzzParseUpload -fuzztime=10m
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-applehealth-failure
          path: connectors/applehealth/testdata/fuzz/
          if-no-files-found: ignore
