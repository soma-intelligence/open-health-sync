# SPDX-License-Identifier: AGPL-3.0-only
#
# Release on a version tag (v0.0.1, v0.1.0, ...): unit tests, static binaries
# for linux and darwin on amd64 and arm64, a GitHub release with checksums and
# the notes from docs/release-notes/<tag>.md, and a multi-arch image on GHCR.
#
# No half release: the GitHub release is created as a draft first, the image
# is pushed once the binaries are built, and the assets are uploaded to the
# draft. The release stays a draft: a maintainer reads it and presses Publish.
# A failure anywhere leaves only a draft (and possibly an image tag), never a
# public release without its assets. Once published, server.json goes to the
# MCP registry (mcp-registry.yml, on the release's published event).
#
# Image tags: <version>, plus edge for a version without a hyphen (not for
# v0.1.0-rc.1). No `latest` while the version is 0.x.
#
# Actions are pinned by commit SHA, the release they resolve to in a comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/soma-intelligence/open-health-sync

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Release notes and compose default version match the tag
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: go vet ./...
      - run: go test ./...

  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run finds the draft of the failed run and keeps it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, reusing it"
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Open Health Sync ${GITHUB_REF_NAME}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag $flags

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="ohs_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "dist/$name/ohs" ./cmd/ohs
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ohs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    needs: [draft, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # edge follows final releases only; an empty line adds no tag.
          case "$version" in
            *-*) echo "edge=" >> "$GITHUB_OUTPUT" ;;
            *) echo "edge=${IMAGE}:edge" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and push amd64 and arm64
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.edge }}
          labels: |
            org.opencontainers.image.title=Open Health Sync
            org.opencontainers.image.description=Self-hostable health data aggregator
            org.opencontainers.image.source=https://github.com/soma-intelligence/open-health-sync
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Self-hostable health data aggregator
            index:org.opencontainers.image.source=https://github.com/soma-intelligence/open-health-sync
            index:org.opencontainers.image.licenses=AGPL-3.0-only

  publish:
    needs: [draft, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: ohs-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt
      - name: Upload assets to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
      - name: Ready for review
        run: |
          {
            echo "Draft release ${GITHUB_REF_NAME} has its binaries, checksums and image."
            echo "Publish it at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
