# SPDX-License-Identifier: AGPL-3.0-only
#
# Release on a version tag (v0.0.1, v0.1.0, ...): unit tests, static binaries
# for linux and darwin on amd64 and arm64, a GitHub release with checksums and
# the notes from docs/release-notes/<tag>.md, and a multi-arch image on GHCR.
#
# No half release: the GitHub release is created as a draft first, the image
# is pushed and signed once the binaries are built, the checksums are signed,
# and the assets are uploaded to the draft. The release stays a draft: a
# maintainer reads it and presses Publish. A failure anywhere leaves only a
# draft (and possibly an image tag, signed or not), never a public release
# without its assets or signatures. Once published, server.json goes to the
# MCP registry (mcp-registry.yml, on the release's published event).
#
# Signing is keyless (Sigstore cosign with the workflow's GitHub OIDC token):
# the image is signed by its index digest, never by a tag, and checksums.txt
# gets a Sigstore bundle (checksums.txt.sigstore.json) attached to the release.
# Only the image and checksums jobs get id-token: write. Verification commands
# are in SECURITY.md and docs/hardening.md.
#
# Image tags: <version>, plus edge for a version without a hyphen (not for
# v0.1.0-rc.1). No `latest` while the version is 0.x.
#
# Actions are pinned by commit SHA, the release they resolve to in a comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/soma-intelligence/open-health-sync

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Release notes and compose default version match the tag
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: go vet ./...
      - run: go test ./...

  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run finds the draft of the failed run and keeps it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, reusing it"
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Open Health Sync ${GITHUB_REF_NAME}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag $flags

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="ohs_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "dist/$name/ohs" ./cmd/ohs
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    needs: [draft, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature of the pushed digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # edge follows final releases only; an empty line adds no tag.
          case "$version" in
            *-*) echo "edge=" >> "$GITHUB_OUTPUT" ;;
            *) echo "edge=${IMAGE}:edge" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and push amd64 and arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.edge }}
          labels: |
            org.opencontainers.image.title=Open Health Sync
            org.opencontainers.image.description=Self-hostable health data aggregator
            org.opencontainers.image.source=https://github.com/soma-intelligence/open-health-sync
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Self-hostable health data aggregator
            index:org.opencontainers.image.source=https://github.com/soma-intelligence/open-health-sync
            index:org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # The index digest the tags point at: signing a tag would sign
          # whatever the tag names at that moment.
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "no image digest from the push step: '$DIGEST'" >&2; exit 1 ;;
          esac
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signature of checksums.txt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ohs-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          if-no-files-found: error

  publish:
    needs: [draft, binaries, image, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ohs-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: checksums
      - name: Checksums match the binaries
        working-directory: dist
        run: sha256sum --check --strict checksums.txt
      - name: Upload assets to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz \
            dist/checksums.txt dist/checksums.txt.sigstore.json --clobber
      - name: Ready for review
        run: |
          {
            echo "Draft release ${GITHUB_REF_NAME} has its binaries, signed checksums and signed image."
            echo "Publish it at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
