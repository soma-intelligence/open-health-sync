name: sdks

on:
  push:
    branches: [main]
    paths:
      - "sdks/**"
      - "api/openapi.yaml"
      - "connectors/applehealth/**"
      - "test/e2e/sdks.sh"
      - "test/e2e/lib.sh"
      - ".github/workflows/sdks.yml"
  pull_request:
    paths:
      - "sdks/**"
      - "api/openapi.yaml"
      - "connectors/applehealth/**"
      - "test/e2e/sdks.sh"
      - "test/e2e/lib.sh"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon build compileExampleKotlin

  swift-linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    defaults:
      run:
        working-directory: sdks/swift
    steps:
      - uses: actions/checkout@v7
      - run: swift build --build-tests
      - run: swift test

  swift-apple:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdks/swift
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - name: Build for iOS (HealthKit target included)
        run: xcodebuild build -scheme OpenHealthSync-Package -destination 'generic/platform=iOS Simulator' -quiet

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # Every SDK's quickstart example against the compose stack built from this checkout.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Swift toolchain of the runner image
        run: swift --version
      - name: SDK examples against a live server
        run: test/e2e/sdks.sh kotlin swift react-native flutter
