name: fhir-validate

# The FHIR golden files (internal/fhir/testdata) through the official HL7
# validator against FHIR R4 (4.0.1). Any validator error fails the job.
on:
  push:
    branches: [main]
    paths:
      - "internal/fhir/**"
      - "scripts/fhir-validate.sh"
      - ".github/workflows/fhir-validate.yml"
  pull_request:
    paths:
      - "internal/fhir/**"
      - "scripts/fhir-validate.sh"
      - ".github/workflows/fhir-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: HL7 validator on the golden files
        env:
          FHIR_VALIDATOR_DIR: ${{ runner.temp }}/fhir-validator
        run: make fhir-validate
