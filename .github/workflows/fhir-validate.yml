name: fhir-validate

# The FHIR golden files (internal/fhir/testdata) through the official HL7
# validator against FHIR R4 (4.0.1). Any validator error fails the job.
on:
  push:
    branches: [main]
    paths:
      - "internal/fhir/**"
      - "scripts/fhir-validate.sh"
      - ".github/workflows/fhir-validate.yml"
  pull_request:
    paths:
      - "internal/fhir/**"
      - "scripts/fhir-validate.sh"
      - ".github/workflows/fhir-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: HL7 validator on the golden files
        env:
          FHIR_VALIDATOR_DIR: ${{ runner.temp }}/fhir-validator
        run: make fhir-validate
