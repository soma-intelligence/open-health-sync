name: examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "sdks/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "sdks/**"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the debug APK
        working-directory: examples/android
        run: ./gradlew --no-daemon assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - name: Build for the iOS simulator
        working-directory: examples/ios
        run: |
          xcodegen generate
          xcodebuild build -project OHSExample.xcodeproj -scheme OHSExampleApp \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: SDK dependencies (the app links it by path)
        working-directory: sdks/react-native
        run: npm ci --no-audit --no-fund
      - name: Type check and bundle the Android JavaScript
        working-directory: examples/react-native
        # No lockfile in the repository (see examples/react-native/.gitignore); versions are pinned.
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx expo export --platform android --output-dir dist-check
