# SPDX-License-Identifier: AGPL-3.0-only
#
# kill -9 crash recovery on the compose stack (make reliability). It takes
# over 10 minutes (a job cut by the crash is reclaimed after the queue's
# visibility timeout), so it runs on main and nightly, not on every pull
# request.
name: reliability

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: kill -9 crash recovery (compose stack)
        run: make reliability
