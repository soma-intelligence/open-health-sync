# SPDX-License-Identifier: AGPL-3.0-only
#
# kill -9 crash recovery on the compose stack (make reliability). It takes
# over 10 minutes (a job cut by the crash is reclaimed after the queue's
# visibility timeout), so it runs on main and nightly, not on every pull
# request.
name: reliability

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: kill -9 crash recovery (compose stack)
        run: make reliability
