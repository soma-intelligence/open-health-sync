version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 0.150 and 0.151 validate OpenAPI 3.1 bodies with JSON Schema 2020-12 and
      # fail to compile a $ref nested inside a copied component
      # (json-pointer ... #/components/schemas/FHIRCoding not found), which
      # breaks test/contract. Lift once a release passes those tests.
      - dependency-name: github.com/getkin/kin-openapi
        versions: [">= 0.150.0"]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    ignore:
      # fumadocs-ui is an alias (npm:@fumadocs/base-ui@X), which Dependabot does
      # not update, and base-ui pins fumadocs-core to its own exact version, so a
      # core bump alone fails npm ci with ERESOLVE (#175, #201). Bump both by
      # hand, together: fumadocs-core and the base-ui version of the alias.
      - dependency-name: fumadocs-core
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /sdks/server/typescript
    schedule:
      interval: weekly
    ignore:
      # The types follow the Node version CI runs (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      sdk-npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: cargo
    directory: /bridge
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # A new Go minor moves go.mod, CI and the Dockerfile together, by hand.
      # Patch releases of the same minor still come as digest updates.
      - dependency-name: golang
        update-types: [version-update:semver-minor]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
