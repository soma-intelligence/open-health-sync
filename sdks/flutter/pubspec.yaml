# SPDX-License-Identifier: AGPL-3.0-only
name: open_health_sync
description: >-
  Dart and Flutter client for Open Health Sync, the open source health data
  aggregator: Apple Health, Health Connect, Oura, WHOOP, Withings and FHIR R4.
version: 0.1.0
repository: https://github.com/soma-intelligence/open-health-sync/tree/main/sdks/flutter
issue_tracker: https://github.com/soma-intelligence/open-health-sync/issues
documentation: https://github.com/soma-intelligence/open-health-sync/blob/main/docs/sdks/flutter.md
topics:
  - health
  - wearables
  - fhir
  - healthkit
  - health-connect

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^4.0.0
  http: ^1.2.0

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
